<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 不插 <base>：/view 网关的网址总带 index.html，相对路径本来就对；插了 <base href=目录> 反而会让 "#xxx" 解析到目录上，刷新时打开文件夹列表 -->
<title>Market · Visual Coding</title>
<style>
  :root{
    --bg:#ffffff; --bg-soft:#f6f7f9; --bg-band:#f0f2f5;
    --ink:#111418; --ink-soft:#5b636e; --line:#e4e7ec;
    --accent:#1a1a1a; --brand:#2f6bff; --brand-soft:#eaf0ff;
    --radius:14px; --maxw:1180px; --gutter:clamp(20px, 4vw, 56px);
    --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.65;-webkit-font-smoothing:antialiased}

  /* ---------- header ---------- */
  .header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.85);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)}
  .header-inner{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:14px var(--gutter)}
  .logo{font-weight:700;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
  .logo .logo-img{height:26px;width:auto;display:block}
  .header-actions{display:flex;gap:10px;align-items:center}
  .btn{font-size:13.5px;padding:7px 14px;border-radius:999px;text-decoration:none;border:1px solid var(--line);color:var(--ink);transition:.15s}
  .btn:hover{background:var(--bg-soft)}
  .btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn-primary:hover{opacity:.88;background:var(--accent)}

  /* ---------- hero ---------- */
  .hero{max-width:var(--maxw);margin:0 auto;padding:64px var(--gutter) 28px;text-align:center}
  .hero .eyebrow{font-size:13px;color:var(--ink-soft);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
  .hero h1{font-size:clamp(38px,6vw,64px);line-height:1.05;margin:14px 0 12px;letter-spacing:-.03em;font-weight:800}
  .hero .sub{font-size:clamp(16px,2.4vw,21px);color:var(--ink-soft);max-width:720px;margin:0 auto 26px}
  .hero-links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .hero-links a{display:inline-flex;align-items:center;gap:7px;font-size:14.5px}

  /* ---------- result showcase ---------- */
  .showcase{max-width:var(--maxw);margin:8px auto 10px;padding:0 var(--gutter)}
  .showcase-grid{display:grid;grid-template-columns:1fr;gap:22px}
  .result-card{background:var(--bg-soft);border:1px solid var(--line);border-radius:var(--radius);padding:22px 22px 12px;overflow:hidden}
  .result-card h3{margin:0 0 4px;font-size:16px;font-weight:700}
  .result-card p{margin:0 0 14px;font-size:13.5px;color:var(--ink-soft)}
  .result-card img{width:100%;height:auto;border-radius:8px;display:block}
  .result-card iframe{width:100%;height:440px;border:none;border-radius:8px;display:block}

  /* ---------- tabs ---------- */
  .tabs-wrap{position:sticky;top:57px;z-index:40;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin-top:36px}
  .tabs{max-width:var(--maxw);margin:0 auto;display:flex;gap:4px;padding:0 var(--gutter);overflow-x:auto}
  .tab{appearance:none;border:0;background:none;font-family:inherit;font-size:14.5px;font-weight:600;color:var(--ink-soft);padding:15px 16px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:.15s}
  a.tab{text-decoration:none;display:inline-block}
  .tab:hover{color:var(--ink)}
  .tab.active{color:var(--ink);border-bottom-color:var(--brand)}

  /* ---------- doc content ---------- */
  .doc-wrap{max-width:var(--maxw);margin:0 auto;padding:40px var(--gutter) 96px}
  .doc{display:none;animation:fade .25s ease}
  .doc.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .breadcrumb{margin:0 0 8px}
  .breadcrumb a{font-size:13.5px;color:var(--ink-soft);text-decoration:none;font-weight:600}
  .breadcrumb a:hover{color:var(--brand)}

  .doc h1{font-size:32px;font-weight:800;letter-spacing:-.02em;margin:0 0 8px;padding-bottom:14px;border-bottom:1px solid var(--line)}
  .doc h2{font-size:23px;font-weight:750;margin:44px 0 14px;letter-spacing:-.01em}
  .doc h3{font-size:18px;font-weight:700;margin:28px 0 10px}
  .doc h4{font-size:15.5px;font-weight:700;margin:20px 0 8px;color:var(--ink-soft)}
  .doc p{margin:12px 0}
  .doc a{color:var(--brand);text-decoration:none}
  .doc a:hover{text-decoration:underline}
  .doc ul,.doc ol{padding-left:24px;margin:12px 0}
  .doc li{margin:6px 0}
  .doc img{max-width:100%;height:auto;border-radius:10px;border:1px solid var(--line);margin:8px 0}
  /* Inline logos inside tables: keep them text-sized (respect the tag's height attr), no border/margin */
  .doc td img,.doc th img{height:1.1em;width:auto;max-width:none;border:0;border-radius:0;margin:0 4px 0 0;vertical-align:-0.15em;display:inline-block}
  .doc div[align="center"]{text-align:center;margin:24px 0}
  /* Wide embeds: charts that need more room than the 1080px text column. Breaks out of
     .doc-wrap symmetrically and is capped to the viewport, so the page itself never
     gains a horizontal scrollbar. On narrow screens it degrades to the column width. */
  .doc .wide-embed{width:min(1440px,calc(100vw - 40px));margin-left:calc(50% - min(720px,50vw - 20px));margin-right:0}
  .doc .wide-embed iframe{width:100%;display:block}
  .doc code{font-family:var(--mono);font-size:.88em;background:var(--bg-band);padding:2px 6px;border-radius:5px}
  .doc pre{background:var(--bg-soft);border:1px solid var(--line);border-radius:10px;padding:16px;overflow-x:auto}
  .doc pre code{background:none;padding:0;font-size:13px;line-height:1.6}
  .doc blockquote{margin:16px 0;padding:8px 18px;border-left:3px solid var(--brand);background:var(--brand-soft);border-radius:0 8px 8px 0;color:var(--ink-soft)}
  .doc blockquote p{margin:4px 0}
  /* ── table — Kimi K3 Full Benchmark Table style ── */
  /* The card + horizontal scroll live on a wrapper div (injected in renderDoc),
     NOT on the table itself. A `display:block` table wraps its rows in an
     anonymous shrink-to-fit table box that ignores the block's min-width:100%,
     so the card stretched full width while the rows stopped at their content
     width — that gap was the blank block. A real display:table honours
     width:100%, and the wrapper gives position:sticky a scrollport. */
  /* ---------- 目录块 ----------
     Contents 原本就是一个 h2 加一个 ul，混在正文里跟普通小节长得一样。
     渲染后把这两个元素包进 <nav class="toc">，做成一块明显分离的卡片。 */
  .doc .toc{margin:0 0 40px;padding:18px 22px 16px;background:var(--bg-soft,#f7f8fa);
            border:1px solid var(--line,#e4e7ec);border-radius:14px}
  .doc .toc > h2{margin:0 0 10px;padding:0;border:0;font-size:12px;font-weight:800;
                 letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft,#5b636e)}
  .doc .toc ul{margin:0;padding-left:18px}
  .doc .toc ul ul{margin:2px 0}
  .doc .toc li{margin:3px 0;font-size:14.5px}
  .doc .toc a{text-decoration:none}
  .doc .toc a:hover{text-decoration:underline}

  .doc .tbl-scroll{margin:32px 0;overflow-x:auto;background:#fff;border-radius:12px;
    box-shadow:0 0 0 1px var(--line),0 2px 12px rgba(0,0,0,.05);
    scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  .doc .tbl-scroll::-webkit-scrollbar{height:4px}
  .doc .tbl-scroll::-webkit-scrollbar-track{background:transparent}
  .doc .tbl-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}
  .doc table{border-collapse:collapse;display:table;width:100%;margin:0;font-size:13.5px;background:#fff}
  .doc th{background:#f7f8fa;font-size:11px;font-weight:600;color:var(--ink-soft);letter-spacing:.05em;text-transform:uppercase;padding:11px 16px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
  .doc td{padding:10px 16px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.55;background:#fff}
  .doc tr:last-child td{border-bottom:none}
  .doc :is(th,td)[align="right"]{text-align:right;font-variant-numeric:tabular-nums}
  .doc :is(th,td)[align="center"]{text-align:center}
  /* sticky first column */
  .doc th:nth-child(1),.doc td:nth-child(1){position:sticky;left:0;z-index:2;border-right:1px solid var(--line);white-space:nowrap}
  .doc th:nth-child(1){background:#f7f8fa}
  .doc td:nth-child(1){background:#fff;font-weight:500}
  /* hover row */
  .doc tbody tr:hover td{background:#f9fafb}
  .doc tbody tr:hover td:nth-child(1){background:#f3f4f6}
  /* compact columns */
  /* Column widths are decided per table at render time (see the classifier in the
     render pass): columns whose cells are all short get .c-tight and hug their
     content, prose columns get .c-prose and absorb the leftover width. A table whose
     every column is tight hugs its container instead of stretching — otherwise a
     10-column metrics table pads each number out to a tenth of the page. */
  .doc th.c-tight,.doc td.c-tight{white-space:nowrap;width:1px}
  .doc td.c-prose{white-space:normal;min-width:160px}
  .doc .tbl-scroll.hug{width:fit-content;max-width:100%}
  .doc .tbl-scroll.hug table{width:auto}
  /* 合并单元格（见 mergeCells）：被合并行的第一个格子已不是首列，去掉首列的固定、加粗与不换行 */
  .doc table.merged td[rowspan]{white-space:normal;background:#fbfcfd;font-weight:500}
  .doc table.merged tr.cont td:nth-child(1){position:static;border-right:none;font-weight:400;white-space:normal;background:#fff}
  .doc table.wide-lead tr:not(.cont) > td:first-child{width:30%;min-width:220px;white-space:normal}
  .doc table a{color:var(--brand);text-decoration:none}
  .doc table a:hover{text-decoration:underline}
  .doc hr{border:0;border-top:1px solid var(--line);margin:36px 0}


  /* ---------- logo ---------- */
  .logo-mark{width:26px;height:26px;border-radius:7px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:800}

  /* ---------- 章内小节目录：和 overview 的 Contents 同一个形态 ---------- */
  /* 单章站点：视图上了顶部标签栏，这里只留当前视图的一句话说明 */
  .doc .view-desc{color:var(--ink-soft);font-size:15px;line-height:1.7;margin:-6px 0 30px}
  .doc .view-desc:empty{display:none}
  .doc .view-switch a{cursor:pointer}
  .doc .view-switch a.active{font-weight:700;color:var(--ink)}
  .env-view{display:none}
  .env-view.active{display:block;animation:fade .25s ease}


  /* ---------- 机构标识 ---------- */
  .doc .org{font-size:11.5px;color:var(--ink-soft);white-space:nowrap;margin-left:2px}
  .doc .org-mark{display:inline-grid;place-items:center;width:14px;height:14px;border-radius:3px;background:var(--bg-band);color:var(--ink-soft);font-size:9.5px;font-weight:700;vertical-align:-0.15em;margin-right:2px}

  /* 细讲标题左侧的机构 logo */
  .doc h4 .h-logo{height:20px;width:auto;border:0;border-radius:4px;margin:0 6px 0 0;vertical-align:-4px;display:inline-block}
  .doc h4 .org-mark.h-logo{width:20px;height:20px;font-size:12px;display:inline-grid}
  .doc h4 .org{font-size:12.5px;font-weight:500;margin-left:6px}
  .doc h4 .impact{font-size:11.5px;font-weight:600;color:var(--brand);background:var(--brand-soft);padding:2px 8px;border-radius:999px;margin-left:8px;vertical-align:2px;white-space:nowrap}
  /* HuggingFace 风格影响力徽章 */
  .doc .hf{display:inline-flex;gap:5px;flex-wrap:wrap;align-items:center;vertical-align:middle;text-decoration:none}
  .doc .hf-b{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;line-height:1;color:var(--ink-soft);background:var(--bg-band);border:1px solid var(--line);border-radius:6px;padding:2.5px 6px;white-space:nowrap}
  .doc .hf-i{width:11px;height:11px;flex:none;opacity:.9}
  .doc .hf-lk .hf-i{color:#e0566a}
  .doc .hf-st .hf-i{color:#e8a13a}
  .doc a.hf:hover .hf-b{border-color:var(--brand);color:var(--brand)}
  .doc h4 .hf,.doc .deep-title .hf{margin-left:6px}
  /* 合并总表：类型标签 / 来源徽章 / top5 加权高亮 */
  .doc .type{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:4px;white-space:nowrap}
  .doc .type-bench{color:#2563c9;background:rgba(37,99,201,.12)}
  .doc .type-data{color:#9333a8;background:rgba(147,51,168,.12)}
  /* 来源表 Artifacts 列：按素材类型分色，一眼看出这个渠道掉下来的是什么 */
  .doc .art{display:inline-block;font-size:10.5px;font-weight:600;line-height:1.55;color:#fff;
    padding:1px 7px;border-radius:999px;white-space:nowrap;margin:1.5px 4px 1.5px 0;letter-spacing:.01em}
  .doc .a-img{background:#f0338a}    /* 图像：截图、设计稿、渲染结果 */
  .doc .a-txt{background:#00a6c4}    /* 文本：title、desc、指令、问题 */
  .doc .a-code{background:#7c4dff}   /* 代码：源文件、片段、命令序列 */
  .doc .a-run{background:#ff7a1a}    /* 可直接跑出产物的整件：.html、.blend、场景 */
  .doc .a-asset{background:#00b377}  /* 资产：网格、点云、贴图、HDRI */
  .doc .a-meta{background:#c08a00}   /* 结构化字段：布局框、无障碍树、元数据 */
  /* Verifier 分层表 Method 列的三类判别方：圆角矩形，颜色沿用上面的语义（程序≈代码、Agent≈可运行件、VLM≈图像） */
  .doc .judge{display:inline-block;font-size:10.5px;font-weight:650;line-height:1.55;color:#fff;
    padding:1px 7px;border-radius:5px;white-space:nowrap;margin-right:6px;letter-spacing:.02em;vertical-align:1px}
  .doc .j-prog{background:#7c4dff}
  .doc .j-agent{background:#ff7a1a}
  .doc .j-vlm{background:#f0338a}
  /* Frontier Lab 表 Insight 列：这条披露落在哪一环（与 .judge 同形，配色错开） */
  .doc .tx{display:inline-block;font-size:10.5px;font-weight:650;line-height:1.55;color:#fff;
    padding:1px 7px;border-radius:5px;white-space:nowrap;margin-right:6px;letter-spacing:.02em;vertical-align:1px}
  .doc .tx-data{background:#0891b2}
  .doc .tx-verifier{background:#059669}
  .doc .tx-harness{background:#2563eb}
  .doc .tx-env{background:#ca8a04}
  .doc .tx-algo{background:#dc2626}
  /* Vibe Video 项目表：Field 列的场景标签（颜色与场景画廊一致，由 style="--c:" 给）、Project 列 logo、Example 列缩略图 */
  .doc .scn{display:inline-block;font-size:10.5px;font-weight:650;line-height:1.55;color:#fff;background:var(--c,#64748b);
    padding:1px 7px;border-radius:5px;white-space:nowrap;margin:1px 6px 1px 0;letter-spacing:.02em;vertical-align:1px}
  .doc .plogo{width:20px;height:20px;border-radius:5px;vertical-align:-5px;margin-right:7px;border:1px solid var(--line)}
  .doc .pstar{display:block;font-size:11.5px;color:var(--ink-soft);margin-top:2px}
  .doc img.ex-thumb{display:block;width:150px;height:84px;object-fit:cover;border-radius:7px;border:1px solid var(--line);cursor:zoom-in;
    transition:transform .15s ease,box-shadow .15s ease}
  .doc img.ex-thumb:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(17,20,24,.16)}
  .img-zoom{position:fixed;inset:0;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:28px;
    background:rgba(10,12,16,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;transition:opacity .18s ease;cursor:zoom-out}
  .img-zoom.show{opacity:1}
  .img-zoom img{max-width:min(1400px,100%);max-height:calc(100vh - 110px);object-fit:contain;border-radius:10px;box-shadow:0 24px 70px rgba(0,0,0,.5);cursor:default}
  .img-zoom .iz-cap{max-width:min(1400px,100%);color:#e6e9ee;font-size:13px;text-align:center;line-height:1.6}
  .img-zoom .iz-cap a{color:#9ec1ff;text-decoration:none;margin-left:8px}
  .doc .src{display:inline-block;font-size:11px;font-weight:600;text-decoration:none;padding:1.5px 7px;border-radius:5px;border:1px solid var(--line);color:var(--ink-soft);white-space:nowrap}
  .doc a.src:hover{border-color:var(--brand);color:var(--brand)}
  .doc .src-hf{color:#d98a00;border-color:rgba(217,138,0,.4)}
  .doc .src-gh{color:var(--ink)}
  .doc table.merged tbody tr.top5{background:rgba(46,160,67,.13)}
  .doc table.merged tbody tr.top5 td:first-child{box-shadow:inset 3px 0 0 #2ea043}
  .doc table.merged tbody tr.top5:hover{background:rgba(46,160,67,.2)}

  /* ---------- 视图内目录 + 锚点 ---------- */
  .doc .view-toc ul{list-style:none;padding-left:0;margin:0}
  .doc .view-toc li{margin:2px 0}
  .doc .view-toc li.l2{font-weight:700;margin-top:10px}
  .doc .view-toc li.l2:first-child{margin-top:0}
  .doc .view-toc li.l3{padding-left:22px}
  .doc .view-toc li.l4{padding-left:42px}
  .doc .view-toc li.l4{padding-left:44px;font-size:13.5px}
  .doc .view-toc .num{display:inline-block;min-width:46px;color:var(--ink-soft);font-family:var(--mono);font-size:12px;font-weight:500}
  .doc .anchor{scroll-margin-top:130px}
  /* 正文按小节折叠：h3（如 3.1 Overview）左侧小箭头，点标题收起 / 展开到下一个 h2 / h3 之前的内容 */
  .doc h3.foldable{position:relative;cursor:pointer;-webkit-user-select:text;user-select:text}
  .doc h3.foldable::before{content:"";position:absolute;left:-24px;top:50%;width:7px;height:7px;margin-top:-5px;
    border-right:2px solid #b3bac4;border-bottom:2px solid #b3bac4;transform:rotate(45deg);transition:transform .18s ease,border-color .15s}
  .doc h3.foldable:hover::before,.doc h3.foldable:focus-visible::before{border-color:var(--ink)}
  .doc h3.foldable.folded::before{transform:rotate(-45deg);margin-top:-4px}
  .doc h3.foldable.folded::after{content:"已收起";margin-left:10px;padding:1px 9px;border:1px solid var(--line);border-radius:999px;
    font-size:11.5px;font-weight:500;color:var(--ink-soft);vertical-align:3px;letter-spacing:0}
  .doc h3.foldable:focus{outline:none}
  .doc .fold-body.folded{display:none}
  .doc .fold-body.opening{animation:fold-in .2s ease}
  @keyframes fold-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  .doc .view-toc{position:relative}
  .doc .view-toc .fold-all{position:absolute;top:14px;right:18px;font:inherit;font-size:11.5px;color:var(--ink-soft);
    background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 11px;cursor:pointer}
  .doc .view-toc .fold-all:hover{color:var(--ink);border-color:#c5cad3}
  @media (max-width:720px){.doc h3.foldable{padding-left:20px}.doc h3.foldable::before{left:2px}}
  .doc p:has(> a.anchor:only-child){margin:0;height:0}

  /* ---------- 前沿厂商表：Benchmark 列合并单元格 ---------- */
  .doc table.frontier td.bench{vertical-align:middle;font-weight:600;white-space:normal;min-width:150px;background:#fafbfc}
  .doc table.frontier td{white-space:normal}
  .doc table.frontier .self-tag{display:inline-block;margin-left:6px;font-size:11px;font-weight:500;color:var(--ink-soft);background:var(--bg-band);padding:0 6px;border-radius:4px;vertical-align:1px}
  .doc table.frontier tbody tr:has(td.bench) td{border-top:2px solid var(--line)}
  .doc table.frontier td:nth-child(1):not(.bench){position:static;font-weight:400;border-right:0;white-space:normal}

  /* ---------- 数据样例组件（细讲内） ---------- */
  .doc .ds-demo{margin:18px 0;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--bg-soft)}
  .doc .ds-head{font-size:13px;color:var(--ink-soft);margin-bottom:12px;line-height:1.6}
  .doc .ds-head b{color:var(--ink);font-size:13.5px}
  .doc .ds-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
  .doc .ds-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
  .doc .ds-card img.ds-img{width:100%;height:auto;max-height:260px;object-fit:contain;border:1px solid var(--line);border-radius:6px;margin:0;background:#fafafa}

  .doc details.ds-code pre{margin:6px 0 0;max-height:320px;overflow:auto;white-space:pre;font-size:11.5px;line-height:1.5;padding:10px}

  /* ---------- 数据样例画廊：方块墙 + 点开弹层（逻辑见页尾 sg-* 脚本） ---------- */
  .doc .sg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin:18px 0 22px}
  .doc .sg-tile{display:flex;flex-direction:column;min-width:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;cursor:pointer;outline:none;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
  .doc .sg-tile:hover,.doc .sg-tile:focus-visible{transform:translateY(-3px);box-shadow:0 12px 28px rgba(17,20,24,.12);border-color:#cfd5dd}
  .doc .sg-poster{aspect-ratio:16/10;background:var(--bg-soft);display:grid;place-items:center;overflow:hidden;border-bottom:1px solid var(--line)}
  .doc .sg-poster img{width:100%;height:100%;object-fit:cover;object-position:top;margin:0;border:0;border-radius:0;max-width:none}
  .doc .sg-poster pre.sg-code{margin:0;width:100%;height:100%;padding:10px 12px;font-size:9.5px;line-height:1.45;background:#14171d;color:#c9d1d9;overflow:hidden;white-space:pre;border-radius:0;border:0}
  .doc .sg-mono{font-size:42px;font-weight:700;color:#c3c9d2}
  .doc .sg-meta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
  .doc .sg-name{font-size:14px;font-weight:700;line-height:1.45;color:var(--ink);overflow-wrap:anywhere}
  .doc .sg-name .org{display:block;margin:2px 0 0;font-size:12px;font-weight:500;color:var(--ink-soft);white-space:normal}
  .doc .sg-sub{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft)}
  .doc .sg-sub .hf{margin:0}
  /* Example 列：表格里的小卡片 —— 和画廊方块同一套信息（封面 / 名称 / 机构 / 影响力 / 条数），
     只是缩到单元格大小。沿用 .sg-* 的类名，所以点开弹层那套 JS 不用改。 */
  .doc .ex-tile{display:inline-flex;flex-direction:column;width:176px;vertical-align:top;text-align:left;
    border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;cursor:pointer;
    outline:none;transition:transform .14s ease,box-shadow .14s ease,border-color .14s ease}
  .doc .ex-tile:hover,.doc .ex-tile:focus-visible{transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(17,20,24,.14);border-color:#cfd5dd}
  .doc .ex-tile .sg-poster{display:block;height:76px;aspect-ratio:auto;overflow:hidden;
    background:var(--bg-soft);border-bottom:1px solid var(--line)}
  .doc .ex-tile .sg-poster img{width:100%;height:100%;object-fit:cover;object-position:top;
    display:block;margin:0;border:0;border-radius:0;max-width:none}
  .doc .ex-tile .sg-poster pre.sg-code{margin:0;width:100%;height:100%;padding:6px 8px;font-size:6.5px;
    line-height:1.4;background:#14171d;color:#c9d1d9;overflow:hidden;white-space:pre;border:0;border-radius:0}
  .doc .ex-tile .sg-mono{display:grid;place-items:center;width:100%;height:100%;
    font:700 22px var(--mono);color:var(--ink-soft)}
  .doc .ex-tile .sg-meta{display:block;padding:7px 9px 8px}
  .doc .ex-tile .sg-name{display:block;font-size:11.5px;font-weight:700;line-height:1.35;
    color:var(--ink);overflow-wrap:anywhere}
  .doc .ex-tile .sg-name .org{display:block;margin:1px 0 0;font-size:10px;font-weight:500;
    color:var(--ink-soft)}
  .doc .ex-tile .sg-name img,.doc .ex-tile .sg-name .org-mark{height:11px!important;
    width:auto;margin:0 3px 0 0;vertical-align:-1px;border:0;border-radius:0}
  .doc .ex-tile .sg-sub{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:4px;
    font-size:9.5px;line-height:1.5;color:var(--ink-soft)}
  .doc .ex-tile .sg-sub .hf{margin:0;transform:scale(.86);transform-origin:left center}
  .doc .ex-tile .sg-n{white-space:nowrap}
  .doc td .ex-tile{margin:2px 0}

  .doc .sg-body{display:none}
  .doc .sg-body.open{display:flex;flex-direction:column;position:fixed;z-index:10001;left:50%;top:50%;transform:translate(-50%,-50%);width:min(1200px,calc(100vw - 32px));height:min(88vh,960px);background:#fff;border-radius:14px;box-shadow:0 30px 90px rgba(0,0,0,.35);overflow:hidden}
  .doc .sg-mask{position:fixed;inset:0;z-index:10000;background:rgba(10,12,16,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  .doc .sg-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:#fff;flex:none}
  .doc .sg-bar .deep-title{font-size:15.5px;font-weight:700;line-height:1.5;min-width:0}
  .doc .sg-nav{display:flex;align-items:center;gap:6px;flex:none}
  .doc .sg-nav button{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:16px;line-height:1}
  .doc .sg-nav button:hover{background:var(--bg-soft)}
  .doc .sg-pos{font-size:12px;color:var(--ink-soft);min-width:46px;text-align:center}
  .doc .sg-stage{flex:1;min-height:0;overflow:auto;padding:2px 18px 18px}
  html.sg-lock{overflow:hidden}
  @media(max-width:720px){.doc .sg-body.open{width:100vw;height:100dvh;border-radius:0}.doc .sg-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}

  /* ---------- 细讲：可折叠组件 ---------- */
  .doc details.deep{border:1px solid var(--line);border-radius:12px;margin:14px 0;background:#fff}
  .doc details.deep > summary{cursor:pointer;list-style:none;padding:14px 18px;display:flex;align-items:center;gap:10px}
  .doc details.deep > summary::-webkit-details-marker{display:none}
  .doc details.deep > summary::before{content:"▸";color:var(--ink-soft);font-size:13px;transition:transform .15s;flex:none}
  .doc details.deep[open] > summary::before{transform:rotate(90deg)}
  .doc details.deep > summary:hover{background:var(--bg-soft);border-radius:12px}
  .doc details.deep[open] > summary{border-bottom:1px solid var(--line);border-radius:12px 12px 0 0}
  .doc details.deep > :not(summary){margin-left:18px;margin-right:18px}
  .doc details.deep .deep-title{font-size:15.5px;font-weight:700;line-height:1.5}
  .doc .deep-title .h-logo{height:20px;width:auto;border:0;border-radius:4px;margin:0 6px 0 0;vertical-align:-4px;display:inline-block}
  .doc .deep-title .org-mark.h-logo{width:20px;height:20px;font-size:12px;display:inline-grid}
  .doc .deep-title .org{font-size:12.5px;font-weight:500;margin-left:6px}
  .doc .deep-title .impact{font-size:11.5px;font-weight:600;color:var(--brand);background:var(--brand-soft);padding:2px 8px;border-radius:999px;margin-left:8px;vertical-align:2px;white-space:nowrap}

  /* ---------- 可切换分组表（.tbl-tabs） ---------- */
  .doc .tbl-tabs{margin:28px 0 32px}
  .doc .tbl-tabs-bar{display:flex;flex-wrap:wrap;gap:6px;padding:5px;background:var(--bg-band);border-radius:12px;width:fit-content;max-width:100%}
  .doc .tbl-tabs-bar button{appearance:none;border:0;background:none;font:inherit;font-size:13.5px;font-weight:600;color:var(--ink-soft);padding:7px 14px;border-radius:8px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:7px}
  .doc .tbl-tabs-bar button:hover{color:var(--ink)}
  .doc .tbl-tabs-bar button.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .doc .tbl-tabs-bar .n{font-family:var(--mono);font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:rgba(0,0,0,.06);color:var(--ink-soft)}
  .doc .tbl-tabs-bar button.active .n{background:var(--brand-soft);color:var(--brand)}
  .doc .tbl-pane{display:none}
  .doc .tbl-pane.active{display:block;animation:fade .2s ease}
  .doc .tbl-pane .tbl-desc{margin:14px 2px 0;font-size:13.5px;color:var(--ink-soft)}
  .doc .tbl-pane .tbl-scroll{margin:12px 0 0}
  /* 宽表（管线表、仓库表）：列多且带长文本列，向两侧突破正文栏，最宽 1400px；视口不够宽时退回正文宽 */
  .doc .wide{width:min(1400px,calc(100vw - 48px));margin-left:calc(50% - min(700px,50vw - 24px))}

  /* ---------- 自绘流程图（论文无管线图时） ---------- */
  .doc .flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px;margin:0}
  .doc .flow .step{flex:1 1 130px;background:var(--bg-soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.5;color:var(--ink-soft)}
  .doc .flow .step b{display:block;font-size:13px;color:var(--ink);margin-bottom:3px}
  .doc .flow .arr{align-self:center;color:var(--ink-soft);font-size:15px}

  /* ---------- 论文原图 ---------- */
  .doc figure.paper-fig{margin:22px 0 18px;padding:16px 16px 10px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
  .doc figure.paper-fig img{display:block;width:100%;max-height:520px;object-fit:contain;border:0;border-radius:0;margin:0}
  .doc figure.paper-fig figcaption{margin-top:10px;font-size:12.5px;color:var(--ink-soft);text-align:center}

  /* ---------- Basic 页：三家厨房地图 ---------- */
  .doc .fam-map{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:22px 0}
  .doc .fam{border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;background:var(--bg-soft)}
  .doc .fam h4{margin:2px 0 6px;color:var(--ink);font-size:15.5px;font-weight:750}
  .doc .fam .fam-tag{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--brand)}
  .doc .fam p{margin:6px 0 11px;font-size:12.5px;color:var(--ink-soft);line-height:1.6}
  .doc .fam .chips{display:flex;flex-wrap:wrap;gap:6px}
  .doc .fam .chip{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--ink)}
  @media(max-width:720px){.doc .fam-map{grid-template-columns:1fr}}

  /* ---------- Open Data 页：横向时间线 ---------- */
  .doc .tl-wrap{overflow-x:auto;margin:22px 0 6px;padding-bottom:6px}
  .doc .tl{display:grid;grid-template-columns:repeat(5,minmax(176px,1fr));min-width:900px}
  .doc .tl-band{grid-column:1/-1;display:flex;align-items:center;gap:12px;margin:0 0 20px;font-size:12px;font-weight:650;color:var(--ink-soft)}
  .doc .tl-band i{flex:1;position:relative;height:4px;border-radius:2px;background:linear-gradient(90deg,#c9ced6,var(--brand))}
  .doc .tl-band i::after{content:"";position:absolute;right:-2px;top:-4px;border:6px solid transparent;border-left:8px solid var(--brand);border-right:0}
  .doc .tl-band span{flex:none;white-space:nowrap}
  .doc .tl-band span:last-child{color:var(--brand)}
  .doc .tl-col{padding-right:14px}
  .doc .tl-date{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:8px}
  .doc .tl-node{position:relative;height:12px;margin:0 -14px 12px 0}
  .doc .tl-node::before{content:"";position:absolute;left:0;right:0;top:5px;height:2px;background:var(--line)}
  .doc .tl-node::after{content:"";position:absolute;left:0;top:0;width:8px;height:8px;border-radius:50%;background:var(--bg);border:2px solid var(--c,var(--brand))}
  .doc .tl-title{font-size:14.5px;font-weight:750;line-height:1.4;margin-bottom:8px}
  .doc .tl-chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
  .doc .tl-chip{font-size:10.5px;font-weight:650;padding:2px 7px;border-radius:999px;white-space:nowrap}
  .doc .m-vis{background:#eef0f3;color:#5b636e}
  .doc .m-vote{background:#fff3df;color:#94600a}
  .doc .m-mllm{background:#f1edff;color:#6a4fd6}
  .doc .m-agent{background:var(--brand-soft);color:var(--brand)}
  .doc .m-geo{background:#e7f6ec;color:#1f7a45}
  .doc .m-state{background:#e3f3f6;color:#0f6b7a}
  .doc .tl-card{border:1px solid var(--line);border-radius:10px;background:var(--bg-soft);padding:9px 11px;margin-bottom:8px;font-size:12.5px;line-height:1.55}
  .doc .tl-card .nm{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:0 6px;font-size:13px;font-weight:700}
  .doc .tl-card .nm a{color:var(--ink)}
  .doc .tl-card .nm span{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--ink-soft);white-space:nowrap}
  .doc .tl-card p{margin:3px 0 0;color:var(--ink-soft)}
  .doc .tl-m{display:grid;grid-template-columns:1fr auto;align-items:center;gap:1px 8px;margin-top:7px}
  .doc .tl-m .bar{height:6px;border-radius:3px;background:#e9ecf0;overflow:hidden}
  .doc .tl-m .bar i{display:block;height:100%;border-radius:3px;background:var(--brand)}
  .doc .tl-m b{font-family:var(--mono);font-size:11.5px;color:var(--brand)}
  .doc .tl-m em{grid-column:1/-1;font-style:normal;font-size:10.5px;color:var(--ink-soft)}
  .doc .tl-m.later .bar i{background:#b8bfc9}
  .doc .tl-m.later b{color:var(--ink-soft)}
  .doc .tl-legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:11.5px;color:var(--ink-soft);margin:2px 0 20px}
  .doc .tl-legend i{display:inline-block;width:14px;height:6px;border-radius:3px;margin-right:6px;vertical-align:middle}

  /* ---------- Open Data 页：前置条件闸门流水线 ---------- */
  .doc .gp-wrap{overflow-x:auto;margin:18px 0 4px;padding-bottom:6px}
  .doc .gp{display:grid;grid-template-columns:54px repeat(5,minmax(150px,1fr)) 54px;column-gap:20px;row-gap:10px;min-width:980px}
  .doc .gp-grp{grid-row:1;position:relative;text-align:center;font-size:12px;font-weight:750;color:var(--g);padding-bottom:7px;border-bottom:2px solid var(--g)}
  .doc .gp-grp::before,.doc .gp-grp::after{content:"";position:absolute;bottom:-2px;width:2px;height:8px;background:var(--g)}
  .doc .gp-grp::before{left:0}
  .doc .gp-grp::after{right:0}
  .doc .gp-end{grid-row:2;position:relative;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:14px;font-size:12.5px;font-weight:750;line-height:1.4}

  .doc .gp-out{background:var(--brand);color:#fff}

  .doc .gp .arr::before{content:"";position:absolute;right:-17px;top:50%;width:12px;height:2px;margin-top:-1px;background:#b8bfc9}
  .doc .gp .arr::after{content:"";position:absolute;right:-19px;top:50%;margin-top:-5px;border:5px solid transparent;border-left:8px solid #b8bfc9;border-right:0}
  .doc .gp-hot{border-color:#f2cfa6;background:#fff8f0}
  .doc .gp-step{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--ink-soft)}
  .doc .gp-name{font-size:14px;font-weight:750;margin-top:-5px}
  .doc .gp-big{font-size:22px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
  .doc .gp-big small{display:block;margin-top:3px;font-size:11.5px;font-weight:650;color:var(--ink-soft);letter-spacing:0}
  .doc .gp-cap{font-size:11.5px;line-height:1.5;color:var(--ink-soft);margin-top:auto}
  .doc .gp-cap .warn{color:#94600a}
  .doc .gp-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:3px 6px;font-size:11px;color:var(--ink-soft)}
  .doc .gp-row .gp-bar{grid-column:1/-1}
  .doc .gp-row b{font-family:var(--mono);font-size:11px;color:var(--ink);text-align:right}
  .doc .gp-bar{height:7px;border-radius:4px;background:#e9ecf0;overflow:hidden}
  .doc .gp-bar i{display:block;height:100%;border-radius:4px;background:var(--brand)}

  .doc .gp-waffle i{aspect-ratio:1;border-radius:3px;background:var(--brand)}

  .doc .gp-map{display:flex;flex-direction:column;gap:5px}
  .doc .gp-map span{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:7px;background:#fff;border:1px solid var(--line)}
  .doc .gp-lock{grid-row:3;grid-column:2/4;position:relative;text-align:center;font-size:11.5px;font-weight:650;color:#b45309;padding-top:7px;border-top:2px dashed #e0a458}
  .doc .gp-note{font-size:11.5px;color:var(--ink-soft);margin:2px 0 20px}

  /* ---------- 划词备注：正文高亮，点开是可折叠的备注卡片 ---------- */
  mark.nt-mark{background:#fff3c4;color:inherit;border-bottom:1.5px dotted #d4a017;cursor:pointer;padding:0 1px;border-radius:2px}
  mark.nt-mark:hover,mark.nt-mark.on{background:#ffe48a}
  mark.nt-end::after{content:"✎";font-size:.66em;color:#b8860b;margin-left:2px;vertical-align:super}
  .nt-card{margin:8px 0 14px;border:1px solid #f0d78c;border-left:3px solid #d4a017;border-radius:8px;background:#fffbea;padding:9px 13px 10px;font-size:13px;line-height:1.65;color:var(--ink);font-weight:400;text-align:left}
  .nt-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:2px}

  .nt-act button:hover{background:#fbe9a9}
  .doc .nt-body p,.doc .nt-body ul,.doc .nt-body ol{margin:6px 0}
  .doc .nt-body li{margin:3px 0}

  .nt-add{position:absolute;z-index:60;font:inherit;font-size:12px;font-weight:650;cursor:pointer;color:#fff;background:#d4a017;border:0;border-radius:999px;padding:5px 12px;box-shadow:0 4px 14px rgba(0,0,0,.16)}
  .nt-fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:50;font:inherit;font-size:12.5px;font-weight:650;cursor:pointer;color:#8a6d0b;background:#fffbea;border:1px solid #f0d78c;border-radius:999px;padding:7px 14px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
  /* 闸门流程图变体（.gp.gf，Sources 2.6）：按渲染前后切成四段，段内闸门纵向堆叠；色带、箭头、顺序锁沿用 .gp */
  .doc .gp.gf{grid-template-columns:54px 1.25fr .8fr 1fr 1fr 54px;min-width:1040px}
  .doc .gf .gp-end{align-self:center;height:132px}
  .doc .gf .gp-hot{align-self:center}
  .doc .gf-col{grid-row:2;position:relative;display:flex;flex-direction:column;justify-content:center;gap:12px}
  .doc .gf-gate{position:relative;display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:10px;background:var(--bg-soft);padding:8px 10px 9px}
  .doc .gf-gate+.gf-gate::before{content:"";position:absolute;left:50%;top:-13px;width:2px;height:12px;margin-left:-1px;background:#d5dae1}
  .doc .gf-gate.no-src{border-style:dashed;border-color:#e0a458;background:#fffaf2}
  .doc .gf-h{display:flex;align-items:baseline;gap:6px}
  .doc .gf-h b{font-size:13px;font-weight:750}
  .doc .gf-tag{margin-left:auto;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:999px;white-space:nowrap}
  .doc .gf-tag.ok{color:#1a7f37;background:#dafbe1}
  .doc .gf-tag.warn{color:#94600a;background:#fff1d6}
  .doc .gf-v{align-self:flex-start;font-family:var(--mono);font-size:11px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:6px;padding:1px 6px}
  .doc .gf-r{font-size:11.5px;line-height:1.5;color:var(--ink-soft)}
  .doc .gf-src{font-size:11px;color:var(--ink-soft)}
  .doc .gf-src a{color:var(--brand);text-decoration:none}

  /* ---------- Basic 页：代码↔实时渲染 demo ---------- */
  .doc .demo{margin:22px 0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.05)}
  .doc .demo-top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg-soft);border-bottom:1px solid var(--line)}
  .doc .demo-lang{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:3px 9px;border-radius:6px;color:#fff;background:#888;white-space:nowrap}
  .doc .lang-css{background:#2f6bff}.doc .lang-html{background:#e0566a}
  .doc .lang-js{background:#e8a13a;color:#1a1200}.doc .lang-svg{background:#16a34a}
  .doc .lang-react{background:#0ea5c4}.doc .lang-json{background:#9333a8}
  .doc .lang-py{background:#375a9e}
  .doc .demo-title{font-size:14px;font-weight:700;color:var(--ink)}
  .doc .demo-split{display:grid;grid-template-columns:1fr 1fr;align-items:stretch}
  .doc .demo-code{margin:0;border:0;border-radius:0;background:#0f1115;color:#e6e9ef;
    font-family:var(--mono);font-size:12px;line-height:1.65;padding:14px 16px;overflow:auto;max-height:360px;white-space:pre}

  .doc .demo-note{margin:0;padding:11px 15px;font-size:12.5px;color:var(--ink-soft);background:var(--bg-soft);border-top:1px solid var(--line);line-height:1.65}

  @media(max-width:720px){.doc .demo-split{grid-template-columns:1fr}.doc .demo-frame{border-left:0;border-top:1px solid var(--line)}}

  /* Gallery（画廊）——卡片陈列墙 + 全屏 lightbox。海报是主题渐变 + 衬线英文名；
     点卡片由 galOpen() 懒建 iframe（见页尾脚本），关闭即销毁，任何时刻最多一个
     WebGL 上下文，绕开浏览器对并发 WebGL 上下文数的上限。 */
  .doc .gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:18px;margin:28px 0 10px}
  .doc .gal-card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--bg);cursor:pointer;outline:none;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
  .doc .gal-card:hover,.doc .gal-card:focus-visible{transform:translateY(-4px);box-shadow:0 16px 36px rgba(17,20,24,.15);border-color:#d6dae1}
  /* 海报 = demo 的实拍截图（background，含主体+标题+控制台），渐变作为加载前/失败兜底 */
  .doc .gal-poster{position:relative;aspect-ratio:4/3;overflow:hidden;display:grid;place-items:center}
  /* 悬停变暗遮罩 + 居中「点击全屏」提示 */
  .doc .gal-poster::after{content:"";position:absolute;inset:0;background:rgba(10,12,16,.28);opacity:0;transition:opacity .18s ease}
  .doc .gal-card:hover .gal-poster::after,.doc .gal-card:focus-visible .gal-poster::after{opacity:1}
  .doc .gal-play{position:relative;z-index:1;font-size:12.5px;font-weight:600;color:#fff;background:rgba(14,17,22,.55);border:1px solid rgba(255,255,255,.5);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);padding:6px 15px;border-radius:999px;opacity:0;transform:translateY(5px);transition:.18s}
  .doc .gal-card:hover .gal-play,.doc .gal-card:focus-visible .gal-play{opacity:1;transform:none}
  .doc .gal-meta{padding:12px 15px 14px;display:flex;flex-direction:column;gap:5px}
  .doc .gal-cn{font-size:15px;font-weight:700;color:var(--ink)}
  .doc .gal-cap{font-size:12.5px;color:var(--ink-soft);line-height:1.55}
  .doc .gal-slug{align-self:flex-start;font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);background:var(--bg-band);padding:2px 7px;border-radius:5px;margin-top:2px}
  .gal-lightbox{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;padding:clamp(10px,3vw,34px);background:rgba(10,12,16,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;transition:opacity .2s ease}
  .gal-lightbox.show{opacity:1}
  .gal-lb-panel{display:flex;flex-direction:column;width:min(1180px,100%);height:min(760px,100%);background:#0f1115;border-radius:16px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.55);transform:scale(.985);transition:transform .2s ease}
  .gal-lightbox.show .gal-lb-panel{transform:none}
  .gal-lb-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;background:#14171d;border-bottom:1px solid rgba(255,255,255,.08)}
  .gal-lb-ttl{display:flex;align-items:baseline;gap:9px;min-width:0}
  .gal-lb-ttl b{font-size:14px;color:#f4f6f8;font-weight:600;white-space:nowrap}
  .gal-lb-ttl span{font-family:"Instrument Serif",Georgia,serif;font-size:14px;color:#8b93a0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gal-lb-act{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .gal-lb-ext{font-size:12px;color:#aab2bf;text-decoration:none;border:1px solid rgba(255,255,255,.14);padding:5px 11px;border-radius:8px;transition:.15s;white-space:nowrap}
  .gal-lb-ext:hover{color:#fff;border-color:rgba(255,255,255,.3)}
  .gal-lb-x{appearance:none;border:0;background:rgba(255,255,255,.08);color:#cfd5dd;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:14px;line-height:1;transition:.15s}
  .gal-lb-x:hover{background:rgba(255,255,255,.18);color:#fff}
  .gal-lb-stage{position:relative;flex:1;background:#0f1115;display:grid;place-items:center;min-height:0}
  .gal-lb-frame{position:relative;z-index:1;width:100%;height:100%;border:0;background:#0f1115;opacity:0;transition:opacity .25s ease}
  .gal-lightbox.loaded .gal-lb-frame{opacity:1}
  .gal-lb-spin{position:absolute;width:30px;height:30px;border:3px solid rgba(255,255,255,.18);border-top-color:#fff;border-radius:50%;animation:gal-spin .8s linear infinite}
  .gal-lightbox.loaded .gal-lb-spin{display:none}
  @keyframes gal-spin{to{transform:rotate(360deg)}}
  @media(max-width:720px){.gal-lb-panel{height:100%;width:100%;border-radius:0}.doc .gal-en{font-size:25px}}

  .footer{border-top:1px solid var(--line);padding:28px 24px;text-align:center;color:var(--ink-soft);font-size:13px}

  /* KaTeX display blocks: give them breathing room and horizontal scroll on overflow */
  .doc .katex-display{margin:20px 0;overflow-x:auto;overflow-y:hidden;padding:2px 0}
  .doc .katex{font-size:1.05em}

<script>
  // ---- constants -----------------------------------------------------------
  // Combined height of the two sticky bars (header + tabs-wrap) in pixels.
  // scrollTo subtracts this so the newly-activated section isn't hidden behind them.
  const STICKY_HEADER_HEIGHT = 60;
  // Max parent hops when walking up to the nearest tab ancestor.
  // Guards against cycles if the doc graph is somehow malformed.
  const MAX_ANCESTOR_DEPTH = 50;

  // ---- data ----------------------------------------------------------------
  const DOCS   = [{"id": "market", "label": "Market", "tab": true, "parent": null, "md": "# Market\n\n<style>\n.doc .mk-card{text-decoration:none;color:inherit}\n.doc .mk-card .gal-poster{aspect-ratio:16/10}\n.doc .mk-by{font-size:12px;color:var(--ink-soft);margin-top:-2px}\n.doc .mk-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}\n.doc .mk-tags span{font-size:11px;padding:2px 8px;border-radius:999px;line-height:1.5}\n.doc .mk-heat{background:#fff4e5;color:#a35a00}\n.doc .mk-biz{background:var(--bg-band);color:var(--ink-soft)}\n.doc .mk-tech{background:#e8f0fe;color:#1a56b0}\n.doc .mk-tags span:empty{display:none}\n#doc-market .view-switch{max-width:100%;overflow-x:auto;scrollbar-width:none}\n#doc-market .view-switch button{white-space:nowrap;padding:7px 14px;flex:none}\n.doc .xg-card>a{text-decoration:none;color:inherit}\n.doc .xg-proj{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:700;color:var(--ink);text-decoration:none}\n.doc a.xg-proj:hover{text-decoration:underline}\n.doc .xg-proj img{width:18px;height:18px;border-radius:4px;flex:none;object-fit:contain}\n.doc .xg-row{font-size:12px;color:var(--ink-soft);line-height:1.5}\n.doc .xg-card .gal-cap b,.doc .xg-row b{font-weight:600;color:var(--ink);margin-right:6px}\n@media (max-width:720px){.doc .view-switch{display:flex;max-width:100%;overflow-x:auto;scrollbar-width:none}.doc .view-switch button{white-space:nowrap;padding:7px 14px;flex:none}}\n</style>\n\n<div class=\"view-switch\"></div>\n\n<div class=\"env-view\" data-view=\"overview\" data-label=\"Overview\">\n\n<nav class=\"toc view-toc\"><h2>Contents</h2><ul><li class=\"l2\"><a href=\"#ov-1\"><span class=\"num\">1</span> Money Follows Distribution, Not Models</a></li><li class=\"l2\"><a href=\"#ov-2\"><span class=\"num\">2</span> Five Tracks at Three Stages</a></li><li class=\"l2\"><a href=\"#ov-3\"><span class=\"num\">3</span> Where Each Technology Pays</a></li><li class=\"l2\"><a href=\"#ov-4\"><span class=\"num\">4</span> Technology × Track Matrix</a></li><li class=\"l2\"><a href=\"#ov-5\"><span class=\"num\">5</span> What This Means for Visual Coder</a></li><li class=\"l2\"><a href=\"#ov-6\"><span class=\"num\">6</span> Best Practice by Technology Route</a></li><li class=\"l2\"><a href=\"#ov-7\"><span class=\"num\">7</span> Data Caliber</a></li></ul></nav>\n\n<a class=\"anchor\" id=\"ov-1\"></a>\n\n## 1 Money Follows Distribution, Not Models\n\n3D 生成的单价四年降了 95% 以上，世界模型公司一年融资超过 30 亿美元，但这两类公司里披露过规模收入的只有一家。生成能力不是瓶颈。\n\n能赚钱的公司有一个共同点：产品挂在用户本来就在付钱的流程上。本页用三个术语贯穿全文：\n\n| 术语 | 定义 | 例子 |\n|---|---|---|\n| 现成付费渠道 | 用户已经在为之付钱的流程 | 广告投放、软件订阅、席位授权、平台分成 |\n| 确定性环节 | 输出必须逐像素或逐参数正确的环节 | 广告上的价格文字、CAD 尺寸、商品配置选项 |\n| visual coder | 用代码生成视觉产出的模型或工具 | 写 three.js 页面、Blender 脚本、CAD 代码、HTML 广告 |\n\n现成付费渠道不是「市场大」。快手广告是现成付费渠道，因为广告主本来就在投放，AIGC 素材只是让同一笔预算多跑了量；世界模型面向的「可玩世界」没有现成付费渠道，玩家还没为它付过钱。\n\n<a class=\"anchor\" id=\"ov-2\"></a>\n\n## 2 Five Tracks at Three Stages\n\n核心发现：五个赛道按是否挂在现成付费渠道上，分成三档。\n\n| 档位 | 赛道 | 现成付费渠道 | 证据 |\n|---|---|---|---|\n| 已经赚钱 | 广告创意 | 广告主经平台消耗 | 快手 2025Q4 AIGC 素材带动营销消耗 40 亿元（[财报](https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0325/2026032500367.pdf)） |\n| 已经赚钱 | 3D 资产 | 个人订阅、3D 打印 | Meshy ARR 超 1 亿美元（[自报](https://dealroom.co/news/158079-meshy-hits-100m-arr-first-ai-3d-firm-to-reach-milestone/)） |\n| 已经赚钱 | 产业 3D | 席位、授权、项目 | Applied Intuition 约 8.3 亿美元/年（[估算](https://sacra.com/research/applied-intuition-at-830m-year/)） |\n| 有流量没收入 | Web 3D 中的 AI 生成部分、文生游戏 | 无，靠 VC 补贴或门户广告 | Astrocade 月活 1000 万，计划 2027 年变现（[Kotaku](https://kotaku.com/ai-generated-games-platform-already-has-10-million-monthly-users-2000741894)） |\n| 只有资本 | 世界模型 | 无 | AMD 约 82 亿美元收购 World Labs，收入从未披露（[DCK](https://datacenterknowledge.com/data-center-chips/amd-to-acquire-world-labs-for-8-2b-to-advance-ai-models-and-robotics)） |\n\n数据解读：\n\n- **三档的分界线是渠道，不是技术难度。** 世界模型在技术上最难，收入最少；广告素材技术门槛最低，现金流最大。\n- **同一项技术换个渠道就换一档。** 视频模型做广告片段，挂在投放上，已经赚钱；做可玩世界，没有渠道，停在 Demo。\n\n<a class=\"anchor\" id=\"ov-3\"></a>\n\n## 3 Where Each Technology Pays\n\n核心发现：九类技术里，赚钱最稳的是引擎和视频模型，采用度涨得最快的是 three.js。\n\n| 技术 | 在哪赚钱 | 采用度 |\n|---|---|---|\n| Blender | 独立动画、资产市场、合成数据 | 基金会年收入 311 万欧元；《Flow》用它拿下奥斯卡（[年报](https://download.blender.org/foundation/Blender-Foundation-Annual-Report-2024.pdf)） |\n| three.js / WebGPU | 品牌站、配置器、网页游戏、孪生大屏 | npm 月下载 7022 万，一年涨 6.4 倍（[npm](https://api.npmjs.org/downloads/point/2026-09-01:2026-09-30/three)） |\n| Unreal / Unity / 团结引擎 | 车机、虚拟制片、广电、仿真 | Unity 引擎板块 2025 年 6.2 亿美元，同比 +1%（[10-K](https://www.sec.gov/Archives/edgar/data/1810806/000181080626000011/unity-20251231.htm)） |\n| Cocos / Laya | 微信、抖音小游戏 | 国内小游戏 2025 年约 610 亿元（[DataEye](https://www.thepaper.cn/newsDetail_forward_32682540)） |\n| 3D 高斯点（3DGS） | 看房、仿真输入、商品孪生 | glTF 扩展 2026-02 进入候选标准（[Khronos](https://www.khronos.org/news/press/gltf-gaussian-splatting-press-release)） |\n| Omniverse / Isaac | 工厂孪生、机器人仿真 | 四大机器人厂 200 万台装机接入虚拟调试（[NVIDIA](https://nvidianews.nvidia.com/news/nvidia-and-global-robotics-leaders-take-physical-ai-to-the-real-world)） |\n| 原生 3D 生成模型 | 3D 打印、游戏白盒 | 各家 API 0.2 到 0.8 美元/个；TRELLIS.2 在 fal 上 0.25 到 0.35 美元（[fal](https://fal.ai/models/fal-ai/trellis-2)） |\n| 视频 / 世界模型 | 广告素材、数字人、仿真 | 可灵 2026Q2 收入超 8.5 亿元（[TechNode](https://technode.global/?p=990300)） |\n| LLM 写 3D 代码 / MCP | 网页游戏、DCC 自动化、text-to-CAD | BlenderMCP 3.06 万 star，零直接收入（[GitHub](https://github.com/ahujasid/blender-mcp)） |\n\n数据解读：\n\n- **three.js 的增长不是 Web 3D 市场变大，而是写代码的人变了。** 同期 react 下载涨 3.8 倍，three.js 涨 6.4 倍，多出来的部分最可能来自 AI 生成代码；官方 showcase 已收录 Claude 生成的作品。\n- **MCP 有用户没收入。** 因为 Blender、Unity、Unreal、Houdini、C4D 都免费提供官方 MCP，独立 MCP 工具没有定价空间。\n\n<a class=\"anchor\" id=\"ov-4\"></a>\n\n## 4 Technology × Track Matrix\n\n核心发现：标「赚钱」的格子全部挂在现成付费渠道上。\n\n图例：**赚钱** = 有财报或自报的规模收入；早期 = 有付费但规模小；Demo = 只有演示或融资；— = 无关。\n\n| 技术 | 3D 资产 | 游戏与世界 | 广告创意 | Web 3D | 产业 3D |\n|---|---|---|---|---|---|\n| Blender | 早期 | 早期 | 早期 | **赚钱** | 早期 |\n| three.js / WebGPU | 早期 | 早期 | 早期 | **赚钱** | **赚钱** |\n| Unreal / Unity | **赚钱** | **赚钱** | — | 早期 | **赚钱** |\n| Cocos / Laya | — | **赚钱** | — | **赚钱** | — |\n| 3DGS | 早期 | 早期 | 早期 | 早期 | 早期 |\n| Omniverse / Isaac | — | 早期 | — | — | **赚钱** |\n| 原生 3D 生成 | **赚钱** | 早期 | — | 早期 | 早期 |\n| 视频 / 世界模型 | — | Demo | **赚钱** | — | 早期 |\n| LLM 写 3D 代码 | 早期 | 早期 | 早期 | 早期 | 早期 |\n\n数据解读：\n\n- **「LLM 写 3D 代码」整行早期，却横跨全部五个赛道。** 它不是一个赛道，是降低交付成本的生产方式，价值落在它服务的那个赛道里。\n- **3DGS 整行早期。** 它解决的是采集，不是分发；等 glTF 标准定稿、浏览器原生支持后才会进入付费流程。\n\n<a class=\"anchor\" id=\"ov-5\"></a>\n\n## 5 What This Means for Visual Coder\n\nvisual coder 本身不是生意。它的价值在于接管现成付费渠道里的确定性环节，因为生成模型在这些环节出错就不能交付，代码不会。\n\n核心发现：按「付费方已存在」和「代码就是交付物」两个条件排序，前三名都同时满足。\n\n| 排名 | 方向 | 为什么能做 | 主要风险 |\n|---|---|---|---|\n| 1 | 广告图与电商图的模板渲染层 | 价格、logo、多尺寸必须逐像素准确；Bannerbear、Placid 已开放 MCP 给广告 agent 调用 | 平台把生成工具免费塞进投放后台 |\n| 2 | 面向 3D 打印的 CAD-as-code | 拓竹 2025 年营收预计破百亿元；开源 text-to-cad 半年 1.98 万 star；参数化代码可改可审 | Zoo、Adam 都未披露收入 |\n| 3 | 品牌 Web 3D 与配置器降本 | 单项目 2 万到 12 万美元；three.js 下载一年涨 6.4 倍，增量最可能来自 AI 写代码 | 头部作品靠少数工作室手艺 |\n| 4 | 程序化合成数据 | 光轮单季新签 5.5 亿元；Blender 支持无头 GPU 渲染 | 主流栈是 NVIDIA Isaac |\n| 5 | three.js 网页小游戏 | Poki 月玩家 1 亿 | 单个游戏收入不可持续，只能给平台供货 |\n| 6 | 国内孪生大屏交付 | 平均每单约 150 万元 | 集成商毛利 20% 到 50%，回款慢 |\n\n数据解读：\n\n- **第 1 名不是「AI 生成广告图」，而是生成之后的那一层。** 生成模型出画面，代码负责价格、字幕、尺寸改版；Photoroom 为此专门收购了模板公司 Generate Banners。\n- **高热度商业 demo 里，代码已是主要的渲染方式，但还不是主要的生产方式。** 本页 90 个 demo 中，Web 3D 的 25 个有 17 个是 three.js 或手写 WebGL；而全部 90 个里，由 AI 写代码产出的只有 3 个：Fly、Astrocade、Adam。渲染层已经是代码，写代码的还是人，这正是 visual coder 的空位。\n- **两个方向不建议做。** 独立的 DCC MCP 工具，因为厂商都免费提供；用代码搭可玩世界卖给消费者，因为世界模型自己都卖不动。\n\n下一步：在第 1、2 名方向各做一个可付费的最小产品，用真实广告主和打印用户验证付费意愿。\n\n<a class=\"anchor\" id=\"ov-6\"></a>\n\n## 6 Best Practice by Technology Route\n\n把五个赛道换个切法：按技术路线拆成五条，每个商业场景挑一个最能说明「谁在付钱」的案例。\n\n核心发现：diffusion 路线已经挂在投放和打印上赚钱；code 路线只有前端开发跑出了规模，视频和 3D 的 code 路线还在找付费方。\n\n| 技术路线 | 成熟度 | 钱从哪来 | 场景 → 最佳实践 |\n|---|---|---|---|\n| 前端开发（webdev） | 已成规模 | 卖给创作者的订阅 | App / MVP → Lovable；网页小游戏 → Fly；Web 3D 产品页 → 小米 YU7 |\n| 视频生成（diffusion） | 现金流最大 | 广告主的投放预算 | 效果广告 → Higgsfield；爆款广告 → Kalshi；数字人 → HeyGen；电商素材 → 万相营造；AI 短剧 → 雪山救狐 |\n| 视频生成（code） | 早期 | 依附广告与数字人平台 | 发布片 → Deedy；个性化批量 → GitHub Unwrapped；科普动画 → 3Blue1Brown；广告确定性层 → Photoroom |\n| 3D 资产生成（diffusion） | 已赚钱，单价在崩 | 3D 打印出口 | 打印手办 → Meshy；游戏资产 → Tripo；平台内生成 → Roblox Cube；电商重建 → SAM 3D |\n| 3D 资产生产（code） | 早期，无人披露 ARR | 插件订阅与合成数据合同 | CAD → Adam；DCC 自动化 → BlenderMCP；合成数据 → 光轮；配置器 → Threekit |\n\n数据解读：\n\n- **code 路线有两种活法。** 卖创作者订阅（webdev），或接管别人渠道里的确定性环节（广告模板、CAD、配置器）。直接卖作品给消费者的不稳：Fly 17 天 ARR 100 万美元，2026 年中归零。\n- **有三张卡不是 AI 写代码。** 小米 YU7、3Blue1Brown 是人写的，光轮走 Isaac 仿真。放进来是因为它们最能说明这个场景谁在付钱，也正是 visual coder 的空位。\n\n### 前端开发（webdev）\n\ncode 路线里唯一跑出规模的一条。钱来自卖工具订阅给做东西的人，不是卖做出来的作品。\n\n<!--BP:webdev-->\n\n<div class=\"gal-grid\">\n<a class=\"gal-card mk-card\" href=\"https://lovable.dev/\" target=\"_blank\" rel=\"noopener\"><div class=\"gal-poster\" style=\"background:url('assets/market/bp-webdev-00.jpg') center/cover no-repeat,#1b1f27\"><span class=\"gal-play\">↗ 打开原站</span></div><div class=\"gal-meta\"><div class=\"gal-cn\">Lovable</div><div class=\"mk-by\">Lovable（瑞典）</div><div class=\"gal-cap\">一句话描述需求，生成前后端并一键部署；用户 WNTD 靠它每月省下 2.5 万英镑以上的开发费，融到 300 万英镑</div><div class=\"mk-tags\"><span class=\"mk-tech\">LLM 写全栈代码</span><span class=\"mk-heat\">ARR 约 6 亿美元，C 轮估值 133 亿美元（AI Magazine）</span><span class=\"mk-biz\">非程序员做 App / MVP · 订阅</span></div></div></a>\n<a class=\"gal-card mk-card\" href=\"https://fly.pieter.com/\" target=\"_blank\" rel=\"noopener\"><div class=\"gal-poster\" style=\"background:url('assets/market/game-13.jpg') center/cover no-repeat,#1b1f27\"><span class=\"gal-play\">↗ 打开原站</span></div><div class=\"gal-meta\"><div class=\"gal-cn\">Fly 飞行模拟</div><div class=\"mk-by\">Pieter Levels（@levelsio）</div><div class=\"gal-cap\">AI 写 three.js 的浏览器多人飞行游戏，广告位卖给赞助商、再卖飞机；爆款不持续，2026 年中归零</div><div class=\"mk-tags\"><span class=\"mk-tech\">three.js + AI 写代码</span><span class=\"mk-heat\">上线 17 天 ARR 100 万美元（作者自述）</span><span class=\"mk-biz\">网页小游戏 · 广告 + 内购</span></div></div></a>\n<a class=\"gal-card mk-card\" href=\"https://www.xi .8 亿播放（Vidanalyze）</span><span class=\"mk-biz\">科普动画 · 观众赞助</span></div></div></a>\n<a class=\"gal-card mk-card\" href=\"https://www.photoroom.com/\" target=\"_blank\" rel=\"noopener\"><div class=\"gal-poster\" style=\"background:url('assets/market/bp-vcode-03.jpg') center/cover no-repeat,#1b1f27\"><span class=\"gal-play\">↗ 打开原站</span></div><div class=\"gal-meta\"><div class=\"gal-cn\">Photoroom × Generate Banners</div><div class=\"mk-by\">Photoroom</div><div class=\"gal-cap\">生成模型出画面，模板负责价格、logo、多尺寸；2025-05 收购模板公司 Generate Banners 补上这一层（以图为主）</div><div class=\"mk-tags\"><span class=\"mk-tech\">图像模型 + 模板渲染</span><span class=\"mk-heat\">约 9400 万美元/年（Sacra 估算），Wolt 14 万商家走 API</span><span class=\"mk-biz\">广告确定性层 · API 计费</span></div></div></a>\n</div>\n\n<!--/BP-->\n\n### 3D 资产生成（diffusion）\n\n单个模型从约 8 美元跌到 0.2 到 0.4 美元，大厂又在开源。钱在出口（打印、平台），不在生成质量榜。\n\n<!--BP:3ddiff-->\n\n<div class=\"gal-grid\">\n<a class=\"gal-card mk-card\" href=\"https://www.youtube.com/watch?v=EZN8xb1xHzU\" target=\"_blank\" rel=\"noopener\"><div class=\"gal-poster\" style=\"background:url('assets/market/asset-00.jpg') center/cover no-repeat,#1b1f27\"><span class=\"gal-play\">↗ 打开原站</span></div><div class=\"gal-meta\"><div class=\"gal-cn\">Meshy 一键多色打印</div><div class=\"mk-by\">Meshy × 拓竹 MakerWorld</div><div class=\"gal-cap\">一张图 → 3D → 自动分色出 3MF，拖进拓竹切片直接打全彩；打印绕开了 AI 最差的拓扑、UV、绑骨</div><div class=\"mk-tags\"><span class=\"mk-tech\">原生 3D 生成</span><span class=\"mk-heat\">ARR 超 1 亿美元；打印视频 886 万播放</span><span class=\"mk-biz\">3D 打印 / 手办 · 订阅</span></div></div></a>\n<a class=\"gal-card mk-card\" href=\"https://www.youtube.com/watch?v=g4ozFeSBPfo\" target=\"_blank\" rel=\"noopener\"><div class=\"gal-poster\" style=\"background:url('assets/market/asset-03.jpg') center/cover no-repeat,#1b1f27\"><span class=\"gal-play\">↗ 打开原站</span></div><div class=\"gal-meta\"><div class=\"gal-cn\">Tripo P2.0</div><div class=\"mk-by\">VAST / Tripo AI</div><div class=\"gal-cap\">原生四边面拓扑，角色直接可绑骨做动画；竞争点从「像不像」转向「能不能直接进管线」</div><div class=\"mk-tags\"><span class=\"mk-tech\">原生 3D 生成</span><span class=\"mk-heat\">1200 万美元/年；Sony、网易等工作室在用</span><span class=\"mk-biz\">游戏资产 · API + 订阅</span></div></div></a>\n<a class=\"gal-card mk-card\" href=\"https://www.youtube.com/watch?v=85PNb99CT68\" target=\"_blank\" rel=\"noopener\"><div class=\"gal-poster\" style=\"background:url('assets/market/asset-09.jpg') center/cover no-repeat,#1b1f27\"><span class=\"gal-play\">↗ 打开原站</span></div><div class=\"gal-meta\"><div class=\"gal-cn\">Roblox Cube</div><div class=\"mk-by\">Roblox</div><div class=\"gal-cap\">玩家在游戏里一句话生成可交互物体，4D 版本可动可开；生成不单独卖，换平台时长</div><div class=\"mk-tags\"><span class=\"mk-tech\">原生 3D 生成</span><span class=\"mk-heat\">Wish Master 里使用者平均时长 +64%</span><span class=\"mk-biz\">平台内生成 · 平台自用</span></div></div></a>\n<a class=\"gal-card mk-card\" href=\"https://www.youtube.com/watch?v=B7PZuM55ayc\" target=\"_blank\" rel=\"noopener\"><div class=\"gal-poster\" style=\"background:url('assets/market/asset-14.jpg') center/cover no-repeat,#1b1f27\"><span class=\"gal-play\">↗ 打开原站</span></div><div class=\"gal-meta\"><div class=\"gal-cn\">Meta SAM 3D</div><div class=\"mk-by\">Meta</div><div class=\"gal-cap\">单张实拍图重建物体和人体 3D；大厂开源压住模型层，价值落在自家交易场景</div><div class=\"mk-tags\"><span class=\"mk-tech\">单图 3D 重建</span><span class=\"mk-heat\">GitHub 7.5k star，Facebook 二手市场已用</span><span class=\"mk-biz\">电商 / 二手重建 · 开源</span></div></div></a>\n</div>\n\n<!--/BP-->\n\n### 3D 资产生产（code）\n\n没有一家披露 ARR。DCC 厂商都免费送 MCP，能做的是代码本身就是交付物的地方：CAD、合成数据、配置器。\n\n<!--BP:3dcode-->\n\n<div class=\"gal-grid\">\n<a class=\"gal-card mk-card\" href=\"https://www.youtube.com/watch?v=EHu6Vrqo69A\" target=\"_blank\" rel=\"noopener\"><div class=\"gal-poster\" style=\"background:url('assets/market/industry-15.jpg') center/cover no-repeat,#1b1f27\"><span class=\"gal-play\">↗ 打开原站</span></div><div class=\"gal-meta\"><div class=\"gal-cn\">Adam 文本生 CAD</div><div class=\"mk-by\">Adam（YC W25）</div><div class=\"gal-cap\">一句话生成可编辑参数化零件，做成 Fusion、Onshape 里的 CAD-as-code 插件，不做替代品</div><div class=\"mk-tags\"><span class=\"mk-tech\">LLM 写 CAD 代码</span><span class=\"mk-heat\">用户已生成 100 万+ 模型，种子轮 410 万美元</span><span class=\"mk-biz\">参数化 CAD · 插件订阅</span></div></div></a>\n<a class=\"gal-card mk-card\" href=\"https://github.com/ahujasid/blender-mcp\" target=\"_blank\" rel=\"noopener\"><div class=\"gal-poster\" style=\"background:url('assets/market/bp-3dcode-01.jpg') center/cover no-repeat,#1b1f27\"><span class=\"gal-play\">↗ 打开原站</span></div><div class=\"gal-meta\"><div class=\"gal-cn\">BlenderMCP</div><div class=\"mk-by\">开源社区（ahujasid）</div><div class=\"gal-cap\">LLM 通过 MCP 写 bpy 驱动 Blender，截图回看再修；厂商都免费送 MCP，独立工具没有定价空间</div><div class=\"mk-tags\"><span class=\"mk-tech\">LLM 写 Blender 代码</span><span class=\"mk-heat\">GitHub 3.06 万 star、PyPI 月下载约 49 万，零直接收入</span><span class=\"mk-biz\">DCC 自动化 · 免费</span></div></div></a>\n<a class=\"gal-card mk-card\" href=\"https://www.youtube.com/watch?v=mqEBWpq3VgA\" target=\"_blank\" rel=\"noopener\"><div class=\"gal-poster\" style=\"background:url('assets/market/industry-11.jpg') center/cover no-repeat,#1b1f27\"><span class=\"gal-play\">↗ 打开原站</span></div><div class=\"gal-meta\"><div class=\"gal-cn\">光轮仿真数据</div><div class=\"mk-by\">光轮智能 Lightwheel</div><div class=\"gal-cap\">SimReady 资产 + Isaac Sim 物理仿真，为具身模型批量造数据；主流栈是 Isaac，不是 LLM 写代码</div><div class=\"mk-tags\"><span class=\"mk-tech\">Isaac 仿真</span><span class=\"mk-heat\">2026Q1 新签 5.5 亿元，2026-03 融资 10 亿元</span><span class=\"mk-biz\">程序化合成数据 · 数据服务</span></div></div></a>\n<a class=\"gal-card mk-card\" href=\"https://www.threekit.com/virtual-photographer\" target=\"_blank\" rel=\"noopener\"><div class=\"gal-poster\" style=\"background:url('assets/market/bp-3dcode-03.jpg') center/cover no-repeat,#1b1f27\"><span class=\"gal-play\">↗ 打开原站</span></div><div class=\"gal-meta\"><div class=\"gal-cn\">Threekit 虚拟摄影</div><div class=\"mk-by\">Threekit</div><div class=\"gal-cap\">产品建一次 3D，配置器里换选项，批量渲染数万张电商图；商品选项必须逐参数正确，适合代码</div><div class=\"mk-tags\"><span class=\"mk-tech\">3D 配置器 + 批量渲染</span><span class=\"mk-heat\">配置器市场约 17 亿美元，Amazon 称点开 3D 转化约 2 倍</span><span class=\"mk-biz\">配置器 / 虚拟摄影 · 企业 SaaS</span></div></div></a>\n</div>\n\n<!--/BP-->\n\n<a class=\"anchor\" id=\"ov-7\"></a>\n\n## 7 Data Caliber\n\n- **四类口径**：财报（交易所文件）、自报（公司或创始人）、估算（Sacra 等第三方）、实测（调研时直接读取的 API 与榜单）。表格链接即出处。\n- **截止日期**：2026-10-13。\n- **已知缺口**：国内数据偏薄，稿定、LiblibAI、Temu 与 SHEIN 的 AI 商品图、数字人直播 GMV 未查到；世界模型与文生游戏公司都没有经审计的收入。\n- **对第一版的更正**：Hitem3D 母公司是数美万物，不是魔芯；「Tripo 已盈利」出处不成立；快手财报里没有「转化 +20% 到 30%」；three.js 约为 Babylon 的 47 倍，不是 270 倍；「Shopify 3D 提升 94% 转化」找不到原始出处。\n- **第三轮回源核对的更正**：Roblox Cube「每天 6 万个资产」找不到出处，改为一年 180 万个；Threekit 融资是累计约 8010 万加元，不是单轮 4360 万；阿里妈妈 1.5 亿是淘天全平台的图片与视频总量，不是万相营造单独生成；Meshy、美图、Synthesia、Arcads 的数字是 ARR，不是年收入；拓竹「破百亿」是 CEO 的预期，不是正式披露。逐条核对表见 middle_processing/market/audit_landscape.md。\n- **第四轮 demo 复核的更正**：苹果 AirPods 产品页只为 360 度视频播放器按需加载 three.js，产品 3D 画面是预渲染视频，已撤下该卡；SpaceX 对接模拟、Seed3D、HappyOyster、Zillow SkyTour 查不到硬热度，换成有收购、用户数或播放量出处的同类 demo；国内 Web 3D 补入天猫 3D 购、得物 AR、贝壳 VR、云游长城，这几项数字多为 2020 到 2023 年口径。行业表补齐 11 个空格（PixVerse ARR、Odyssey B 轮、Arcads 种子轮、Poki 月活等）；Kaedim 融资改为累计约 1500 万美元；Web 3D 表里查不到数字的 5 家工作室合并为一行。核对记录见 middle_processing/market/r3_landscape_fill.md。\n- **第 6 节最佳实践（2026-11-03 新增）**：卡片数据在 middle_processing/market/best_practice.json，由 scripts/market_bestpractice.py 渲染。Lovable、HeyGen ARR、GitHub Unwrapped、3Blue1Brown 四条为当日网络补查，多为二手报道，未核对一手来源。\n\n</div>\n\n<div class=\"env-view\" data-view=\"asset\" data-label=\"3D Assets\">\n\n<nav class=\"toc view-toc\"><h2>Contents</h2><ul><li class=\"l2\"><a href=\"#as-1\"><span class=\"num\">1</span> Industry Landscape</a></li><li class=\"l2\"><a href=\"#as-2\"><span class=\"num\">2</span> Best Practices</a></li><li class=\"l2\"><a href=\"#as-3\"><span class=\"num\">3</span> Insights</a></li></ul></nav>\n\nAI 3D 已经有一家公司 ARR 过 1 亿美元，但游戏厂至今不承认在已发售作品里用过 AI 资产。钱从别处来：3D 打印。\n\n<a class=\"anchor\" id=\"as-1\"></a>\n\n## 1 Industry Landscape\n\n核心发现：独立玩家里只有 Meshy 跑出规模，其余头部几乎都是中国团队，而且靠海外收入。\n\n| 公司 | 定位 | 营收 | 估值 | 代表作 |\n|---|---|---|---|---|\n| Meshy（海外） | 原生 3D 生成 + 重拓扑、绑骨一站式 | ARR 超 1 亿美元（[自报](https://dealroom.co/news/158079-meshy-hits-100m-arr-first-ai-3d-firm-to-reach-milestone/)） | 15 亿美元 | [Meshy 7](https://www.meshy.ai) |\n| VAST Tripo（国内） | 原生 3D，主打可用的四边面拓扑 | 1200 万美元/年（2025-09 [自报](https://arinsider.co/2025/09/22/can-tripos-gen-ai-step-change-unlock-3d-tiktok/)） | 10 亿美元以上 | [Tripo P2.0](https://www.tripo3d.ai) |\n| 影眸 Rodin（国内） | 高精度原生 3D，80% 收入来自海外 | 数千万美元/年（[自报](https://m.jiemian.com/article/14631332.html)） | 未披露；2026-06 新一轮数亿元（[东方财富](https://finance.eastmoney.com/a/202606233779269161.html)） | [Rodin Gen-2.5](https://hyper3d.ai/) |\n| 腾讯混元 3D（国内） | 2.x 开源，3.x 走腾讯云 API | 不单独披露 | — | [Hunyuan3D 2.0](https://github.com/Tencent-Hunyuan/Hunyuan3D-2) |\n| 数美万物 Hi3D（国内） | 生成 + 自动拆件 + 自建工厂代打印 | 未披露 | 近两轮近 5000 万美元，累计未披露 | [Hi3D](https://www.hitem3d.ai/) |\n| 字节 Seed3D（国内） | 部件与铰接，面向具身仿真资产 | 不单独披露 | — | Seed3D 2.0 |\n| Microsoft TRELLIS.2（海外） | 开源原生 3D 模型 | 开源 | — | [TRELLIS.2](https://github.com/microsoft/TRELLIS.2) |\n| Roblox Cube（海外） | 平台自用的 3D / 4D 生成 | 不单独披露；一年生成 180 万个资产（[Roblox](https://about.roblox.com/de/newsroom/2026/02/accelerating-creation-powered-roblox-cube-foundation-model)） | — | Cube 4D |\n| Kaedim（海外） | 「AI + 人工」3D 外包；2023 年被曝部分「AI 生成」实为人工建模（[404 Media](https://www.404media.co/kaedim-ai-startup-2d-to-3d-used-cheap-human-labor/)） | 未披露 | 累计融资约 1500 万美元 | Lowe's 电商资产 |\n| 拓竹 Bambu Lab（国内） | 分发方：打印机 + MakerWorld 社区 | 2025 年预计破 100 亿元（CEO [自报](https://www.yicai.com/news/103029400.html)） | 未披露 | MakerWorld |\n\n数据解读：\n\n- **拓竹不是 3D 生成公司，却是这张表里收入最大的一家。** 它掌握出口：MakerWorld 月活约 1000 万，Meshy、混元、Hi3D 都在往里接。\n- **大厂开源压住了模型层。** 腾讯、微软、Roblox 都开源 3D 模型，独立公司只能在后处理和分发上做差异。\n\n<a class=\"anchor\" id=\"as-2\"></a>\n\n## 2 Best Practices\n\n核心发现：同一家 Meshy，打印实物的视频 886 万播放，模型发布片 9.7 万，相差约 90 倍。观众买账的不是模型，是打印出来的东西。\n\n| 类别 | 代表 demo | 证明了什么 |\n|---|---|---|\n| 生成后打印 | Meshy 多色打印、Hi3D 打印实测、40cm 手办 | C 端愿意为实物付钱，热度百万级 |\n| 模型发布 | 型最差的地方。\n- **模型层守不住价格。**\n  - 单个模型从 2022 年约 8 美元降到 0.2 到 0.4 美元；开源 TRELLIS.2 每次生成的 GPU 成本不到 0.07 美元。\n  - 西方创业公司在撤退：谷歌收购了 CSM，Luma、Backflip、Sudo 都已转型。\n- **竞争点转向「能不能直接用」。** 直接输出低模、四边面、分件的模型，已取代「先生成再重拓扑」的流程；生成器把绑骨和动画免费打包。\n- **风险来自 IP 和平台政策，不来自技术。** 泡泡玛特起诉拓竹后和解下架；MakerWorld 不让 AI 模型进独家激励计划。\n\n下一步：看 3D 打印出口的付费转化，而不是看生成质量榜。\n\n</div>\n\n<div class=\"env-view\" data-view=\"game\" data-label=\"Game & World\">\n\n<nav class=\"toc view-toc\"><h2>Contents</h2><ul><li class=\"l2\"><a href=\"#gm-1\"><span class=\"num\">1</span> Industry Landscape</a></li><li class=\"l2\"><a href=\"#gm-2\"><span class=\"num\">2</span> Best Practices</a></li><li class=\"l2\"><a href=\"#gm-3\"><span class=\"num\">3</span> Insights</a></li></ul></nav>\n\n世界模型公司一年融资超 30 亿美元，没有一家披露收入；同一时期，Roblox 付给创作者 15 亿美元。游戏里的 AI 钱，流向了已有平台。\n\n<a class=\"anchor\" id=\"gm-1\"></a>\n\n## 1 Industry Landscape\n\n核心发现：有收入的是平台，有估值的是世界模型，两者几乎不重叠。\n\n| 公司 | 定位 | 营收 | 估值 | 代表作 |\n|---|---|---|---|---|\n| Roblox（海外） | UGC 平台：Build 文生游戏、Cube、Roblox Reality | 2025 年付开发者 15 亿美元（[财报](https://www.sec.gov/Archives/edgar/data/1315098/000131509826000024/rblx-20251231.htm)） | 上市 | Roblox 4D 生成 |\n| Epic Fortnite（海外） | UEFN 创作者生态 + AI 角色 NPC | 2024 年付创作者 3.52 亿美元，累计超 10 亿美元 | 私有 | AI 达斯·维达 |\n| Google DeepMind（海外） | Genie 3 像素流世界模型 | 不单独披露 | — | Project Genie |\n| World Labs（海外） | 生成可导出的 3D 世界 | 不公开（[Sacra](https://sacra.com/c/world-labs/)） | AMD 约 82 亿美元收购（[DCK](https://datacenterknowledge.com/data-center-chips/amd-to-acquire-world-labs-for-8-2b-to-advance-ai-models-and-robotics)） | Marble |\n| Decart（海外） | 实时世界模型，转向驾驶仿真 | 约 1260 万美元（2024 [估算](https://getlatka.com/companies/decart.ai)） | 约 40 亿美元 | Oasis |\n| Odyssey（海外） | 实时交互视频，转向机器人 | 未披露 | 14.5 亿美元（2026-06 B 轮 3.1 亿美元） | Odyssey-3 |\n| Runway（海外） | GWM Worlds 世界模型 | 全公司 ARR 2 亿美元（[自报](https://www.briefs.co/news/runway-s-arr-jumps-to-200-million-as-ai-video-finds-its-groo/)） | 53 亿美元 | GWM Worlds 2 |\n| AMI Labs（海外） | LeCun 的 JEPA 世界模型，尚无产品 | 无收入 | 种子轮 10.3 亿美元，投前 35 亿美元（[Latent Space](https://www.latent.space/p/ainews-yann-lecuns-ami-labs-launches)） | 计划 2027 年工业应用 |\n| Astrocade（海外） | 文生休闲游戏信息流 | 未变现，计划 2027 年 | 融资 5600 万美元 | Astrocade |\n| 网易 蛋仔派对（国内） | UGC 游戏 + AI 编辑器 | 创作者激励与分成超 2 亿元/年（[36氪](https://www.36kr.com/p/3896755010963333)） | 上市 | 蛋仔 AI 编辑器 |\n| 网易 逆水寒（国内） | 大模型驱动的智能 NPC | 不单独披露；AI 门客破 4000 万个（2026-07 [官方口径](https://stock.10jqka.com.cn/20260710/c678090861.shtml)） | 上市 | 智能 NPC |\n| 腾讯混元（国内） | 开源世界生成，导出网格和高斯点 | 不单独披露 | — | HY-World 2.0 |\n| 爱诗 PixVerse（国内） | 视频模型 + 实时世界模型 | 全公司 ARR 超 4000 万美元（2025 年底[自报](https://equalocean.com/news/2026031221788-aishi-technology-secures-300m-chinas-biggest-ai-video-funding-round/amp)）；月活 1500 万 | C 轮累计 29.8 亿元 | PixVerse R1 |\n| 阿里（国内） | HappyOyster 实时世界模型，闭源 | 不单独披露 | — | HappyOyster |\n\n数据解读：\n\n- **世界模型的估值来自收购方，不来自用户。** AMD 买 World Labs 是为了芯片生态，Roblox 买 Morpheus 是为了引擎，都不是为了它们的收入。\n- **文生游戏不是新平台，而是老平台的新功能。** Roblox Build、蛋仔编辑器、TapTap 制造都把 AI 当成补充创作者的工具。\n\n<a class=\"anchor\" id=\"gm-2\"></a>\n\n## 2 Best Practices\n\n核心发现：世界模型 demo 的热度落在资本市场，平台 AI 功能的热度落在玩家身上。\n\n| 类别 | 代表 demo | 证明了什么 |\n|---|---|---|\n| 世界模型 | Genie、Marble、Oasis、Odyssey、PixVerse R1 | 画面已经可信；Genie 3 发布当天 Unity 股价跌约 24%，但没有玩家付费 |\n| 平台内 AI 功能 | Roblox 4D、蛋仔 AI 编辑器、逆水寒 NPC、堡垒之夜达斯·维达 | 挂在月活过亿的平台上，用户规模现成 |\n| 独立 AI 游戏 | Fly、星之低语、Astrocade | 个人开发者能赚钱，Fly 17 天 ARR 100 万美元（自报），但不可复制 |\n\n<!--DEMOS:game-->\n\n<div class=\"gal-grid\">\n<a class=\"gal-card mk-card\" href=\"https://www.youtube.com/watch?v=YxkGdX4WIBE\" target=\"_blank\" rel=\"noopener\"><div class=\"gal-poster\" style=\"background:url('assets/market/game-00.jpg') center/cover no-repeat,#1b1f27\"><span class=\"gal-play\">↗ 打开原站</span></div><div class=\"gal-meta\"><div class=\"gal-cn\">谷歌Genie世界</div><div class=\"mk-by\">Google DeepMind</div><div class=\"gal-cap\">Genie 3 驱动，一句话或一张图生成可实时走动、可改写的交互世界</div><div class=\"mk-tags\"><span class=\"mk-tech\">世界模型</span><span class=\"mk-heat\">发布当天 Unity 跌约24%、Roblox 跌约13%、Take-Two 跌约8%；官方视频68万播放</span><span class=\"mk-biz\"  data-view=\"ad\" data-label=\"Ad Creative\">\n\n<nav class=\"toc view-toc\"><h2>Contents</h2><ul><li class=\"l2\"><a href=\"#ad-1\"><span class=\"num\">1</span> Industry Landscape</a></li><li class=\"l2\"><a href=\"#ad-2\"><span class=\"num\">2</span> Best Practices</a></li><li class=\"l2\"><a href=\"#ad-3\"><span class=\"num\">3</span> Insights</a></li></ul></nav>\n\n快手一个季度由 AIGC 素材带动 40 亿元营销消耗，这是视觉生成里最大的一笔现金流。拿走这笔钱的是投放平台和模型方，不是中间的工具公司。\n\n<a class=\"anchor\" id=\"ad-1\"></a>\n\n## 1 Industry Landscape\n\n核心发现：国内由平台主导，海外由独立应用主导，两边的收入规模接近。\n\n| 公司 | 定位 | 营收 | 估值 | 代表作 |\n|---|---|---|---|---|\n| 快手 可灵（国内） | 视频模型 + 磁力引擎投放 | 可灵 2026Q2 超 8.5 亿元（[财报](https://technode.global/?p=990300)） | 上市 | 美团《麻烦死了》 |\n| 字节 即梦 / 巨量引擎（国内） | 模型 + 投放后台一键生成 | 不单独披露 | — | 巨量即创 |\n| 阿里妈妈（国内） | 万相营造商品图、图生视频 | 不单独披露；覆盖约 100 万商家，日省 4000 万元以上（[新浪](https://news.sina.com.cn/o/2025-11-08/doc-infwschz3878925.shtml)） | — | 万相营造 |\n| 美图（国内） | 电商设计、口播视频 | 生产力工具 ARR 6.2 亿元（[财报](https://www.meitu.com/zh/media/439)） | 上市 | 美图设计室 |\n| MiniMax 海螺（国内） | 视频模型 + 开放平台 | 全公司 2026H1 1.17 亿美元（[财报](https://www.minimax.io/news/minimax-announces-first-half-2026-financial-results-1787744160)） | 上市 | 海螺视频 |\n| Higgsfield（海外） | 多模型聚合创意应用 | 年化 10 亿美元（[自报](https://digg.com/ai/5c9uxe03)） | 54 亿美元 | 广告模板 |\n| Runway（海外） | 视频模型 | ARR 2 亿美元（[自报](https://www.briefs.co/news/runway-s-arr-jumps-to-200-million-as-ai-video-finds-its-groo/)） | 53 亿美元 | Gen-4.5 |\n| HeyGen（海外） | 视频数字人 | ARR 1 亿美元（2025-10 [自报](https://x.com/HeyGen_Official/status/1978903438974161329)） | 5 亿美元（2024） | 数字分身 |\n| Synthesia（海外） | 企业视频数字人 | ARR 超 1 亿美元（2025-04 [自报](https://www.arr.club/synthesia)） | 40 亿美元 | 企业培训视频 |\n| Arcads（海外） | AI 演员 UGC 广告 | ARR 1000 万美元，8 名员工（2025-11 [自报](https://getlatka.com/blog/arcads-revenue-ceo)） | 种子轮 1600 万美元，估值未披露（[Jones Day](https://www.jonesday.com/en/practices/experience/2025/12/eurazeo-leads-16-million-seed-financing-in-arcadsai)） | UGC 广告 |\n| Creatify（海外） | 端到端视频广告 agent | ARR 超 900 万美元（上线 18 个月，自报） | 累计融资 2300 万美元（[ ## 3 Insights\n\n- **算力便宜了，钱仍然花在人身上。** 可口可乐 2025 圣诞片用了约 100 人、1 个月，算力不到成本的 1%；省下的是拍摄和后期，不是创意和修片。\n- **国内跑出了新形态：品牌 AI 短剧。** 它不是 30 秒广告，而是品牌自有 IP 的连续剧；每分钟成本 800 到 1500 元，红旗 AI 剧 7600 万播放。\n- **效果提升是个位数。** Meta 可控实验里，AI 生成背景只带来 2% 到 3% 的转化提升；「最高 +40%」这类数字都没有样本量。\n- **确定性层仍有空位。** 生成模型出画面，价格、字幕、logo、多尺寸改版必须逐像素准确，只能交给模板或代码。\n\n下一步：在投放平台的 agent 生态里卖确定性渲染能力，而不是再做一个生成工具。\n\n</div>\n\n<div class=\"env-view\" data-view=\"web\" data-label=\"Web 3D\">\n\n<nav class=\"toc view-toc\"><h2>Contents</h2><ul><li class=\"l2\"><a href=\"#wb-1\"><span class=\"num\">1</span> Industry Landscape</a></li><li class=\"l2\"><a href=\"#wb-2\"><span class=\"num\">2</span> Best Practices</a></li><li class=\"l2\"><a href=\"#wb-3\"><span class=\"num\">3</span> Insights</a></li></ul></nav>\n\n一个获奖级 3D 品牌站要 10 万美元以上、一支十人团队做几个月；同一时期，three.js 的下载量一年涨了 6.4 倍。Web 3D 的瓶颈正在从「谁能做」变成「谁来付钱」。\n\n<a class=\"anchor\" id=\"wb-1\"></a>\n\n## 1 Industry Landscape\n\n核心发现：Web 3D 是四门生意：品牌站项目、配置器 SaaS、网页游戏门户、挂在交易平台上的 3D（看房、电商），彼此几乎不重叠。\n\n| 公司 | 定位 | 营收 | 估值 | 代表作 |\n|---|---|---|---|---|\n| 头部 WebGL 工作室（海外）：Lusion、abeto、OFF+BRAND、Resn、Immersive Garden | 3D 互动品牌站，2022 到 2025 年 Awwwards 年度网站全部出自前四家 | 均未披露 | 私有 | Lando Norris 官网、Igloo Inc、Lusion v3、卡地亚 |\n| Threekit（海外） | 企业配置器 + 虚拟摄影 | 未披露 | 累计融资约 8010 万加元（[BetaKit](https://betakit.com/ottawa-founded-threekit-raises-43-6-million-cad-to-bolster-product-visualization-tech/)） | Virtual Photographer |\n| Zakeke（海外） | Shopify 配置器 SaaS | 59 到 300 美元/月 + 交易抽成 | 未披露 | 定制商品配置器 |\n| Spline（海外） | 无代码 Web 3D + AI | 未披露；创作者超 100 万（2023 [自报](https://techcrunch.com/2023/07/13/spline-a-no-code-design-tool-for-creating-3d-assets-raises-15m/)） | 融资 2500 万美元 | Spline 编辑器 |\n| PlayCanvas（海外） | Web 引擎 + 高斯点编辑器 | Snap 内部 | Snap 收购 | SuperSplat |\n| Poki（海外） | 网页游戏门户 | 未披露；月活超 1 亿，每月 10 亿次游玩（2026-06 [自报](https://poki.com/blog/web-gaming-report-announcement-2026)） | 自筹资金，无外部估值；65 人 | Poki |\n| FRVR（海外） | HTML5 即时游戏发行 + AI 做游戏 | 未披露；触达 10 亿玩家（自报） | 2024 年融资 1320 万美元（[自报](https://corp.frvr.com/?p=2084)） | Krunker.io |\n| 蚂蚁 Galacean（国内） | 自研 WebGL 引擎 | 集团内部 | — | 支付宝「神奇海洋」 |\n| Cocos（国内） | 小游戏引擎，微信内置 | 未披露 | SUD 以 7200 万美元（约 5.1 亿元）全资收购（2025-11 [自报](https://kyodonewsprwire.jp/release/202511128935)） | 微信小游戏 |\n| 如视 Realsee（国内） | VR 看房与 3D 空间重建，贝壳旗下 | 不单独披露；3D 空间模型超 5500 万个，服务 3000 多个品牌（2025 年底[自报](https://kyodonewsprwire.jp/index.php/release/202601072092)） | 未独立融资 | 贝壳 VR 看房 |\n| 小米汽车（国内） | 官网产品页用 three.js | — | — | SU7 产品页 |\n\n数据解读：\n\n- **品牌站项目的价格高，但集中在不到 10 家工作室。** 产品故事站 2 万到 6 万美元，品牌世界 10 万美元以上；Awwwards 年度网站 2022 到 2025 年依次出自 Resn、Lusion、abeto、OFF+BRAND。\n- **配置器是唯一的标准化 SaaS。** 市场约 17 亿美元；Amazon 称点开 3D 的用户转化约 2 倍。\n- **网页游戏门户有流量，变现靠广告。** Poki 月活 1 亿、只有 65 人且不融资，不披露收入。\n- **规模最大的 Web 3D 不单独收费。** 如视 5500 万个 3D 空间模型、天猫 3D 购都不单独披露收入，因为它们的价值算在房产成交和电商 GMV 里。\n\n<a class=\"anchor\" id=\"wb-2\"></a>\n\n## 2 Best Practices\n\n核心发现：热度最大的 Web 3D 不是获奖品牌站，而是挂在交易和流量入口上的产品：Shopify 黑五地球背后是 146 亿美元销售，Krunker 累计 2 亿玩家，贝壳 VR 房源超 1800 万套。\n\n| 类别 | 代表 demo | 证明了什么 |\n|---|---|---|\n| 品牌站 | Lando Norris、Igloo Inc、Lusion、卡地亚 | 质感上限已达电影级，但多是工作室自我宣传 |\n| 产品与电商 | 小米 SU7/YU7、Shopify 黑五、天猫 3D 购、得物 AR、贝壳 VR、Sketchfab | 3D 挂在下单流程上，热度来自交易本身 |\n| 网页游戏 | Krunker、Smash Karts | 免下载即玩，靠广告和内购变现 |\n| 科普与文旅 | NASA Eyes、亚运数字火炬手、数字藏经洞、云游长城 | 国家级项目，人次过千万到上亿，付费方是机构 |\n| 平台工具 | SuperSplat、Cesium | 卖给开发者的底座，以收购收场 |\n\n<!--DEMOS:web-->\n\n<div class=\"gal-grid\">\n<a class=\"gal-card mk-card\" href=\"https://landonorris.com/\" target=\"_blank\" rel=\"noopener\"><div class=\"gal-poster\" style=\"background:url('assets/market/web-00.jpg') center/cover no-repeat,#1b1f27\"><span class=\"gal-play\">↗ 打开原站</span></div><div class=\"gal-meta\"><div class=\"gal-cn\">兰多·诺里斯官网</div><div class=\"mk-by\">OFF+BRAND × Lando Norris</div><div class=\"gal-cap\">three.js 3D 头盔随滚动变形，车手品牌做成沉浸叙事</div><div class=\"mk-tags\"><span class=\"mk-tech\">three.js</span><span class=\"mk-heat\">Awwwards 2025 年度网站 + 用户选择奖</span><span class=\"mk-biz\">F1 车手个人品牌官网</span></div></div></a>\n<a class=\"gal-card mk-card\" href=\"https: lass=\"gal-cap\">浏览器里流式加载全球地形与谷歌写实 3D 城市瓦片</div><div class=\"mk-tags\"><span class=\"mk-tech\">Cesium / 3D Tiles</span><span class=\"mk-heat\">被 Bentley 收购；月活设备 100 万+（官方稿）</span><span class=\"mk-biz\">Cesium ion 订阅</span></div></div></a>\n</div>\n\n<!--/DEMOS-->\n\n<a class=\"anchor\" id=\"wb-3\"></a>\n\n## 3 Insights\n\n- **AI 写代码改变的是中腰部，不是头部。** 获奖作品靠手艺，代码生成替代不了；但 2 万到 6 万美元的产品页和配置器有固定套路，代码生成可以把成本压下来。\n- **大奖不等于大生意。** 获奖站多是工作室给自己做的宣传，Lusion v3、Bruno Simon、Oryzo 都是；常见的付费项目预算只有 1 万到 5 万美元。\n- **WebGPU 还在炫技阶段。** 浏览器覆盖 88%，但生产站点仍以 WebGL 为主；3DGS 是第一个 WebGPU 优先的生产场景。\n- **下载量不等于开发者数。** npm 数字含 CI 和机器安装，「AI 推动增长」是推断，不是测量。\n\n下一步：用 visual coder 批量做中腰部产品页和配置器，以项目单价下降幅度衡量效果。\n\n</div>\n\n<div class=\"env-view\" data-view=\"industry\" data-label=\"Industrial 3D\">\n\n<nav class=\"toc view-toc\"><h2>Contents</h2><ul><li class=\"l2\"><a href=\"#in-1\"><span class=\"num\">1</span> Industry Landscape</a></li><li class=\"l2\"><a href=\"#in-2\"><span class=\"num\">2</span> Best Practices</a></li><li class=\"l2\"><a href=\"#in-3\"><span class=\"num\">3</span> Insights</a></li></ul></nav>\n\nUnity 的引擎收入一年只涨 1%，光轮智能一个季度新签 5.5 亿元。产业 3D 不是一个增长市场，而是一个存量市场里的两个增量。\n\n产业 3D 指游戏和营销之外的 3D：车机、虚拟制片、数字人、数字孪生、仿真数据、建筑设计、CAD。\n\n<a class=\"anchor\" id=\"in-1\"></a>\n\n## 1 Industry Landscape\n\n核心发现：上市公司多、增长平；两个增量是中国车机座舱和具身合成数据。\n\n| 公司 | 定位 | 营收 | 估值 | 代表作 |\n|---|---|---|---|---|\n| Epic Unreal（海外） | 引擎：车机、虚拟制片、数字人 | 不拆分非游戏收入 | 私有（腾讯持股 28%） | Rivian 车机、MetaHuman |\n| Unity（海外） | 引擎 + Unity Industry | 2025 年 18.5 亿美元（[10-K](https://www.sec.gov/Archives/edgar/data/1810806/000181080626000011/unity-20251231.htm)） | 上市 | 丰田下一代 HMI |\n| Unity 中国 团结引擎（国内） | 车机座舱、小游戏、鸿蒙 | 不单独披露 | 10 亿美元（2024，[36Kr](https://36kr.jp/287636/)） | 零跑 C10 座舱 |\n| NVIDIA（海外） | Omniverse 孪生、Isaac 仿真、Cosmos | 不拆分 | 上市 | 宝马虚拟工厂 |\n| Bentley（海外） | 基建工程软件 + Cesium 3D Tiles | 2025 财年 15.02 亿美元，+11%（[财报](https://finance.yahoo.com/news/bentley-systems-q4-earnings-call-170635732.html)） | 上市 | iTwin 基建孪生 |\n| Applied Intuition（海外） | 自动驾驶仿真、国防 | 约 8.3 亿美元/年（[估算](https://sacra.com/research/applied-intuition-at-830m-year/)） | 150 亿美元 | 车企仿真平台 |\n| 光轮智能（国内） | 具身仿真资产与合成数据 | 2026Q1 新签 5.5 亿元（[自报](https://autonews.gasgoo.com/articles/market-industry/2069795751096725504)） | 融资超 20 亿元 | 仿真资产库 |\n| 群核科技（国内） | 酷家乐设计 SaaS + 合成数据 | 2025 年 8.2 亿元，毛利 82%（[财报](https://wallstreetcn.com/articles/3769573)） | 上市 | InteriorGS |\n| 51WORLD（国内） | 数字孪生底座 | 2024 年 2.87 亿元；2026H1 约 1.24 亿元，+130%（[Bamboo Works](https://thebambooworks.com/zh/tag/%e4%ba%94%e4%b8%80%e8%a6%96%e7%95%8c/)） | 上市 | 孪生港口 |\n| 凡拓数创（国内） | 3D 可视化与展厅集成 | 2025 年 6.31 亿元，+73%，毛利约 23.5%，亏损 1.33 亿元（[财报](https://vip.stock.finance.sina.com.cn/corp/go.php/vFD_ProfitStatement/stockid/301313/ctrl/2025/displaytype/4.phtml)） | 上市 | 数字展厅 |\n| Matterport / CoStar（海外） | 实景采集看房 | 10 个月贡献 1.47 亿美元（[10-K](https://www.sec.gov/Archives/edgar/data/1057352/000105735226000020/csgp-20251231.htm)） | CoStar 16 亿美元收购 | 3D 看房 |\n| 爱奇艺（国内） | 横店 LED 虚拟制片棚 | 虚拟制片项目同比 +50% | 上市 | 《大梦归离》 |\n| Adam（海外） | Text-to-CAD，CAD-as-code | 未披露；用户已生成 100 万+ 模型（[自报](https://adam.new/seed)） | 种子轮 410 万美元 | Adam |\n\n数据解读：\n\n- **存量业务增长平。** Unity 引擎板块同比 +1%；群核首次盈利，但 2026H1 收入只增 1.5%。\n- **增量集中在两处。** 团结引擎自报覆盖 77 款量产车型；光轮单季新签额是群核同类业务的数十倍。\n\n<a class=\"anchor\" id=\"in-2\"></a>\n\n## 2 Best Practices\n\n核心发现：产业 3D 的 demo 不是展示品，而是生产工具本身。\n\n| 类别 | 代表 demo | 证明了什么 |\n|---|---|---|\n| 内容生产 | 曼达洛人、爱奇艺横店棚、MetaHuman、HeyGen、D5 | 3D 替代实拍和后期，按棚天或订阅收费 |\n| 车与工厂 | Rivian 车机、团结引擎座舱、宝马虚拟工厂、51WORLD 港口 | 引擎进入量产车和产线规划，按授权或项目收费 |\n| 仿真与采集 | Cosmos、Waymo、光轮、InteriorGS、Matterport | 3D 场景变成训练数据和房产孪生，付费方是机器人、自动驾驶和地产平台 |\n| CAD | Adam | 参数化代码直接作为交付物 |\n\n<!--DEMOS:industry-->\n\n<div class=\"gal-grid\">\n<a class=\"gal-card mk-card\" href=\"https://www.youtube.com/watch?v=gUnxzVOs3rk\" target=\"_blank\" rel=\"noopener\"><div class=\"gal-poster\" style=\"background:url('assets/market/industry-00.jpg') center/cover no-repeat,#1b1f27\"><span class=\"gal-play\">↗ 打开原站</span></div><div class=\"gal-meta\"><div class=\"gal-cn\">曼
