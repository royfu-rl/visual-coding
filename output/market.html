凡拓数创毛利约 23% 且亏损。\n  - 虚拟制片承诺的 10 倍降本没有兑现：Sony 关停 Pixomondo，横店报价一年降约 78%。\n\n下一步：盯具身合成数据和 CAD-as-code，这两处同时满足「付费方已存在」和「代码就是交付物」。\n\n</div>\n\n<div class=\"env-view\" data-view=\"webdev\" data-label=\"WebDev Gallery\">\n\n<nav class=\"toc view-toc\"><h2>Contents</h2><ul><li class=\"l2\"><a href=\"#xw-1\"><span class=\"num\">1</span> Scene Taxonomy</a></li><li class=\"l2\"><a href=\"#xw-2\"><span class=\"num\">2</span> Gallery</a></li><li class=\"l3\"><a href=\"#xw-s1\"><span class=\"num\">2.1</span> 个人作品集与简历站</a></li><li class=\"l3\"><a href=\"#xw-s2\"><span class=\"num\">2.2</span> 动效官网与网页复刻</a></li><li class=\"l3\"><a href=\"#xw-s3\"><span class=\"num\">2.3</span> 3D 交互小世界</a></li><li class=\"l3\"><a href=\"#xw-s4\"><span class=\"num\">2.4</span> HTML 汇报与 PPT</a></li><li class=\"l3\"><a href=\"#xw-s5\"><span class=\"num\">2.5</span> 网页与 H5 小游戏</a></li><li class=\"l3\"><a href=\"#xw-s6\"><span class=\"num\">2.6</span> 运营活动页与 H5</a></li><li class=\"l3\"><a href=\"#xw-s7\"><span class=\"num\">2.7</span> 数据大屏与内部工具</a></li><li class=\"l3\"><a href=\"#xw-s8\"><span class=\"num\">2.8</span> 交互科普与课件</a></li><li class=\"l3\"><a href=\"#xw-s9\"><span class=\"num\">2.9</span> 数字策展与文博</a></li><li class=\"l3\"><a href=\"#xw-s10\"><span class=\"num\">2.10</span> 小程序与独立站</a></li><li class=\"l2\"><a href=\"#xw-3\"><span class=\"num\">3</span> Insights</a></li><li class=\"l2\"><a href=\"#xw-4\"><span class=\"num\">4</span> Data Caliber</a></li></ul></nav>\n\n小红书上 webdev 赞最高的一条，标题是「Vibe Coding 进化成 Visual Coding 了」：丢给 AI 一张截图和一段录屏，像素级复刻网页，1.9 万赞、2.5 万收藏。本页从 25 个关键词、744 条笔记里，按场景挑出 43 个最佳实践。\n\n<a class=\"anchor\" id=\"xw-1\"></a>\n\n## 1 Scene Taxonomy\n\n核心发现：小红书上的 webdev 大多是「做给自己用」：作品集、汇报、给孩子的网站。付费方要么是创作者本人，要么根本没有；能直接看到收入的只有小游戏和小程序，而且数字很小。\n\n| 场景 | 领域 | 常用项目 | 最热案例 | 小红书热度 |\n|---|---|---|---|---|\n| 个人作品集与简历站 | 求职 · 个人品牌 | three.js、Codex、Claude Code | Kia 把作品集做成泳池 | 赞 10,996 · 藏 6,270 |\n| 动效官网与网页复刻 | 品牌官网 · 落地页 | Kimi K2.5、Codex、Claude Code、设计 skill | 赛文乔伊 截图 + 录屏复刻 | 赞 19,318 · 藏 25,322 |\n| 3D 交互小世界 | 创意编程 · 内容传播 | three.js、p5.js、Tripo API | Ray 的果冻海岛 Jelly Planet | 赞 11,316 · 藏 3,698 |\n| HTML 汇报与 PPT | 职场汇报 · 科研组会 | Claude Design、Codex、TapNow | 交互式 HTML 汇报 | 赞 7,436 · 藏 7,503 |\n| 网页与 H5 小游戏 | 游戏 · 粉丝运营 | Codex、Kimi Code、Tripo | 「AI 的 4399」小游戏合集 | 赞 4,154 · 藏 3,588 |\n| 运营活动页与 H5 | 电商 · 节日营销 | 即梦、Figma、AI 生图 | Figma + 即梦角色动效 | 赞 5,143 · 藏 5,856 |\n| 数据大屏与内部工具 | 企业 B 端 | Cursor、Codex、Lovart | 3 小时搭舆情监控平台 | 赞 1,175 · 藏 1,447 |\n| 交互科普与课件 | 教育 · 科普 | Codex、anatomy skill | 人体拆成 2234 块的 3D 站 | 赞 7,575 · 藏 4,559 |\n| 数字策展与文博 | 文博 · 文旅 | Gemini、Codex、pretext | 古迹 3D + 文字实时绕排 | 赞 2,499 · 藏 3,339 |\n| 小程序与独立站 | 独立开发 · 出海 | Lovable、微信小程序、TapTap | 一个人做网站月入 1.2 万美元（标题自述） | 赞 2,963 · 藏 3,635 |\n\n工具份额（744 条 webdev 笔记，按标题和正文提及计）：\n\n| 项目 | 提及笔记 | 赞合计 |\n|---|---|---|\n| Codex | 58 | 68,608 |\n| Claude / Opus / Sonnet | 57 | 58,186 |\n| three.js | 42 | 46,442 |\n| GPT-6 / Astra | 30 | 40,722 |\n| HTML PPT | 37 | 34,683 |\n| 小程序 | 34 | 24,799 |\n| Cursor | 12 | 17,226 |\n| Gemini | 19 | 7,944 |\n| Kimi | 6 | 7,691 |\n| GSAP | 18 | 3,676 |\n| Lovable | 27 | 2,817 |\n| 扣子 / Coze | 15 | 1,725 |\n| v0 | 9 | 224 |\n\n数据解读：\n\n- **Codex、Claude、three.js 三家占了大头。** 模型侧是 Codex 和 Claude，渲染侧是 three.js；3D 交互小世界这一组 5 张卡里 4 张用 three.js。\n- **海外热门的 app builder 在小红书没有用户基础。** Lovable 被提到 27 次，但赞合计只有 2,817，大多出现在「工具清单」里；v0 几乎为零。\n- **HTML 汇报是收藏型刚需。** 这一组的收藏数接近或超过点赞（Claude Design 那条赞 6,417、藏 1.06 万），说明大家是存起来照着做。\n\n<a class=\"anchor\" id=\"xw-2\"></a>\n\n## 2 Gallery\n\n每张卡：封面链到小红书原帖；项目名链到官网（带 logo）；下面依次是示例、谁在用、领域和热度。转述海外案例的注明原作者。\n\n<!--XG:webdev-->\n\n<a class=\"anchor\" id=\"xw-s1\"></a>\n\n### 个人作品集与简历站\n\n小红书 webdev 内容里量最大的一类，付费方是求职者自己。做法很统一：找 5–6 个参考站丢给 AI，three.js 做 3D，GitHub + Cloudflare 免费部署。\n\n<div class=\"gal-grid\">\n<div class=\"gal-card mk-card xg-card\"><a href=\"https://www.xiaohongshu.com/explore/6ad4f792000000001400c800?xsec_token=ABvwejsjldc9bIaf2J9wNRhpzdm4F_gCy-OpPEWpupEeU=&amp;xsec_source=pc_search\" target=\"_blank\" rel=\"noopener\"><div class=\"gal 只代表「被提到」，不代表真实使用；约 100 条入围笔记抓了正文，其余只有标题。\n- **转述**：标「转述」的卡片，原作是 X 或海外访谈，小红书博主是搬运者；收入数字均为自述或转述，未核实。\n- **数据文件**：`middle_processing/market/xhs/`（search/ 原始结果、notes/ 正文、gallery.json 卡片），由 `scripts/xhs_crawl.py` 和 `scripts/market_xhs_gallery.py` 生成。\n\n</div>\n\n<div class=\"env-view\" data-view=\"xhs3d\" data-label=\"3D Gallery\">\n\n<nav class=\"toc view-toc\"><h2>Contents</h2><ul><li class=\"l2\"><a href=\"#x3-1\"><span class=\"num\">1</span> Scene Taxonomy</a></li><li class=\"l2\"><a href=\"#x3-2\"><span class=\"num\">2</span> Gallery</a></li><li class=\"l3\"><a href=\"#x3-s1\"><span class=\"num\">2.1</span> 3D 打印手办</a></li><li class=\"l3\"><a href=\"#x3-s2\"><span class=\"num\">2.2</span> 大模型操作 Blender</a></li><li class=\"l3\"><a href=\"#x3-s3\"><span class=\"num\">2.3</span> 游戏与资产库</a></li><li class=\"l3\"><a href=\"#x3-s4\"><span class=\"num\">2.4</span> 角色与虚拟人</a></li><li class=\"l3\"><a href=\"#x3-s5\"><span class=\"num\">2.5</span> 高斯泼溅与实景</a></li><li class=\"l3\"><a href=\"#x3-s6\"><span class=\"num\">2.6</span> 影视预演与 AI 视频</a></li><li class=\"l3\"><a href=\"#x3-s7\"><span class=\"num\">2.7</span> 产品外观与工业件</a></li><li class=\"l2\"><a href=\"#x3-3\"><span class=\"num\">3</span> Insights</a></li><li class=\"l2\"><a href=\"#x3-4\"><span class=\"num\">4</span> Data Caliber</a></li></ul></nav>\n\n小红书 3D 线赞最高的一条，是 Blender 教程博主用 Tripo 生成全部资产、再在 Blender 里搭一汪荷塘，1.8 万赞。GPT-6 Astra 发布后，「让大模型经 MCP 开 Blender」成了标配。本页从 13 个关键词、327 条笔记里，按场景挑出 30 个最佳实践。\n\n<a class=\"anchor\" id=\"x3-1\"></a>\n\n## 1 Scene Taxonomy\n\n核心发现：热度在「大模型操作 Blender」，钱在 3D 打印和视频预演。3D 打印的付费方是家长和潮玩爱好者；视频预演已经有商单，AI 短剧公司在发 Blender 白模的单子。\n\n| 场景 | 领域 | 常用项目 | 最热案例 | 小红书热度 |\n|---|---|---|---|---|\n| 3D 打印手办（AI → 实物） | 亲子 · 潮玩 · 家居摆件 | Hitem3D、Hyper3D Rodin、拓竹 MakerLab、Meshy | 圣诞怪兽派对超大手办 | 赞 1,601 · 藏 1,682 |\n| 大模型操作 Blender | 场景美术 · DCC 自动化 | Blender、Tripo、Codex、Hyper3D MCP | KurTips 荷塘教程 | 赞 17,559 · 藏 13,842 |\n| 游戏与资产库 | 独立游戏 · 资产规模化 | Tripo、Unity / Godot / UE5 MCP、Codex | 《小王子》同款梵高小岛 | 赞 6,789 · 藏 7,332 |\n| 角色与虚拟人 | VTuber · IP · 兵人 | Tripo P2.0、Warudo、Rodin | AI 生成 3D 角色流程 | 赞 2,134 · 藏 2,600 |\n| 高斯泼溅与实景 | 沉浸网页 · 旅行 · 数字艺术 | World Labs Marble、Insta360 X6 | 用高斯泼溅做网页 | 赞 3,248 · 藏 2,143 |\n| 影视预演与 AI 视频 | 品牌片 · AI 短剧 | Hyper3D Rodin、Blender MCP | 何同学一镜到底幕后 | 赞 1,859 · 藏 2,056 |\n| 产品外观与工业件 | 硬件 · 电商产品页 | Codex + FreeCAD、Codex + Blender | Codex 做电路板外壳 | 赞 1,876 · 藏 2,061 |\n\n工具份额（327 条 3D 笔记，按标题和正文提及计）：\n\n| 项目 | 提及笔记 | 赞合计 |\n|---|---|---|\n| Blender | 58 | 49,393 |\n| Tripo | 29 | 35,836 |\n| GPT-6 / Astra | 55 | 30,941 |\n| 高斯泼溅 / 3DGS | 32 | 9,724 |\n| Claude / Opus | 8 | 9,644 |\n| Codex | 14 | 9,027 |\n| Hyper3D / Rodin | 14 | 7,301 |\n| MCP | 15 | 6,159 |\n| Meshy | 20 | 4,941 |\n| 混元3D | 22 | 4,717 |\n| 3D 打印 / 拓竹 | 12 | 3,276 |\n\n数据解读：\n\n- **Tripo 是小红书上 3D 生成的默认选项。** 29 条、3.6 万赞，远高于 Meshy（20 条、4,941 赞）和混元（22 条、4,717 赞）；Meshy 和混元的笔记不少是官方号、招聘和创始人访谈。\n- **Blender 成了大模型的 3D 操作系统。** 提及最多（58 条），GPT-6、Codex、Claude 都经 MCP 操作它；UE5、Unity、Godot 也开始出现同样的 MCP 用法。\n- **钱在打印和预演，不在建模本身。** Meshy 创始人自述严格口径 ARR 已过 1 亿美元，而小红书上看到的落地是手办和视频预演。\n\n<a class=\"anchor\" id=\"x3-2\"></a>\n\n## 2 Gallery\n\n每张卡：封面链到小红书原帖；项目名链到官网（带 logo）；下面依次是示例、谁在用、领域和热度。\n\n<!--XG:3d-->\n\n<a class=\"anchor\" id=\"x3-s1\"></a>\n\n### 3D 打印手办（AI → 实物）\n\n离钱最近的 3D 场景，付费方是家长和潮玩爱好者。链路固定：生图→图生 3D→拆件修模→切片打印；打印绕开了 AI 3D 最弱的拓扑、UV 和绑骨。\n\n<div class=\"gal-grid\">\n<div class=\"gal-card mk-card xg-card\"><a href=\"https://www.xiaohongshu.com/explore/692d7cd8000000001e0368b9?xsec_token=ABzStfYKx7aJ1pVRSKFeiLmMDwqXVB0bIVWuWCwKK4iUI=&amp;xsec_source=pc_search\" target=\"_blank\" rel=\"noopener\"><div class=\"gal-poster\" style=\"background:url('assets/market/xhs-692d7cd8000000001e0368b9.jpg') center/cover no-repeat,#1b1f27\"><span class=\"gal-play\">↗ 看示例</span></div></a><div class=\"gal-meta\"><a class=\"xg-proj\" href=\"https://www.hitem3d.ai/\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/market/logo-hitem3d.png\" alt=\"\">Hitem3D</a><div class=\"gal-cap\"><b>示例</b>圣诞怪兽派对超大手办：豆包出图→Hitem3D 生成 STL       nav.className = 'toc';
      cH.parentNode.insertBefore(nav, cH);
      nav.appendChild(cH);
      nav.appendChild(nav.nextElementSibling);   // 上一步之后 ul 正好紧跟在 nav 后面
    }

    // 同一列上下相邻、内容相同的格子合并成一格（rowspan）；首列的空格、任意列的「同上」当作上一格的延续。
    // 纯数字与 — ✓ ✗ △ 这类符号是各行各自的取值，碰巧相同也不合并。
    function mergeCells(t) {
      if (!t.tBodies[0] || t.querySelector('[rowspan],[colspan]')) return;
      const rows = Array.prototype.slice.call(t.tBodies[0].rows);
      const ncol = rows.length ? rows[0].cells.length : 0;
      if (rows.length < 2 || rows.some(r => r.cells.length !== ncol)) return;
      const grid = rows.map(r => Array.prototype.slice.call(r.cells));
      const SKIP = /^[\s—–\-✓✗△?？]*$|^[\d.,\s]+[%x×倍]?$/;
      let merged = false;
      for (let c = ncol - 1; c >= 0; c--) {          // 从右往左删格子，左边列的引用不受影响
        let anchor = null;
        for (let r = 0; r < grid.length; r++) {
          const cell = grid[r][c], txt = cell.textContent.trim();
          const same = anchor && !SKIP.test(txt) && cell.innerHTML.trim() === anchor.innerHTML.trim();
          if (anchor && ((c === 0 && txt === '') || txt === '同上' || same)) {
            anchor.rowSpan += 1; cell.remove(); merged = true;
            if (c === 0) rows[r].classList.add('cont');
          } else anchor = cell;
        }
      }
      if (merged) t.classList.add('merged');
      // 首列是长句（如「规则：说明」）时，限定首列宽度，免得把后面的结论列挤成一行几个字
      if (rows.some(r => !r.classList.contains('cont') && r.cells[0] && r.cells[0].textContent.trim().length > 30))
        t.classList.add('wide-lead');
    }

    body.querySelectorAll('table').forEach(t => {
      let w = t.parentElement;
      if (!w || !w.classList.contains('tbl-scroll')) {
        w = document.createElement('div');
        w.className = 'tbl-scroll';
        t.parentNode.insertBefore(w, t);
        w.appendChild(t);
      }
      if (docData.id !== 'market') mergeCells(t);     // Market 的表多是矩阵，合并后下面的格子看着像没填
      // 带合并单元格（rowspan）的表每行格子数不同，按列分类会错位：只包滚动容器，不定列宽
      if (t.querySelector('[rowspan]')) return;
      const rows = Array.prototype.slice.call(t.rows);
      const ncol = rows.reduce((m, r) => Math.max(m, r.cells.length), 0);
      let allTight = ncol > 0;
      for (let c = 0; c < ncol; c++) {
        let longest = 0, wrapped = false;
        rows.forEach(r => {
          const cell = r.cells[c];
          if (!cell || cell.tagName === 'TH') return;   // headers don't decide the class
          longest = Math.max(longest, (cell.textContent || '').trim().length);
          if (cell.querySelector('br,ul,ol,p,pre')) wrapped = true;
        });
        const tight = !wrapped && longest > 0 && longest <= TIGHT_MAX;
        if (!tight) allTight = false;
        rows.forEach(r => {
          const cell = r.cells[c];
          if (cell) cell.classList.add(tight ? 'c-tight' : 'c-prose');
        });
      }
      if (allTight) w.classList.add('hug');
    });

    // External links open in a new tab; local .md links were rewritten by
    // build.py to #doc:<id> and are handled by the click interceptor below.
    body.querySelectorAll('a[href]').forEach(a => {
      const href = a.getAttribute('href') || '';
      if (/^(https?:|mailto:)/.test(href)) { a.target = '_blank'; a.rel = 'noopener'; }
    });

    typesetMath(body);
    article.appendChild(body);
    docsEl.appendChild(article);
  });

  // ---- navigation ----------------------------------------------------------

  // Never stretch a table past its natural width. The class pass above sizes
  // columns, but a table with three short columns and one 20-char prose column
  // still gets width:100% — the prose column then absorbs ~700px of leftover for
  // 20 characters, which reads as a broken layout (评测维度 / 视频数 was exactly
  // that). So measure each table once at width:auto: if its content comfortably
  // fits the column, let the wrapper hug it (same .hug path all-tight tables take);
  // otherwise it keeps width:100% and wraps as before. Deferred to activate()
  // because .doc is display:none until then, and clientWidth would read 0 — hence
  // the dataset.fit latch, which is only set once a real width was measured.
  function fitTables(scope) {
    scope.querySelectorAll('.tbl-scroll').forEach(w => {
      if (w.dataset.fit || !w.clientWidth) return;
      w.dataset.fit = '1';
      const t = w.querySelector('table');
      if (!t || w.classList.contains('hug')) return;
      const avail = w.clientWidth;
      t.style.width = 'auto';
      const natural = t.scrollWidth;
      t.style.width = '';
      if (natural <= avail * 0.94) w.classList.add('hug');
    });
  }
  document.querySelectorAll('.doc.active').forEach(fitTables);

  function activate(id) {
    const doc = byId[id];
    if (!doc) return;

    const tabId = tabAncestor(id);
    document.querySelectorAll('.tab').forEach(
      tab => tab.classList.toggle('active', tab.dataset.target === tabId)
    );
    document.querySelectorAll('.doc').forEach(
      docEl => docEl.classList.toggle('active', docEl.id === 'doc-' + id)
    );
    document.querySelectorAll('.doc.active').forEach(fitTables);

    if (location.hash.slice(1) !== id) history.replaceState(null, '', location.pathname + location.search + '#' + id);   // 写全路径，保证地址栏始终带 index.html
    window.scrollTo({
      top: document.querySelector('.tabs-wrap').offsetTop - STICKY_HEADER_HEIGHT,
      behavior: 'smooth',
    });
  }


  // ---- Environment 视图切换 ------------------------------------------------
  // md 里用 <div class="env-view" data-view="web" data-label="Web"> 包住每个视图，
  // 这里把同一 doc 内的 .view-switch 占位填成按钮组。URL 深链：#env/3d
  function showView(docEl, key, push) {
    docEl.querySelectorAll('.env-view').forEach(v => v.classList.toggle('active', v.dataset.view === key));
    docEl.querySelectorAll('.view-switch a').forEach(b => b.classList.toggle('active', b.dataset.view === key));
    tabsEl.querySelectorAll('.tab[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === key));
    const descEl = docEl.querySelector('.view-desc');
    const cur    = docEl.querySelector('.env-view[data-view="' + key + '"]');
    if (descEl && cur) descEl.textContent = cur.dataset.desc || '';
    fitTables(docEl);
    if (push) history.replaceState(null, '', location.pathname + location.search + '#' +
      (SOLO ? key : docEl.id.replace(/^doc-/, '') + '/' + key));
  }
  document.querySelectorAll('.doc').forEach(docEl => {
    const views = docEl.querySelectorAll('.env-view');
    if (!views.length) return;
    if (SOLO && docEl.id === 'doc-' + SOLO.id) {
      // 视图直接当顶部标签；页内那个 Contents 盒子就重复了，换成当前视图的一句话说明
      docEl.querySelectorAll('.view-switch').forEach(sw => {
        sw.classList.add('view-desc');
        sw.classList.remove('view-switch');
      });
      views.forEach(v => {
        const b = document.createElement('button');
        b.className = 'tab'; b.textContent = v.dataset.label;
        b.dataset.view = v.dataset.view;
        b.onclick = () => showView(docEl, v.dataset.view, true);
        tabsEl.appendChild(b);
      });
    } else {
      docEl.querySelectorAll('.view-switch').forEach(sw => {
        sw.classList.add('toc');
        const h = document.createElement('h2');
        h.textContent = 'Contents';
        const ul = document.createElement('ul');
        views.forEach(v => {
          const li = document.createElement('li');
          const a = document.createElement('a');
          a.textContent = v.dataset.label; a.dataset.view = v.dataset.view;
          a.onclick = () => showView(docEl, v.dataset.view, true);
          li.appendChild(a); ul.appendChild(li);
        });
        sw.appendChild(h); sw.appendChild(ul);
      });
    }
    showView(docEl, views[0].dataset.view, false);
  });

  // ---- 正文按小节折叠 ---------------------------------------------------------
  // 每个 h3 连同其后直到下一个 h1 / h2 / h3 的兄弟节点包进 .fold-body；点标题收起 / 展开。
  // 默认全展开；目录或深链跳进收起的小节时自动展开；目录卡片右上角一键全部收起 / 展开。
  function setFold(h, folded) {
    const body = h.nextElementSibling;
    if (!body || !body.classList.contains('fold-body')) return;
    h.classList.toggle('folded', folded);
    body.classList.toggle('folded', folded);
    h.setAttribute('aria-expanded', String(!folded));
    if (!folded) {
      body.classList.remove('opening'); void body.offsetWidth; body.classList.add('opening');
      fitTables(body);
    }
  }
  document.querySelectorAll('.doc h3').forEach(h => {
    const parent = h.parentElement;
    if (!parent || parent.closest('nav, table, details, .nt-card, .tbl-pane')) return;
    const wrap = document.createElement('div');
    wrap.className = 'fold-body';
    let n = h.nextSibling;
    while (n && !(n.nodeType === 1 && /^H[123]$/.test(n.tagName))) {
      const next = n.nextSibling; wrap.appendChild(n); n = next;
    }
    if (!wrap.childNodes.length) return;
    parent.insertBefore(wrap, h.nextSibling);
    h.classList.add('foldable');
    h.tabIndex = 0;
    h.setAttribute('aria-expanded', 'true');
    h.title = '点击收起 / 展开本节';
    h.addEventListener('click', e => {
      if (e.target.closest('a[href]')) return;
      if (String(window.getSelection())) return;          // 拖选标题文字划备注时不当作点击
      setFold(h, !h.classList.contains('folded'));
    });
    h.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setFold(h, !h.classList.contains('folded')); }
    });
  });
  // 目录卡片：一键全部收起 / 展开（只管本视图）
  document.querySelectorAll('.doc .view-toc').forEach(nav => {
    const scope = nav.closest('.env-view') || nav.parentElement;
    const heads = () => Array.prototype.slice.call(scope.querySelectorAll('h3.foldable'));
    if (!heads().length) return;
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'fold-all'; btn.textContent = '全部收起';
    btn.onclick = () => {
      const anyOpen = heads().some(h => !h.classList.contains('folded'));
      heads().forEach(h => setFold(h, anyOpen));
      btn.textContent = anyOpen ? '全部展开' : '全部收起';
    };
    nav.appendChild(btn);
  });
  // 跳到收起小节里的锚点：先展开所在小节
  function revealTarget(id) {
    const t = id && document.getElementById(id);
    if (!t) return;
    let b = t.closest('.fold-body.folded');
    while (b) { setFold(b.previousElementSibling, false); b = b.parentElement && b.parentElement.closest('.fold-body.folded'); }
    if (t.classList && t.classList.contains('foldable') && t.classList.contains('folded')) setFold(t, false);
  }
  document.addEventListener('click', e => {
    const a = e.target.closest && e.target.closest('a[href^="#"]');
    if (a) revealTarget(decodeURIComponent(a.getAttribute('href').slice(1)));
  }, true);


  // ---- 可切换分组表 -------------------------------------------------------
  // md 里 <div class="tbl-tabs"> 包若干 <div class="tbl-pane" data-label data-count>，
  // 这里生成顶部按钮条，默认显示第一组。
  document.querySelectorAll('.tbl-tabs').forEach(box => {
    const panes = Array.prototype.filter.call(box.children, c => c.classList.contains('tbl-pane'));
    if (!panes.length) return;
    const bar = document.createElement('div');
    bar.className = 'tbl-tabs-bar';
    const show = i => {
      panes.forEach((p, j) => p.classList.toggle('active', i === j));
      bar.querySelectorAll('button').forEach((b, j) => b.classList.toggle('active', i === j));
      fitTables(box);
    };
    panes.forEach((p, i) => {
      const b = document.createElement('button');
      b.innerHTML = p.dataset.label + '<span class="n">' + p.dataset.count + '</span>';
      b.onclick = () => show(i);
      bar.appendChild(b);
    });
    box.insertBefore(bar, box.firstChild);
    show(0);
  });

  // Intercept in-page doc links (build.py rewrites local .md links to #doc:<id>).
  docsEl.addEventListener('click', (e) => {
    const a = e.target.closest('a');
    if (!a) return;
    const href  = a.getAttribute('href') || '';
    // 页内锚点（视图目录）：只滚动，不改 hash——改 hash 会让 #env/3d 这类视图深链失效
    if (/^#[\w-]+$/.test(href) && !href.startsWith('#doc:')) {
      const target = a.closest('.doc').querySelector(href);
      if (target) { e.preventDefault(); target.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    }
    const match = href.match(/^#doc:(.+)$/);
    if (match && byId[match[1]]) {
      e.preventDefault();
      // 正文不在本项目里（另一个 html 项目的章）：直接跳过去
      if (byId[match[1]].href) location.href = byId[match[1]].href;
      else activate(match[1]);
    }
    // External links (target=_blank) and plain #anchors fall through to default.
  });

  // Deep-link support: accepts both #<id> and #doc:<id> in the URL hash.
  const [initial, view] = location.hash.slice(1).replace(/^doc:/, '').split('/');
  if (SOLO) {
    // 单章站点的深链只剩视图名：#data。老形式 #web/data 也认。
    const key = view || initial;
    const docEl = document.getElementById('doc-' + SOLO.id);
    if (key && docEl.querySelector('.env-view[data-view="' + key + '"]')) showView(docEl, key, false);
  } else if (initial && byId[initial] && !byId[initial].href) {
    activate(initial);
    if (view) showView(document.getElementById('doc-' + initial), view, true);
  }
</script>

<!-- kc-expand: tag-system iframe 内打开 modal 时，把发消息的那个 iframe 放大到全屏，
     modal 悬浮其上；背后铺一层「模糊 + 变暗」遮罩，真实博客页面透过来（不再是图表
     自己的白底），符合「背景该是什么还是什么，只是模糊一些」。iframe 本身透明，只显示
     居中的 modal。关闭时精确还原，用占位符保持文档流不跳动。 -->
<script>
(function(){
  var expanded = null;      // 当前被放大的 iframe
  var savedCss = '';        // 它放大前的 style
  var placeholder = null;   // 占位符：iframe 变 fixed 后顶住它原来的空间，防止页面回流
  var scrim = null;         // 变暗 + 模糊遮罩层（盖在博客页面上，iframe 之下）
  var revealTimer = null;   // 兜底：子页不回 kc-modal-ready 时也要把 iframe 显影
  var finishTimer = null;   // 兜底：子页不回 kc-revealed 时也要撤遮罩收尾
  function frameOf(win){
    var ifr = document.getElementsByTagName('iframe');
    for (var i = 0; i < ifr.length; i++){
      if (ifr[i].contentWindow === win) return ifr[i];
    }
    return null;
  }
  function expand(win){
    var fr = frameOf(win);
    if (!fr || expanded) return;
    expanded = fr; savedCss = fr.getAttribute('style') || '';
    // 占位符撑住原空间，避免 iframe 脱离文档流导致下方内容上跳
    var r = fr.getBoundingClientRect();
    placeholder = document.createElement('div');
    placeholder.style.cssText = 'height:' + r.height + 'px';
    fr.parentNode.insertBefore(placeholder, fr);
    // scrim：模糊+变暗真实页面
    scrim = document.createElement('div');
    scrim.style.cssText = 'position:fixed;inset:0;z-index:9998;background:rgba(12,15,20,.5);'
                        + '-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);';
    document.body.appendChild(scrim);
    // iframe 透明铺满，但先 opacity:0 藏起来 —— 放大后的这一两帧里，子页面画的
    // 还是「行内尺寸的图表」，不藏就会看到那块背景以全屏尺寸闪一下（flash.png）。
    // 等子页 modal 成形后回 kc-modal-ready，再显影。
    fr.style.cssText = 'position:fixed;inset:0;width:100vw;height:100vh;'
                     + 'z-index:9999;border:0;border-radius:0;background:transparent;opacity:0;';
    document.body.style.overflow = 'hidden';
    // 等两帧确保 iframe 的新尺寸已生效，再通知子页面开 modal（消除小→大跳动）
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      fr.contentWindow.postMessage({type: 'kc-expand-ack', vw: window.innerWidth, vh: window.innerHeight}, '*');
    }); });
    // 兜底：子页面若不回 kc-modal-ready（旧版图表），也不能永远隐身
    revealTimer = setTimeout(reveal, 600);
  }
  // 显影。这里必须再等几帧，不能收到消息就 opacity:1。
  // iframe 是独立进程：子页在自己进程里 double-rAF 只能证明「子页画完了」，不能证明
  // 父页的合成器已经取到那一帧。抢跑的结果是父页把 iframe 显影出来，而合成器手上
  // 还是子页的上一帧 —— 刚按全屏重排、classes 还没生效的标签树，清晰地盖在模糊页面
  // 上。这就是 flash.png。多等 3 帧（~50ms）让新的子页面帧确定被合成，用户感知不到，
  // 但闪烁彻底消失。
  function revealSoon(fn){
    var n = 0;
    (function step(){
      if (++n >= 3) { fn(); return; }
      requestAnimationFrame(step);
    })();
    setTimeout(fn, 150);          // rAF 不跑（后台标签页）时的兜底
  }
  function reveal(){
    clearTimeout(revealTimer); revealTimer = null;
    var fr = expanded;
    if (!fr) return;
    var done = false;
    revealSoon(function(){
      if (done || expanded !== fr) return;
      done = true;
      fr.style.opacity = '1';
    });
  }
  // 关闭分三步，几何还原和子页恢复内容全部发生在 opacity:0 之下：
  //   ① collapse(): 先把 iframe 按成透明，再还原几何，然后请子页恢复图表内容。
  //      这两件事顺序颠倒过来就是上一版残留的 bug —— setAttribute(style, savedCss)
  //      同时还原了「尺寸」和「不透明」，而子页要等 ack 才恢复内容，中间必然有一帧
  //      「行内尺寸的空白矩形」。
  //   ② 子页恢复完内容回 kc-revealed。
  //   ③ finish(): 同一帧里撤遮罩 + 显影。中间态一帧都不上屏。
  function collapse(){
    if (!expanded) return;
    var fr = expanded;
    clearTimeout(revealTimer); revealTimer = null;
    // 隐身 + 还原几何，一次写完：位置、尺寸、边框圆角回到行内，但仍然不可见。
    // 此时用户看到的还是「模糊的页面」（遮罩还在），iframe 里发生什么都不上屏。
    fr.setAttribute('style', savedCss + ';opacity:0');
    // 等两帧确保 iframe 已按行内尺寸重新布局，再让子页把图表放出来 —— 否则子页会
    // 以全屏尺寸画一两帧。子页恢复完会回 kc-revealed，由 finish() 收尾。
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      try { fr.contentWindow.postMessage({type: 'kc-collapse-ack'}, '*'); } catch(_){}
    }); });
    finishTimer = setTimeout(finish, 400);   // 子页不回 kc-revealed 时的兜底
  }
  // 撤遮罩 + 显影，同一帧完成。
  function finish(){
    clearTimeout(finishTimer); finishTimer = null;
    if (!expanded) return;
    var fr = expanded;
    // 同理：子页说「我恢复好了」不等于父页合成器已经拿到那一帧。抢跑会露出
    // 「行内尺寸的空白矩形」。等几帧再撤遮罩+显影。
    revealSoon(function(){
      if (fr !== expanded) return;
      if (placeholder) placeholder.remove();
      if (scrim) scrim.remove();
      fr.setAttribute('style', savedCss);    // 去掉 opacity:0，恢复原样
      expanded = null; savedCss = ''; placeholder = null; scrim = null;
      document.body.style.overflow = '';
    });
  }
  // kc-height: 子页报告自己内容的真实高度，父页把 iframe 高度贴合过去 —— 图表在窄屏
  // 折行后会变高，写死的行内 height 会把它裁掉（变成 iframe 内的竖向滚动条）。
  // 放大态的 iframe 是 fixed inset:0，此时不能动它的高度。
  function fitHeight(win, h){
    var fr = frameOf(win);
    if (!fr || fr === expanded || !(h > 0)) return;
    if (!fr.offsetParent) return;          // 所在小节被收起时 iframe 不可见，报来的高度是 0，不能拿来压扁它
    fr.style.height = Math.ceil(h) + 'px';
  }
  window.addEventListener('message', function(e){
    if (!e.data) return;
    if (e.data.type === 'kc-expand')      expand(e.source);
    if (e.data.type === 'kc-modal-ready') reveal();
    if (e.data.type === 'kc-collapse')    collapse();
    if (e.data.type === 'kc-revealed')    finish();
    if (e.data.type === 'kc-height')      fitHeight(e.source, e.data.h);
  });
})();
</script>

<!-- Gallery lightbox：点卡片全屏运行某个 three.js demo。iframe 点开才建、关闭即销毁，
     所以任何时刻最多一个活跃 WebGL 上下文（浏览器对并发 WebGL 上下文数有上限，若把 11
     个 demo 都常驻会被回收、画面变黑）。galOpen 由卡片的 inline onclick 调用（innerHTML
     注入的节点上，inline handler 照常生效，而 <script> 不会执行，所以逻辑放这里）。 -->
<script>
(function(){
  var ov = null, prevOverflow = '';
  function onKey(e){ if (e.key === 'Escape') window.galClose(); }
  window.galOpen = function(card){
    if (ov) return;                                  // 已有一个在开，忽略
    var src = card.getAttribute('data-src'),
        cn  = card.getAttribute('data-title') || '',
        en  = card.getAttribute('data-en') || '';
    ov = document.createElement('div');
    ov.className = 'gal-lightbox';
    ov.innerHTML =
      '<div class="gal-lb-panel">'
    +   '<div class="gal-lb-bar">'
    +     '<div class="gal-lb-ttl"><b></b><span></span></div>'
    +     '<div class="gal-lb-act">'
    +       '<a class="gal-lb-ext" target="_blank" rel="noopener">在新标签打开 ↗</a>'
    +       '<button class="gal-lb-x" aria-label="关闭">✕</button>'
    +     '</div>'
    +   '</div>'
    +   '<div class="gal-lb-stage"><div class="gal-lb-spin"></div></div>'
    + '</div>';
    // 用 textContent 填标题，避免 demo 名里的字符破坏结构
    ov.querySelector('.gal-lb-ttl b').textContent = cn;
    ov.querySelector('.gal-lb-ttl span').textContent = en;
    var ext = ov.querySelector('.gal-lb-ext'); ext.href = src;
    document.body.appendChild(ov);
    // 懒建 iframe
    var ifr = document.createElement('iframe');
    ifr.className = 'gal-lb-frame';
    ifr.setAttribute('allow', 'autoplay; fullscreen; xr-spatial-tracking');
    ifr.addEventListener('load', function(){ if (ov) ov.classList.add('loaded'); });
    ifr.src = src;
    ov.querySelector('.gal-lb-stage').appendChild(ifr);
    prevOverflow = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    requestAnimationFrame(function(){ if (ov) ov.classList.add('show'); });
    ov.addEventListener('click', function(e){ if (e.target === ov) window.galClose(); });
    ov.querySelector('.gal-lb-x').onclick = window.galClose;
    document.addEventListener('keydown', onKey);
  };
  window.galClose = function(){
    if (!ov) return;
    document.removeEventListener('keydown', onKey);
    var dead = ov; ov = null;
    dead.classList.remove('show');
    document.body.style.overflow = prevOverflow;
    setTimeout(function(){ dead.remove(); }, 200);   // 移除 = 销毁 iframe、释放 WebGL 上下文
  };
})();
</script>

<!-- 图片放大：正文里 <img onclick="zoomImg(this)" data-cap="…" data-href="…"> 点开全屏看大图，
     点空白 / Esc 关闭。inline onclick 在 innerHTML 注入的节点上照常生效，逻辑放这里。 -->
<script>
(function(){
  var ov = null;
  function onKey(e){ if (e.key === 'Escape') close(); }
  function close(){
    if (!ov) return;
    var dead = ov; ov = null;
    document.removeEventListener('keydown', onKey);
    dead.classList.remove('show');
    document.body.style.overflow = '';
    setTimeout(function(){ dead.remove(); }, 180);
  }
  window.zoomImg = function(img){
    if (ov) return;
    ov = document.createElement('div');
    ov.className = 'img-zoom';
    var big = document.createElement('img');
    big.src = img.currentSrc || img.src; big.alt = img.alt || '';
    ov.appendChild(big);
    var capText = img.getAttribute('data-cap'), href = img.getAttribute('data-href');
    if (capText || href){
      var cap = document.createElement('div');
      cap.className = 'iz-cap';
      cap.textContent = capText || '';
      if (href){
        var a = document.createElement('a');
        a.href = href; a.target = '_blank'; a.rel = 'noopener'; a.textContent = '看原帖 ↗';
        cap.appendChild(a);
      }
      ov.appendChild(cap);
    }
    ov.addEventListener('click', function(e){ if (e.target.tagName !== 'A') close(); });
    document.body.appendChild(ov);
    document.body.style.overflow = 'hidden';
    document.addEventListener('keydown', onKey);
    requestAnimationFrame(function(){ if (ov) ov.classList.add('show'); });
  };
})();
</script>

<!-- 划词备注：正文只放结论，长解释挂在备注里。备注存 data/notes.json；
     经 scripts/serve_notes.py 打开时可增删改，其他方式打开只读（用 build 时嵌入的这份）。 -->
<script>
// ---- 数据样例画廊：点方块弹出同 id 的 .sg-body；←/→ 翻同一面墙，Esc 或点背景关 ----
// 弹层就是原位的 .sg-body 本身（加 .open 变成 fixed），不挪节点，所以 .doc 下的样式与划词备注照常生效
(function () {
  let cur = null;
  const mask = document.createElement('div');
  mask.className = 'sg-mask';
  mask.addEventListener('click', close);

  function open(tile) {
    const body = document.getElementById(tile.dataset.sg);
    if (!body) return;
    if (cur) cur.body.classList.remove('open');
    // Example 列的格子挂在表格里，没有 .sg-grid 祖先；退回同一张表，←/→ 就沿着行走
    const scope = tile.closest('.sg-grid') || tile.closest('table') || document;
    const tiles = [...scope.querySelectorAll('.sg-tile')];
    cur = { tile, body, tiles, i: tiles.indexOf(tile) };
    body.parentNode.insertBefore(mask, body);
    body.querySelector('.sg-pos').textContent = (cur.i + 1) + ' / ' + tiles.length;
    body.classList.add('open');
    body.querySelector('.sg-stage').scrollTop = 0;
    document.documentElement.classList.add('sg-lock');
  }
  function close() {
    if (!cur) return;
    cur.body.classList.remove('open');
    mask.remove();
    document.documentElement.classList.remove('sg-lock');
    cur.tile.focus({ preventScroll: true });
    cur = null;
  }
  function step(d) {
    if (cur) open(cur.tiles[(cur.i + d + cur.tiles.length) % cur.tiles.length]);
  }

  document.addEventListener('click', e => {
    const t = e.target.closest('.sg-tile');
    if (t) return open(t);
    if (e.target.closest('.sg-x')) close();
    else if (e.target.closest('.sg-prev')) step(-1);
    else if (e.target.closest('.sg-next')) step(1);
  });
  document.addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('textarea, input')) return;
    if (!cur) {
      if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('sg-tile')) {
        e.preventDefault(); open(e.target);
      }
      return;
    }
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === 'ArrowRight') step(1);
  });
})();
</script>

何合成轮次", "id": "57cf023c", "ts": "2026-10-28 00:43"}, {"doc": "web", "view": "data", "quote": "组合类", "prefix": "SWE-smith：", "suffix": " 97.43%", "body": "**SWE-smith：往能跑的 Python 仓库里人为造 bug，再用仓库自带测试验证，批量生产 SWE 任务。**\n\n- 规模：128 个仓库、100,074 个候选 bug → 50,137 个有效（50.1%）；约 20 人工小时、1,360 美元\n- 有效的标准：注入 bug 后，至少一个原本通过的测试变成失败\n\n**组合类（Combine）：把同一文件或同一模块里几个已经验证有效的 bug 合并成一个更难的 bug。**\n\n1. 留存率高：每个组成部分都已经能让测试失败，合在一起几乎必然也失败。\n   - 按文件合并 97.43%，按模块合并 96.16%\n2. 不产生新信息：只是把已有的 bug 重新打包，因此高留存不等于多产出新题。", "id": "42de91f0", "ts": "2026-10-28 00:43"}, {"doc": "web", "view": "data", "quote": "模型造 bug", "prefix": "96.16% > ", "suffix": " 55.98%", "body": "**SWE-smith 里几种造 bug 方法的区别：**\n\n| 方法 | 做法 | 留存 |\n|---|---|--:|\n| 模型造 bug（LM Modify） | 把一个函数交给模型，让它在原代码上改出一个隐蔽的 bug | 55.98% |\n| 重写函数（LM Rewrite） | 只给模型函数签名和说明，让它从头重写；重写得不完全对，就自然带出 bug | 35.04% |\n| 打乱类内方法（Class Shuffle Funcs） | 程序化地调换类里方法的顺序 | 1.88% |\n\n- 留存率 = 候选 bug 里能让至少一个测试失败的比例\n- 打乱方法顺序几乎不改变程序行为，测试照样通过，因此 98% 的候选不算 bug\n- 其余程序化改法（翻转 if、删赋值、改运算符等）在 22.56%–49.44%", "id": "9a874e5a", "ts": "2026-10-28 00:43"}, {"doc": "web", "view": "data", "quote": "shaders21k", "prefix": "0.25%", "suffix": "\n作品\nShadertoy 公开作品", "body": "**Shader（着色器）不是 HTML，是 GLSL：语法接近 C、在 GPU 上逐像素运行的语言。** 浏览器通过 WebGL 运行它，Shadertoy 就是这样在网页里实时显示效果的。\n\nShadertoy 新建作品时的默认模板：\n\n```glsl\nvoid mainImage(out vec4 fragColor, in vec2 fragCoord) {\n    vec2 uv = fragCoord / iResolution.xy;                     // 像素坐标归一化到 0~1\n    vec3 col = 0.5 + 0.5*cos(iTime + uv.xyx + vec3(0,2,4));  // 颜色随时间 iTime 变化\n    fragColor = vec4(col, 1.0);                               // 输出这个像素的颜色\n}\n```\n\n**为什么出现在 Web 章**：作为社区站漏斗的对照，说明「自包含单文件的社区作品」从名义规模到可用素材、再到可训任务各损失多少。数据本身不是网页。\n\n**shaders21k 怎么做的**（arXiv 2211.16412，NeurIPS 2022；论文与官方仓库源码）\n\n1. 来源：Twitter 上的 TwiGL 短代码 + Shadertoy。\n   - 用 API 还是爬取、许可怎么处理，论文没写\n   - 官方仓库提供整理好的代码包，每个 shader 一个文件，如 `shader_codes/shadertoy/W/Wd2XWy.fragment`\n2. 编译：Shadertoy 代码只写了 `mainImage`，`iTime`、`iResolution`、`iMouse` 由网站提供。\n   - 作者在代码前拼一段固定头部，声明这些变量并补上程序入口，变成完整的 GLSL 程序\n   - 用 ModernGL（Python 的 OpenGL 库）在 GPU 上无窗口编译，报错的丢弃\n3. 渲染：画一个铺满画布的矩形，GPU 对每个像素跑一遍程序，读回存成 384×384 图片。\n   - 每张图随机取一个 `iTime`；`iMouse` 固定为 0；日期写死\n4. 过滤只有两步。\n   - 去重：所有 shader 同一时刻各渲染一张，图完全相同的视为重复\n   - 去静态：同一 shader 不同时刻各渲染一张，画面不变的删掉\n\n**表中这一行的更正**\n\n- 起点 52k 是 Twitter + Shadertoy 两个来源里已经能编译的 shader，不只是「Shadertoy 公开作品」；「可编译」是进入 52k 的条件，不是之后的过滤步骤\n- 终点 21k：约 1,089 个来自 Twitter，约 19,994 个来自 Shadertoy", "id": "9e0f2f1a", "ts": "2026-10-28 00:44"}, {"doc": "web", "view": "data", "quote": "真实网页有四个问题", "prefix": "", "suffix": "：归档渲染不出来", "body": "**一、四项实测**\n\n1. 原始网页归档不能直接渲染。\n   - [Design2Code](https://arxiv.org/abs/2403.03163)：归档缺图片与样式表，只取归档网址重爬\n   - [WebCode2M](https://huggingface.co/datasets/xcodemind/webcode2m)：从公共爬取语料出发，先内联样式再过真实浏览器\n   - WebUI、[ScreenCoder](https://arxiv.org/abs/2507.22827)：直接自爬\n2. 真实页面大多质量低。\n   - WebCode2M：6 名标注员约两周打 10,000 个质量分，80% 落在五分制的 0–1 分\n   - 据此训出的打分器剔掉 52.5% 的原始数据，是全库唯一公开的单步剔除比例\n3. 真实页面过长，不能直接训练。\n   - Design2Code 真实页：31,216 ± 23,903 token、158 个标签、DOM 深度 13\n   - 合成页：647 ± 216 token、19 个标签、深度 5\n   - 唯一经实验验证的可训长度约 5,000 token\n4. 原文文字直接放进提示词会降低效果。\n   - 一个 8B 开源模型拿到全部文字后，HTML 合法率从 98.0% 降到 39.2%\n   - 另一个 8B 模型的文字维度分 80.3 → 55.6 → 22.6；三档输入条件口径待补\n\n**二、DOM 简化路线**\n\n只有可渲染的数据才能同时提供包围盒对齐信号和下游渲染 reward，因此本章取路线 2。\n\n1. 简化成解析目标：学得动，但产物不可渲染，接不上视觉 Verifier。\n2. 保留可渲染页面：本章采用。\n3. 重写而不是清洗：用真实分布换取干净。", "id": "65d71bf3", "ts": "2026-10-28 00:48"}, {"doc": "3d", "view": "data", "quote": "three.js 看 pmndrs/examples 与官方示例", "prefix": "开源维护者手里：", "suffix": "，Blender 看", "body": "**怎么把这些作品挖成可验证的题**\n\n**一、three.js**\n\n1. 发现：官方读 `examples/files.json`；pmndrs 遍历 `examples/*/pmndrs.json`；首页精选解析 threejs.org → 留 GitHub / github.io → 用 API 查许可，只留 MIT / Apache / BSD。\n   - 按创建日期截断（如 2025-01-01 前），或过滤描述里提到模型名的仓库，避免学到别家模型的输出\n2. 拉取：单文件页直接取 raw；工程用 degit，锁定 three 版本（importmap / lockfile）；外部资产逐条对许可。\n3. 运行：无头 Chromium，固定时钟与随机种子，多视角截图；遍历运行时场景图（网格、材质、灯光、动画轨道）生成确定性断言。\n4. 筛选：零 JS 报错、非空帧、两次运行像素一致；按着色器 / GPU 计算 / 物理 / 蒙皮打难点标签，分档出题。\n5. 出题：截图加描述 → 重写；改一个参数或删一段着色器 → 给目标图要求改回；pmndrs 工程按组件拆成补全题。\n\n**二、Blender**\n\n1. 发现：demo 页按区块解析直链与许可；Poly Haven 用公开 API；Blendkit 按 CC0 加质量分排序；BlendSwap 按 CC0 加 Staff Pick。只留 CC0 / CC-BY，SA 单独一桶，NC、ND、未标注一律丢。\n2. 拉取：记下页面上的「Requires Blender X.Y」，按版本分桶（见 Train 4.1）。\n3. 运行：`blender -b --factory-startup`，保持 autoexec 关闭（.blend 可内嵌 Python）；多视角渲染并导出场景图 JSON。\n4. 转成代码：几何节点组经 NodeToPython 转成 bpy；或把 .blend 当起始状态，题目要求写编辑脚本。\n5. 筛选：渲染非空、两次渲染一致、外部贴图不缺；按节点数、是否含仿真区或重复区、修改器栈深度打难度标签。\n\n**三、工具与配套数据**\n\n- [NodeToPython](https://github.com/BrendanParmer/NodeToPython)：节点树 → Python，GPL-3.0（工具许可，不约束输入）\n- [ProcFunc](https://github.com/princeton-vl/procfunc)：Infinigen 团队的函数式程序化生成库，BSD-3\n- [Rapidata text-to-3d-with-llm-code](https://huggingface.co/datasets/Rapidata/text-to-3d-with-llm-code)：44,482 组两两对比、780,424 张人工票，CC-BY-4.0，可用来校准打分模型", "id": "7bded2a4", "ts": "2026-10-28 01:53"}, {"doc": "web", "view": "data", "quote": "Webflow 可克隆站规模最大", "prefix": "高质量网页作品按能拿到什么分档：", "suffix": "，Codrops", "body": "**怎么把这些作品挖成可验证的题**\n\n通用流程：发现 → 抓取 → 渲染 → 过滤 → 切成 Query / Verifier / Harness；渲染走现有 harness（无头浏览器、冻结时钟、三视口、滚动录屏），过滤沿用 4 Curation Pipeline 的闸。\n\n1. Webflow 可克隆站\n   - 发现：两个 showcase sitemap → 95,246 个条目\n   - 抓取：条目页 `__NEXT_DATA__` 取 `cloneable / numLikes / timesCloned / cloneOf`；只留可克隆且不是克隆副本的\n   - 渲染：抓 `<slug>.webflow.io` 全站，资产本地化，滚动录屏\n   - 过滤：按点赞与克隆数筛（抽 300 个：可克隆原创 60%，其中点赞 ≥ 10 的 8%，外推约 4,700 个）；字体、图片换占位\n   - 形态：高赞的多是单个交互效果的演示页，适合出「复刻一个交互效果」的小题，不适合当整站题；要整站去主题目录与开源官网\n2. Codrops MIT 仓库\n   - 发现：GitHub API 列 349 个仓库 → 留 MIT 的 129 个\n   - 抓取：clone；`dist/` 直接渲染，`src/` 当参考答案；教程文章改写成 Query（文章在 tympanus.net，本机 403）\n3. 主题目录\n   - 发现：Astro portal API（带 repoUrl / demoUrl）+ Hugo `themes.txt` + Jamstack 的 front matter\n   - 过滤：GitHub API 取许可与星数，只留 OSI 许可；剔除付费主题（Astro 781 个）；站内链接爬两层得到多页任务\n4. shadcn registry\n   - 发现：`registries.json` 508 家 → 只留 healthy 且 MIT / Apache 的；剔除图标库（item 数的大头）\n   - 渲染：固定的 Next.js + Tailwind v4 外壳，亮暗两套主题各截一次\n5. One Page Love 与 Awwwards\n   - 外链只渲进评测集，不分发；技术标签做难度分层；Dev Award 分项校准审美 reward\n6. 开源的生产级官网\n   - 发现：按公司或工作室枚举 GitHub org，再逐仓读 LICENSE；`\"official website\" in:description` 一类检索量很小\n   - 抓取：`git clone --depth 1 --filter=blob:none` 加 sparse checkout 只取官网子目录（如 supabase 的 `apps/www`）\n   - 过滤：源码公开不等于能用，没有 LICENSE 的一律剔除；路由文件计页面数，多页站切成多页任务\n\n**GitHub 话题当发现入口（名义数 → 星数过滤后）**\n\n| 话题 | 仓库数 | 过滤后 |\n|---|--:|--:|\n| portfolio | 94,894 | ≥ 100★：474 |\n| landing-page | 21,152 | ≥ 100★：138 |\n| webgl | 16,486 | ≥ 100★：798 |\n| gsap | 9,619 | ≥ 100★：95 |\n| creative-coding | 6,587 | ≥ 100★：179 |\n| awwwards | 233 | ≥ 10★：51 |\n\n**审美 reward 的校准数据**\n\n- [vibe-landing-page-arena](https://huggingface.co/datasets/datapointai/vibe-landing-page-arena)：36,000 次两两人工判断、3,492 名标注者、100 个提示，CC BY 4.0\n- [design-creativity-bench](https://huggingface.co/datasets/Kombai/design-creativity-bench)（[2610.11539](https://arxiv.org/abs/2610.11539)）：15 个模型 × 20 个提示，MIT；人类设计的创意跨度 0.902，模型 0.581", "id": "b9ecdeb5", "ts": "2026-10-28 05:22"}, {"doc": "web", "view": "data", "quote": "Codrops 的 MIT 仓库动效最密", "prefix": "规模最大，", "suffix": "，开源官网", "body": "**Codrops MIT 仓库难度画像**（129 个仓库全部浅克隆，只统计手写源码，2026-10-28）\n\n| 信号 | 仓库数 | 占比 |\n|---|--:|--:|\n| GSAP | 117 | 91% |\n| 平滑滚动（Lenis / Locomotive） | 45 | 35% |\n| ≥ 2 个 html 入口 | 45 | 35% |\n| WebGL（three.js / ogl / pixi / 原生 / 着色器任一） | 13 | 10% |\n| 自写着色器 | 7 | 5% |\n\n- 手写代码行数：中位 1,059，P90 3,028\n- 难度主要在动效与交互，不在 3D；要 WebGL 题，去 3D 页 2.4 的 three.js 来源\n- 判定规则与样本口径见 `middle_processing/notes/codrops_profile.md`", "id": "63f1d135", "ts": "2026-10-28 03:56"}, {"doc": "3d", "view": "data", "quote": "都是一个示例配一份可运行代码", "prefix": "three.js 看 pmndrs/examples 与官方示例，", "suffix": "；Blender", "body": "**three.js 两大来源的难度画像**（正则打标，2026-10-28 实测）\n\n| 信号 | three.js 官方 examples（616 页） | pmndrs/examples（211 个） |\n|---|--:|--:|\n| 自写着色器 | 32% | 9% |\n| 后处理 | 15% | 36% |\n| 物理 | 16 页 | 11% |\n| GPU 计算 | 5% | — |\n| 实例化 | — | 14% |\n| 不加载外部资产 / glTF 的纯代码 | 51% | 43% |\n| 源码行数（中位 / P90） | 224 / 383 | 173 / 525 |\n\n- 官方示例着色器占比高，适合出「写着色器」题；pmndrs 偏后处理与组件组合，适合出工程补全题\n- 官方示例里同时含 ≥ 3 类难点的 16 页，可当难题种子\n- 方法：官方示例的数字来自调研笔记 `3d_quality_sources.md`；pmndrs 的见 `pmndrs_profile.md`", "id": "2b969702", "ts": "2026-10-28 04:03"}, {"doc": "3d", "view": "data", "quote": "Blender 现成的代码配对只有 3DCode", "prefix": "一份可运行代码；", "suffix": "，其余多是", "body": "**3DCode 脚本难度画像**（212 个类别里随机抽 60 个，每类 1 个脚本，2026-10-28 实测）\n\n| 信号 | 占比 |\n|---|--:|\n| 着色器节点 | 100% |\n| 修改器 | 88% |\n| bmesh | 68% |\n| 几何节点 | 48% |\n\n- 脚本中位 919 行、P90 1,678 行；每个脚本中位 35 个函数\n- 比 three.js 示例长 4–5 倍（官方中位 224 行、pmndrs 173 行），因此更适合出长上下文的程序化建模题，或拆成按函数补全的小题\n- 方法见 `middle_processing/notes/3dcode_profile.md`", "id": "f89aad39", "ts": "2026-10-28 04:04"}, {"doc": "web", "view": "data", "quote": "最弱一档 Verifier", "prefix": "这类配对只够做", "suffix": "：把生成的代码渲染成截图", "body": "**为什么只够最弱一档，哪些仓库要剔除**\n\n1. Verifier 由强到弱：逐帧像素比对 > 运行时行为契约 > 几何分析 > 渲染截图的模型打分。\n   - 不能逐像素比对：模型生成的代码与原代码不同，渲染结果不会逐像素一致\n   - 不能查运行时行为契约：配对只有静态截图，不含交互后的状态\n2. 基线截图不在仓库内的项目须剔除，否则高估供给。\n   - Mermaid、Ant Design：存于外部云服务\n   - ECharts：仓库内无基线截图", "id": "60b4d47b", "ts": "2026-10-28 13:58"}, {"doc": "web", "view": "data", "quote": "几千个仓库、几万个 PR", "prefix": "、自己写了截图测试的项目，估计有", "suffix": "（口径待补），还没挖", "body": "**VRT 下游仓库的规模估算（尚未挖掘，只给上限）**\n\n1. 这类仓库可能存有基线截图：VRT 工具默认把基线截图与测试代码一同提交进仓库。\n   - 例：Playwright 存于 `*-snapshots/`，jest-image-snapshot 存于 `__image_snapshots__/`\n2. 依赖数只是上限：依赖 VRT 工具不等于写了截图断言（测试中比对基线截图的语句）。\n   - 口径：各工具 npm 包在 GitHub 上的 dependents 数\n   - [Playwright](https://github.com/microsoft/playwright) 458,596 > Storybook 127,816 > jest-image-snapshot 15,400 > Storybook 测试运行器 13,236 > BackstopJS 5,300 > Loki 3,942 > reg-suit 611 > lost-pixel 187\n   - Playwright、Storybook 是通用测试与组件开发工具，截图断言只是其功能之一\n3. 已合并 PR 中的截图断言调用更接近实际用量。\n   - 口径：已合并 PR 的文本检索命中数\n   - `toHaveScreenshot`（Playwright）14,656；`toMatchScreenshot` / `toMatchImageSnapshot`（jest-image-snapshot 等）32,634\n   - 「几千个仓库、几万个 PR」由此推算，推算方法口径待补\n4. Chromatic、Percy 须排除：二者的基线截图存于其云端。\n   - 依赖数：[Chromatic](https://www.chromatic.com/) 57,166、[Percy](https://percy.io/) 6,023", "id": "6418aede", "ts": "2026-10-28 13:58"}, {"doc": "web", "view": "verifier", "quote": "DOM / 样式回读", "prefix": "L1 结构", "suffix": "†", "body": "**DOM 是什么**\n\nDOM（Document Object Model，文档对象模型）：浏览器把 HTML 解析后，在内存里建的一棵元素树；屏幕上的画面就是照着这棵树画出来的。\n\n| | 是什么 | 能回答 |\n|---|---|---|\n| HTML 源码 | 写的文本 | 代码写了什么 |\n| DOM | 运行后的实际结构 | 页面现在有什么、多大、在哪、什么颜色 |\n| 截图 | 画出来的像素 | 看起来像什么 |\n\n1. 每个节点带两类信息。\n   - 属性：标签名、class、id、文字\n   - 计算样式：浏览器算出的最终字号、颜色、位置与大小\n2. DOM 是运行之后的结构，不等于源码。\n   - JS 会动态加元素、改文字，源码里没有的 DOM 里可能有\n   - 点一下按钮 DOM 就跟着变；截图只是某一刻的画面\n3. 验收读 DOM，是因为程序能精确判、可复现。\n   - 标题是不是 32px、按钮是不是蓝色：读计算样式\n   - 按钮压没压图表：比两个元素的位置框是否重叠\n   - 点按钮后有没有换成去年数据：点前、点后各读一次\n4. 无障碍树：从 DOM 精简出的树，只留按钮、链接、标题等有意义的元素与文字，原本给读屏软件用；Playwright MCP 默认读它。\n5. 所有浏览器都有 DOM（W3C / WHATWG 标准），但有几处读不到。\n   - canvas / WebGL 画的内容（three.js 场景、网页游戏）：DOM 里只有一个 `<canvas>`，只能靠截图或读场景图\n   - 浏览器自身界面：地址栏、标签栏不属于网页\n   - 跨域 iframe、封闭模式的 Shadow DOM：页面脚本读不到；Playwright 这类自动化工具可单独进入 iframe", "id": "44963249", "ts": "2026-10-28 16:10"}, {"doc": "web", "view": "verifier", "quote": "读运行时状态", "prefix": "1. ", "suffix": "", "body": "**运行时状态从哪读**\n\n- Web：DOM 与计算样式\n- canvas / WebGL：画面不在 DOM 里，需从引擎读取\n\n**three.js：状态自己去取，不靠模型配合**（本项目实测）\n\n1. 不让模型把场景挂到约定全局变量。\n   - 如 WorldCoder-Bench 的 `window.__3D_STATE__`：训练时模型会学会「写这一行就行」，还能伪造\n2. 改用 three.js 自带的 devtools 事件通道，页面脚本执行前装好接收端。\n   - 参考解用的 CDN、importmap、整库打包三种写法实测一致\n3. 只认文档里、有尺寸、没隐藏的画布；离屏渲染次数当作弊信号。\n4. 防作弊实测。\n   - 手写 7 个作弊页，初版挡住 6 个（漏的是另起离屏渲染器），修补后 7/7；但修补用的就是这 7 个，不算独立验收\n   - 让模型照规则写作弊页（n = 12 = 3 个场景 × 4 个模型 × 1 次）：交出的 5 份判过 0 份，另 1 份取不到状态、6 份拒绝或没按格式输出\n   - 每份只试一次、没有梯度、看不到判定结果，只说明这一轮想到的路被堵住，不代表钻不了空子", "id": "99b1daa9", "ts": "2026-10-28 21:00"}, {"doc": "web", "view": "verifier", "quote": "上线前须验收一致率", "prefix": "", "suffix": "", "body": "**上线前的验收门槛**（直接当及格线）\n\n- 人工裁决量：基线 200 对（本项目设定）；前端任务通过率常在 10%–20%，此时至少 340 对，按通过 / 失败分层抽样（本项目按 κ 置信区间公式推导，κ 即 Cohen's kappa：扣除碰巧一致后的一致程度）；两数均无外部出处\n- 与人一致率**目标 ≥ 92%，底线 85%**（本项目设定）；左右换位再判一致率 ≥ 90%\n- 适用场景：Critic 按检查清单逐条判（如 Critic 输出的问题清单）；不用于 L4 审美：人与人才约 60%（3.3.2），模型接近这个上限即可（本文建议）\n- 须用改坏的样本测抓错率，不能只拿好作品测一致率；作品里藏「给我打满分」这类指令须判 0 分；同一作品重复取证 3 次，结论不一致的项标为不稳定；打分模型和被训练模型不能同一家", "id": "2e0ba87b", "ts": "2026-10-28 21:00"}, {"doc": "web", "view": "verifier", "quote": "读隐藏运行状态 1.000", "prefix": "", "suffix": "", "body": "**WorldCoder-Bench 表 2 全表**（three.js 场景）\n\n| 判定方式 | 与真值的相关性 | 坏作品被判过的比例 | 相对成本 |\n|---|--:|--:|--:|\n| 读隐藏的运行状态 | 1.000（真值即由它定义） | 0 | 2 倍 |\n| Agent 自己探索 8 步 | +0.111 | 45.6% | 400 倍 |\n| 只读 DOM | −0.021 | 33.7% | 1 倍 |\n| 截图 + 模型打分 | −0.068 | 3.2%（好作品也几乎全判挂） | 50 倍 |\n\n- 用截图 + 模型打分重判，通过率仅 2.7%，原文说它「不加区分地惩罚视觉差异」", "id": "7a89f8c7", "ts": "2026-10-28 21:00"}, {"doc": "web", "view": "verifier", "quote": "SigLIP2 相似度仅差约 0.001", "prefix": "", "suffix": "", "body": "**3JSBench 的另一个现象**\n\n- 格式失误伴随低通过率：Gemini 3.8 Flash 300 次里 55 次多包一层 markdown 围栏，剥掉再判，这 55 次仍只 1 次通过", "id": "7f39716e", "ts": "2026-10-28 21:00"}, {"doc": "web", "view": "verifier", "quote": "打分 83.0 → 两两比较 85.5", "prefix": "", "suffix": "", "body": "**UI2Code^N 怎么做比较**（同一 SFT 底座，只换 reward）\n\n- 任务：UI 修补；同一 SFT 底座、只换 reward；比较的收益从 83.0 算起，不从 82.5；读自图 3a，正文无文字、无方差\n- 做法：同一次调用把新作品和上一轮参考一起给模型，用同一把尺子比\n- 计分：赢 1、平 0.5、跑不起来 −1\n- 代价：调用次数是作品数的平方", "id": "05a163cd", "ts": "2026-10-28 21:00"}, {"doc": "web", "view": "verifier", "quote": "10 个模型约等效 3.5 个独立模型", "prefix": "", "suffix": "", "body": "**多找模型投票为什么不划算**\n\n1. RewardBench 1,133 对样本上，不同打分模型犯错相关系数 0.206。\n   - 10 ÷ (1 + 9 × 0.206) ≈ 3.5，是信息量等价，不代表 3.5 个就够\n2. 换种子换不来独立。\n   - 只换训练随机种子的两个模型犯错相关 0.36–0.39；再加一个种子只多顶 0.11 个", "id": "c799d6b3", "ts": "2026-10-28 21:00"}, {"doc": "web", "view": "verifier", "quote": "7 项两次判定不一致", "prefix": "", "suffix": "", "body": "**改判率反推投票能压到多少**（本项目推算，假设各次独立）\n\n- 2q(1 − q) = 21.9%，单次偏离常态的概率 q ≈ 12.5%；五票多数投票可压到约 1.6%\n- 实际打分模型犯错相关 0.206（Error Dependence 那行），所以会更高", "id": "7f741ffa", "ts": "2026-10-28 21:00"}, {"doc": "web", "view": "verifier", "quote": "VLM 截图分可用于整体质量", "prefix": "", "suffix": "", "body": "**反例：有人直接拿 VLM 截图分当 reward，而且有效**\n\n| 工作 | VLM 怎么用 | 结果 | 判的是 |\n|---|---|--:|---|\n| [AesCoder](https://arxiv.org/abs/2510.23272) | 截图分为主、合成 GRPO reward† | InterAes 0.71 → 1.04 | 交互审美‡ |\n| [WebGen-Agent](https://arxiv.org/abs/2509.22644) | 截图分 + GUI agent 分当步级 reward | 38.9% → 45.4% | 整体质量 |\n\n- † GPT-5 截图分权重 0.8，另加执行 0.1、交互 0.1；Qwen3-4B 上的对照是只读代码打分（0.71），1.04 来自「执行 + 截图 + 交互」三项合成 reward，不只是截图分；静态审美分各只涨约 1 分（如 Aes 25.20 → 26.19）。WebGen-Agent 底座 Qwen2.5-Coder-7B\n- ‡ 论文没检测钻空子\n- 同一底座上「VLM 截图分」对「程序检查 + L4」未测", "id": "e45853d8", "ts": "2026-10-28 21:00"}, {"doc": "web", "view": "verifier", "quote": "写法不同但正确的作品判对 0/11", "prefix": "", "suffix": "", "body": "**测试方法**\n\n- 看能否分开改坏与换写法的样本；Web 侧未单独实测，借用 3D 数据\n- 〔Blender〕台灯场景 22 个 = 改坏 11 + 换写法 11（开发 15 + 留出 7）\n- 「九类」= Blender 场景状态的九类字段：层级、变换、网格、修改器、材质、灯光相机、动画、物理、渲染设置；定义见 3D 页 3.3.1，细节见 3D 页 3.3.2\n\n**两头的完整数字**\n\n- 程序检查全开：九类全查抓错 11/11、放对 0/11\n- 只查题目明确要求的属性（白名单组合）：抓错 11/11、放对 10/11", "id": "fb89ee66", "ts": "2026-10-28 21:00"}, {"doc": "web", "view": "verifier", "quote": "11 个真错误只抓到 3–6 个", "prefix": "模型打分时 ", "suffix": "", "body": "**模型打分的口径与判错规律**\n\n- n = 176 = 22 样本 × 4 模型 × 2 视角（单张 / 多角度）× 1 次，温度 0\n- 多角度反而更易输出格式出错\n- 判错有规律：模型分不清「画面变了」和「东西变了」（推断）。题目明说「相机位置变了不算错」，换写法的「相机移动」样本在八种条件（4 模型 × 2 视角）里仍被判错四次\n- 四个不同厂家的模型一致：换写法放对 10/11–11/11\n- 多角度拼图无益：四个模型单张 → 多角度总判对 16→16、13→14、14→15、14→14\n- 模型没有独家抓到的错：这 22 个样本里，模型抓到的程序检查全抓到了\n\n**模型与程序检查对照**（本项目实测；「—」= 原始实验记录里没有，Web 侧没测过模型）\n\n| 样本集 | 域 | n | 模型抓错 | 模型放对 | 程序抓错 | 程序放对 | 出处 |\n|---|:-:|--:|--:|--:|--:|--:|---|\n| 台灯 22 | Blender | 176 | 3–6/11 | 10–11/11 | 11/11 | 10/11 | 本节 |\n| 47，有参考图 | three.js | 107 / 108† | 58/63–61/64 | 43/44–44/44 | — | — | 3.2.2 第 8 项 |\n| 47，无参考图 | three.js | 96 / 96 | 34/56–35/56 | 30/40–39/40 | — | — | 3.2.2 第 8 项 |\n| 三场景 47 | three.js | 47 | — | — | 27/27‡ | 20/20‡ | 3D 页 3.3.1 |\n| 参考页 22 | Web | 22 | — | — | 11/11 | 11/11 | 3.2.2 第 4 项 |\n\n† 单张 / 多角度；超过 47 × 2，来源未核实\n‡ 改坏 7 + 9 + 11、换写法 6 + 7 + 7（三个场景的原始记录）；其中 29 个参与过调阈值，与 3.2.2 第 8 项的 48 个样本共有 27 个，不是同一批\n\n与 3.2.2 第 8 项「判对 74–92」不矛盾：three.js 的错误多半看得见；Blender 的 11 个里 5 个（4 个静帧看不见的属性、1 个尺寸偏差）8 种条件下全漏。", "id": "af346bd4", "ts": "2026-10-28 21:00"}, {"doc": "web", "view": "verifier", "quote": "改成按结构定位", "prefix": "", "suffix": "", "body": "**Web 那次误判的完整经过**\n\n- 唯一误判的是一个换写法样本（类名全换哈希名），挂在两处\n  - verifier 量列数时绑了类名，改成按结构定位（修 1 处实现）\n  - 生成样本的重命名脚本把 ARIA 角色也改了、样本真坏了，改脚本后重新生成（修 1 个样本）\n- 构成仍是改坏 11 + 换写法 11\n\n**另两条**\n\n- 〔图表〕三个缺陷都是坐标系和帧的问题导致把对判成错，调阈值修不了\n- 〔Web〕「类名序列一致」是朴素做法，不属 L0–L4：抓错 0/11，还把换写法的 3/11 判错", "id": "2d98afd9", "ts": "2026-10-28 21:00"}, {"doc": "web", "view": "verifier", "quote": "组合后 22 个样本全部判对", "prefix": "", "suffix": "", "id": "3e60bc09", "ts": "2026-10-29 02:20", "body": "**多层组合的实测**\n\n| 域 | 样本 | 结果 |\n   |:-:|---|---|\n   | 〔Web〕 | 单个参考页，n = 22† | 单项抓错最多 4/11；五项检查组合判对 22/22‡ |\n   | 〔three.js〕 | 逐层数字见 3D 页 3.3.1 | 单层各有漏网，四层组合才全中，留出集也全中 |\n   | 〔图表〕 | n 见 3.1 依据 L1 | 判对 16/16 |\n\n† 改坏 11 + 换写法 11，含 6 个留出；× 1 程序 × 1 次\n‡ 五项是 W0 正确性、W1 布局、W2 可访问性、W3 交互、W4 性能预算，都读运行后的状态，分属 L0–L3（W0 ⊂ L0/L1、W1 ⊂ L2、W3 ⊂ L3）；组合抓错 11/11、放对 11/11"}, {"doc": "web", "view": "verifier", "quote": "截图相似度仍 0.999", "prefix": "", "suffix": "", "id": "423522e6", "ts": "2026-10-29 02:20", "body": "**画面变化大小和错误大小对不上**（本项目实测）\n\n| 域 | 换写法 | 改坏 | 指标 |\n|:-:|---|---|---|\n| 〔three.js〕 | — | 雪人胡萝卜鼻子挪到后脑勺，仍 0.999 | 单张截图相似度（越接近 1 越像） |\n| 〔Blender〕 | 相机移动 0.9534 | 木色变蓝反而 0.9844 | 同上 |\n| 〔图表〕 | 换配色差 30.51% | 改一个数据点只差 0.75% | 差异像素占比 |\n\n- 〔three.js〕29 个带标签样本 × 1 次，像素比对只判对 12 个\n- 〔Blender〕杯子平移 30 厘米：全局 Chamfer 距离（两组点云间的平均最近距离）只变 0.00018，逐部件算变 0.08375，差 460 倍；所以要先认出元素再逐个比，即回到 L1–L2\n\n- 〔three.js〕29 个带标签样本 × 1 次，像素比对只判对 12 个\n- 〔Blender〕杯子平移 30 厘米：全局 Chamfer 距离（两组点云间的平均最近距离）只变 0.00018，逐部件算变 0.08375，差 460 倍；所以要先认出元素再逐个比，即回到 L1–L2"}, {"doc": "web", "view": "verifier", "quote": "单个模型判对 74–92 次", "prefix": "", "suffix": "", "body": "**实验口径**（本项目实测，three.js，Web 侧未测）\n\n- 48 个带标签样本 × 4 模型 × 2 视角 × 2 次，温度 0，参考图与作品并排\n- † 48 = 雪人候选 5 + 雪人改动 13 + 桌子改动 14 + 工作台生成 16（原始实验记录去重）；n = 768；视角 = 单张 / 多角度；「判对 x/96」= 一个模型一种视角的总判对（改坏 + 换写法），分母 48 样本 × 2 次\n- 分母 84–96：不足 96 是没解析出结论\n- 像素比对：n = 29 个样本 × 1 次", "id": "5576196c", "ts": "2026-11-02 00:40"}, {"doc": "web", "view": "verifier", "quote": "主要掉在抓错", "prefix": "", "suffix": "", "body": "**去掉参考图那组的口径**\n\n- 另一组：47 个样本 × 2 个模型 × 2 视角 × 1 次\n- 单张抓错 58/63 → 35/56\n- 无参考图每种视角分母 96（含 2 条重跑）；有参考图分母 107、108 超过 47 × 2，来源未核实（每格分母 40–64）", "id": "132f2676", "ts": "2026-11-02 00:40"}, {"doc": "web", "view": "verifier", "quote": "逐模型均不显著", "prefix": "", "suffix": "", "body": "**多角度 vs 单张**\n\n- 强模型上数字更高，但逐模型都不显著，只能说「未见差异」\n- 同图判两次结论变了的比例：16.7% → 4.2%、8.3% → 0（分母 48）", "id": "5d86cc6d", "ts": "2026-11-02 00:40"}, {"doc": "web", "view": "verifier", "quote": "模型评审会漏判题目要求的属性", "prefix": "", "suffix": "", "body": "**适用边界**\n\n- 以上全是静帧属性和尺寸类错误，动态 / 交互类错误的抓错率未测\n- 本项与第 8 项（判对 74–92）不冲突：three.js 的错误多半看得见；Blender 的 11 个里 5 个是静帧看不见的属性或尺寸偏差\n- 外部直接拿 VLM 当 reward 的反例见 3.2.1 规则 1\n- 雪人封口那条的经过见 3D 页 3.2", "id": "9a81bff6", "ts": "2026-11-02 00:40"}, {"doc": "web", "view": "verifier", "quote": "Prepare artifacts（准备产物）", "prefix": "", "suffix": "", "body": "**第二栏 Prepare artifacts：评测方统一复现、统一取证**\n\nagent 自己交的截图不用来判分：截图条件各不相同，还可能被挑选。评测方从代码重新跑一遍，所有作品的证据出自同一套环境。\n\n1. Unpack & build / serve：先把项目跑起来\n   - 拷贝交付的项目目录 → 构建 → 启动；入口打不开直接 0 分（L0 硬闸）\n   - 外链资源换成本地：评测环境断网；外链超时测到的是网络而不是设计，图床链接还会失效\n2. Independent browser render：用评测方自己的无头浏览器统一渲染\n   - 固定浏览器版本与字体；冻结时钟与随机数，同一份代码每次渲染结果一致\n   - 1440 / 768 / 375 三档宽度（电脑 / 平板 / 手机），各截首屏和整页；导出 DOM 与计算样式；点击后回读状态，录下前后画面\n3. Non-blank · no errors：画面非空白、控制台无报错，才进入评审\n   - 控制台报错在截图时顺带收集，是最便宜的 L0 信号\n\n**为什么不在 agent 干活的现场直接评**\n\n1. 现场是脏的：全局装过的包、没关的开发服务器、项目目录外的文件都不在交付物里，离开现场可能打不开\n2. 现场是 agent 能改的地方：可以留一个应付检查的假页面服务，或改掉评测会读的文件；干净副本相当于一条信任边界\n3. 同组作品要在同一把尺子下比：截图时机、窗口宽度、字体是否加载完、时间与随机数不同，差异就来自截图条件而不是作品\n   - 例：A 在柱子入场动画播到一半时截图，B 在播完后截，两个页面完全一样，L4 两两比较时 B 却会胜出\n   - 同一个镜像只统一软件；宽度、等待时长、截图时机与范围、时间与随机数，只能由评测方的取证脚本统一\n\n**agent 只能保证在现场跑通，怎么办**\n\n- 不要求 agent 额外保证，而是把环境设计成现场与干净副本没有区别：\n  - 同一个镜像（浏览器、字体、依赖一致）\n  - 只有项目目录可写，依赖装进项目而不是全局\n  - 沙箱本身断网\n  - 题目写明评测会用的构建与启动命令，允许 agent 交付前自己跑同一条验收命令\n- 满足后，拷贝到干净容器几乎不会失败；真失败了，说明作品依赖现场残留，本身就是缺陷\n- 折中做法：评测 agent 现场的只读快照，重启进程、用评测方自己的浏览器取证；对 agent 更公平，但现场残留和可能的手脚也一起带了进来", "id": "6b3e9114", "ts": "2026-11-02 13:20"}, {"doc": "web", "view": "verifier", "quote": "检查清单按题生成、按题冻结", "prefix": "", "suffix": "", "body": "**检查清单：评审时由 Critic 生成，按题冻结**（本文建议，未实测）\n\n**一、怎么生成**\n\n1. 第一次评这道题时，Critic 读题目和参考文件，把需求拆成清单，之后同组所有作品、所有重跑都复用这一份\n2. 只从题目和参考文件拆，不读作品的实现说明；每一条都必须对应题目里的一句话，对不上的删掉\n3. 有参考解的题，先用参考解跑一遍：参考解必须全部通过，不通过的条目说明拆错了，修掉或删掉\n4. 每一条标明交给谁判：程序断言（选择器 + 属性 + 期望值）、Agent 指令，或 VLM 问题\n\n**二、为什么不给每份作品各生成一次**\n\n| 问题 | 原因 |\n|---|---|\n| 同组作品用的不是同一把尺子 | 给 A、B、C 各拆一次，三份清单可能不同，L4 两两比较失去前提 |\n| 作品能影响查什么 | 清单若参考作品的实现说明，作品说做了什么就查什么，没说的就漏掉 |\n| 判两次结论可能不同 | 每次重新生成清单，等于每次换一份考卷 |\n\n- 每份作品各生成一次，只用在交付前自查、人工复核这类不算 reward 的场景\n\n**三、清单和产物的关系**\n\n- 查什么（条目和期望值）只看题目；在作品里定位对应元素、判过还是不过，针对每份作品单独做\n- 定位按结构、角色或文字找，不写死类名：本项目的 verifier 曾因绑死类名，把一个只改了类名的正确作品判错（3.2.2 第 3 项）\n- 作品的实现说明不决定查什么，但可以用来查「声称做了但没做」，作为钻空子信号\n\n**四、规模化时的顺序**\n\n- 先定这道题要检查哪些项，再生成一段把这些项都写明白的需求文字，「清单每一项都在题目里说出来」就天然成立", "id": "37f7fa30", "ts": "2026-11-02 14:40"}, {"doc": "web", "view": "verifier", "quote": "比较比打分准", "prefix": "", "suffix": "：普通打分", "body": "**三种打分方式**（UI2Code^N 的 reward 对照，同一 SFT 底座 82.5，只换 reward）\n\n- 普通打分（vanilla verifier）：VLM 单独看一份作品，给一个绝对分；各打各的，分数之间没有共同刻度 → 83.0\n- 两两比较（comparator）：同一次调用里把新作品和上一轮参考一起给 VLM，判哪个更好；两份作品用同一把尺子 → 85.5\n- 循环赛（round-robin）：组内每两份作品都比一次，reward = 胜场数（赢 1、平 0.5、跑不起来 −1）；调用次数是作品数的平方 → 86.0", "id": "53ce6bb3", "ts": "2026-11-03 00:30"}, {"doc": "web", "view": "opendata", "quote": "html 与 webdev", "prefix": "按产物技术栈分四类，不按输入模态分：", "suffix": " 是主力，ppt 与 manim 够用即可。", "body": "**html 与 webdev 的分界不在有没有端口，而在对错能不能从一次渲染里看出来：html 截一张图就能判，webdev 必须起服务、操作一遍才能判。**\n\n| | html | webdev |\n|---|---|---|\n| 模型交付什么 | 一个文件，内容写死 | 前端页面、后端接口、数据存储整套工程 |\n| 怎么打开 | 浏览器直接打开 | 先起服务，前端才拿得到数据 |\n| 怎么验收 | 渲染一次，比截图、逐值回读 | agent 按顺序操作，每一步检查状态 |\n| 只看截图能否判对错 | 能 | 不能 |\n\n1. 各做一个最小例子，验收步骤的差别最直观。\n   - html：一页内联 SVG 条形图。渲染一次、截一张图、从 DOM 读回 8 根柱子的数值与宽度，9 项检查一次跑完\n   - webdev：两页任务板加一个存数据的后端。验收先起服务，再按顺序走 7 步：添加 3 条 → 空标题被拒 → 勾选 → 切到统计页查 3 / 1 / 33% → 刷新查勾选仍在 → 删一条 → 重启服务查数据仍在\n2. webdev 的 bug 藏在状态里，截图看不出。\n   - 后端不落盘时，任务页截图与正常版本完全一样；只有重启服务后数据消失，第 7 步才失败\n3. 端口不是判据。\n   - html 也可以挂在静态服务上访问，但那个服务不是模型写的，只负责发文件\n   - 单个 React 组件归 html；要先构建再起服务的多文件 React 工程，验收同样依赖运行结果，归 webdev", "id": "ef902e4d", "ts": "2026-11-04 01:07"}, {"doc": "3d-v2", "view": "data", "quote": "three.js 看 pmndrs/examples 与官方示例", "prefix": "按能拿到什么分档：", "suffix": "，都是一个示例", "body": "**怎么把这些作品挖成可验证的题**\n\n**一、three.js**\n\n1. 发现：官方读 `examples/files.json`；pmndrs 遍历 `examples/*/pmndrs.json`；首页精选解析 threejs.org → 留 GitHub / github.io → 用 API 查许可，只留 MIT / Apache / BSD。\n   - 按创建日期截断（如 2025-01-01 前），或过滤描述里提到模型名的仓库，避免学到别家模型的输出\n2. 拉取：单文件页直接取 raw；工程用 degit，锁定 three 版本（importmap / lockfile）；外部资产逐条对许可。\n3. 运行：无头 Chromium，固定时钟与随机种子，多视角截图；遍历运行时场景图（网格、材质、灯光、动画轨道）生成确定性断言。\n4. 筛选：零 JS 报错、非空帧、两次运行像素一致；按着色器 / GPU 计算 / 物理 / 蒙皮打难点标签，分档出题。\n5. 出题：截图加描述 → 重写；改一个参数或删一段着色器 → 给目标图要求改回；pmndrs 工程按组件拆成补全题。\n\n**二、Blender**\n\n1. 发现：demo 页按区块解析直链与许可；Poly Haven 用公开 API；Blendkit 按 CC0 加质量分排序；BlendSwap 按 CC0 加 Staff Pick。只留 CC0 / CC-BY，SA 单独一桶，NC、ND、未标注一律丢。\n2. 拉取：记下页面上的「Requires Blender X.Y」，按版本分桶（见 Train 4.1）。\n3. 运行：`blender -b --factory-startup`，保持 autoexec 关闭（.blend 可内嵌 Python）；多视角渲染并导出场景图 JSON。\n4. 转成代码：几何节点组经 NodeToPython 转成 bpy；或把 .blend 当起始状态，题目要求写编辑脚本。\n5. 筛选：渲染非空、两次渲染一致、外部贴图不缺；按节点数、是否含仿真区或重复区、修改器栈深度打难度标签。\n\n**三、工具与配套数据**\n\n- [NodeToPython](https://github.com/BrendanParmer/NodeToPython)：节点树 → Python，GPL-3.0（工具许可，不约束输入）\n- [ProcFunc](https://github.com/princeton-vl/procfunc)：Infinigen 团队的函数式程序化生成库，BSD-3\n- [Rapidata text-to-3d-with-llm-code](https://huggingface.co/datasets/Rapidata/text-to-3d-with-llm-code)：44,482 组两两对比、780,424 张人工票，CC-BY-4.0，可用来校准打分模型", "id": "ed2d208c", "ts": "2026-10-28 01:53"}, {"doc": "3d-v2", "view": "data", "quote": "都是一个示例配一份可运行代码", "prefix": "pmndrs/examples 与官方示例，", "suffix": "；Blender", "body": "**three.js 两大来源的难度画像**（正则打标，2026-10-28 实测）\n\n| 信号 | three.js 官方 examples（616 页） | pmndrs/examples（211 个） |\n|---|--:|--:|\n| 自写着色器 | 32% | 9% |\n| 后处理 | 15% | 36% |\n| 物理 | 16 页 | 11% |\n| GPU 计算 | 5% | — |\n| 实例化 | — | 14% |\n| 不加载外部资产 / glTF 的纯代码 | 51% | 43% |\n| 源码行数（中位 / P90） | 224 / 383 | 173 / 525 |\n\n- 官方示例着色器占比高，适合出「写着色器」题；pmndrs 偏后处理与组件组合，适合出工程补全题\n- 官方示例里同时含 ≥ 3 类难点的 16 页，可当难题种子\n- 方法：官方示例的数字来自调研笔记 `3d_quality_sources.md`；pmndrs 的见 `pmndrs_profile.md`", "id": "fb666357", "ts": "2026-10-28 04:03"}, {"doc": "3d-v2", "view": "data", "quote": "Blender 现成的代码配对只有 3DCode", "prefix": "一份可运行代码；", "suffix": "，其余多是", "body": "**3DCode 脚本难度画像**（212 个类别里随机抽 60 个，每类 1 个脚本，2026-10-28 实测）\n\n| 信号 | 占比 |\n|---|--:|\n| 着色器节点 | 100% |\n| 修改器 | 88% |\n| bmesh | 68% |\n| 几何节点 | 48% |\n\n- 脚本中位 919 行、P90 1,678 行；每个脚本中位 35 个函数\n- 比 three.js 示例长 4–5 倍（官方中位 224 行、pmndrs 173 行），因此更适合出长上下文的程序化建模题，或拆成按函数补全的小题\n- 方法见 `middle_processing/notes/3dcode_profile.md`", "id": "e6ae2f9c", "ts": "2026-10-28 04:04"}];</script>
<script>
(function () {
  const API = new URL('../api/notes', location.href).href;
  const BLOCK = 'p,li,h2,h3,h4,blockquote,pre,details,.ds-demo,.tl-wrap,.gp-wrap';
  let notes = window.NOTES_EMBED || [], writable = false, pending = null;

  const docKey = el => (el.closest('.doc').id || '').replace(/^doc-/, '');
  const clip = s => s.length > 40 ? s.slice(0, 40) + '…' : s;
  const md = s => window.marked ? marked.parse(s) : s.replace(/[&<]/g, c => c === '&' ? '&amp;' : '&lt;');

  function rootOf(n) {
    const d = document.getElementById('doc-' + n.doc);
    return d && (n.view ? d.querySelector('.env-view[data-view="' + n.view + '"]') : d);
  }

  // 根节点下的正文文本节点拼成一个长串，记下每个节点在串里的起点
  function index(root) {
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: t =>
      t.parentElement.closest('.nt-card,script,style,.katex-mathml') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
    const nodes = []; let text = '', t;
    while ((t = w.nextNode())) { nodes.push([t, text.length]); text += t.nodeValue; }
    return { nodes, text };
  }

  // quote 可能出现多次，用前后文挑最像的那一处
  function locate(n, text) {
    let best = -1, at = -1;
    for (let i = text.indexOf(n.quote); i >= 0; i = text.indexOf(n.quote, i + 1)) {
      const s = (n.prefix && text.slice(0, i).endsWith(n.prefix) ? 2 : 0) +
                (n.suffix && text.slice(i + n.quote.length).startsWith(n.suffix) ? 1 : 0);
      if (s > best) { best = s; at = i; }
    }
    return at;
  }

  function wrap(n, ix, at) {
    const end = at + n.quote.length; let last = null;
    for (const [node, start] of ix.nodes) {
      const s = Math.max(at, start), e = Math.min(end, start + node.nodeValue.length);
      if (s >= e || /^(UL|OL|TABLE|TBODY|THEAD|TR)$/.test(node.parentNode.nodeName)) continue;
      let t = node;
      if (s > start) t = t.splitText(s - start);
      if (e - s < t.nodeValue.length) t.splitText(e - s);
      const m = document.createElement('mark');
      m.className = 'nt-mark'; m.dataset.nid = n.id;
      t.parentNode.insertBefore(m, t); m.appendChild(t); last = m;
    }
    if (last) last.classList.add('nt-end');
    return !!last;
  }

  function clear() {
    document.querySelectorAll('.nt-card').forEach(c => c.remove());
    document.querySelectorAll('mark.nt-mark').forEach(m => {
      const p = m.parentNode; while (m.firstChild) p.insertBefore(m.firstChild, m); m.remove(); p.normalize();
    });
  }

  let orphans = 0;
  function render() {
    clear(); orphans = 0;
    for (const n of notes) {
      const root = rootOf(n); if (!root) continue;
      const ix = index(root), at = locate(n, ix.text);
      if (at < 0 || !wrap(n, ix, at)) orphans++;
    }
    fab();
  }

  // 卡片挂在高亮所在的块后面；表格里的高亮挂在整张表后面，列表项里的挂在该项末尾
  function place(card, el) {
    const cell = el.closest('td,th');
    const b = cell ? (cell.closest('.tbl-scroll') || cell.closest('table')) : el.closest(BLOCK);
    if (!b) return el.after(card);
    if (b.tagName === 'LI') b.appendChild(card); else b.after(card);
  }

  function marksOf(id) { return document.querySelectorAll('mark.nt-mark[data-nid="' + id + '"]'); }

  function toggle(id) {
    const open = document.querySelector('.nt-card[data-nid="' + id + '"]');
    const ms = marksOf(id);
    if (open) { open.remove(); ms.forEach(m => m.classList.remove('on')); return; }
    const n = notes.find(x => x.id === id); if (!n || !ms.length) return;
    place(card(n, false), ms[ms.length - 1]); ms.forEach(m => m.classList.add('on'));
  }

  function card(n, editing) {
    const c = document.createElement('div');
    c.className = 'nt-card'; c.dataset.nid = n.id || 'new';
    c.innerHTML = '<div class="nt-head"><span class="nt-q"></span><span class="nt-act"></span></div><div class="nt-main"></div>';
    c.querySelector('.nt-q').textContent = '“' + clip(n.quote) + '”';
    const act = c.querySelector('.nt-act'), main = c.querySelector('.nt-main');
    const btn = (label, fn) => { const b = document.createElement('button'); b.textContent = label; b.onclick = fn; act.appendChild(b); };
    if (editing) {
      main.innerHTML = '<textarea placeholder="支持 Markdown"></textarea>';
      const ta = main.querySelector('textarea'); ta.value = n.body || '';
      btn('保存', () => save(n, ta.value, c));
      btn('取消', () => { c.remove(); if (n.id) toggle(n.id); });
      setTimeout(() => ta.focus(), 0);
    } else {
      main.innerHTML = '<div class="nt-body"></div><div class="nt-ts"></div>';
      main.querySelector('.nt-body').innerHTML = md(n.body || '');
      main.querySelector('.nt-ts').textContent = n.ts || '';
      if (writable) {
        btn('编辑', () => { c.replaceWith(card(n, true)); });
        btn('删除', () => { if (confirm('删除这条备注？')) post('delete', { id: n.id }); });
      }
      btn('收起', () => toggle(n.id));
    }
    return c;
  }

  async function post(op, note) {
    try {
      const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ op, note }) });
      if (!r.ok) throw new Error(r.status);
      notes = (await r.json()).notes; render(); return true;
    } catch (e) { alert('备注保存失败：' + e.message); return false; }
  }

  async function save(n, body, c) {
    const op = n.id ? 'update' : 'add';
    if (await post(op, { ...n, body })) {
      const id = n.id || notes[notes.length - 1].id;
      toggle(id);
    }
  }

  // ---- 划词 → 「＋ 备注」 --------------------------------------------------
  const add = document.createElement('button');
  add.className = 'nt-add'; add.textContent = '＋ 备注'; add.hidden = true;
  document.body.appendChild(add);
  add.addEventListener('mousedown', e => e.preventDefault());
  add.addEventListener('click', () => {
    add.hidden = true; if (!pending) return;
    place(card(pending.note, true), pending.el);
    window.getSelection().removeAllRanges();
  });

  document.addEventListener('mouseup', e => {
    if (e.target === add || e.target.closest('.nt-card')) return;
    setTimeout(() => {
      const sel = window.getSelection();
      add.hidden = true; pending = null;
      if (!writable || sel.isCollapsed || !sel.rangeCount) return;
      const r = sel.getRangeAt(0), el = r.startContainer.nodeType === 1 ? r.startContainer : r.startContainer.parentElement;
      if (!el.closest('.doc') || el.closest('.nt-card')) return;
      const view = el.closest('.env-view'), root = view || el.closest('.doc');
      const ix = index(root); let s = -1, t = -1;
      for (const [node, start] of ix.nodes) {
        if (!r.intersectsNode(node)) continue;
        if (s < 0) s = start + (node === r.startContainer ? r.startOffset : 0);
        t = start + (node === r.endContainer ? r.endOffset : node.nodeValue.length);
      }
      while (s < t && /\s/.test(ix.text[s])) s++;
      while (t > s && /\s/.test(ix.text[t - 1])) t--;
      if (s < 0 || t - s < 2) return;
      pending = { el, note: { doc: docKey(el), view: view ? view.dataset.view : '', quote: ix.text.slice(s, t),
                              prefix: ix.text.slice(Math.max(0, s - 24), s), suffix: ix.text.slice(t, t + 24) } };
      const rect = r.getBoundingClientRect();
      add.style.left = (rect.right + window.scrollX - 60) + 'px';
      add.style.top = (rect.bottom + window.scrollY + 6) + 'px';
      add.hidden = false;
    }, 0);
  });

  document.addEventListener('click', e => {
    const m = e.target.closest('mark.nt-mark');
    if (m && window.getSelection().isCollapsed) toggle(m.dataset.nid);
  });

  // ---- 右下角：条数 + 全部展开 / 收起 --------------------------------------
  const fabEl = document.createElement('button');
  fabEl.className = 'nt-fab'; document.body.appendChild(fabEl);
  function fab() {
    const here = notes.filter(n => document.getElementById('doc-' + n.doc)).length;
    fabEl.hidden = !here && !writable;
    fabEl.textContent = '备注 ' + here + (orphans ? '（' + orphans + ' 条未定位）' : '') + (writable ? '' : ' · 只读');
  }
  fabEl.onclick = () => {
    const ids = [...new Set([...document.querySelectorAll('mark.nt-mark')].filter(m => m.offsetParent).map(m => m.dataset.nid))];
    const anyClosed = ids.some(id => !document.querySelector('.nt-card[data-nid="' + id + '"]'));
    ids.forEach(id => { const open = !!document.querySelector('.nt-card[data-nid="' + id + '"]'); if (open !== anyClosed) toggle(id); });
  };

  render();
  fetch(API, { cache: 'no-store' }).then(r => r.ok ? r.json() : Promise.reject())
    .then(d => { notes = d.notes; writable = true; render(); }).catch(() => {});
})();
</script>
</body>
</html>
