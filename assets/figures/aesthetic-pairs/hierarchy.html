<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A1 视觉层级</title>
<style>
  :root{--ink:#111418;--soft:#5b636e;--line:#e4e7ec;--band:#f6f7f9;--ok:#0b7a4b;--ok-bg:#e6f5ed;--bad:#b42318;--bad-bg:#fdecea;
        --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace}
  *{box-sizing:border-box}
  html,body{margin:0;background:transparent;color:var(--ink);
            font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .top{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--band);border-bottom:1px solid var(--line)}
  .tag{font:600 10.5px/1 var(--mono);letter-spacing:.08em;color:var(--soft);text-transform:uppercase}
  .query{flex:1;min-width:0;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rule{font-size:12px;color:var(--soft);white-space:nowrap}
  button{font:inherit;font-size:12px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 11px;cursor:pointer}
  button:hover{border-color:#c5cad3}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:14px}
  .head{display:flex;align-items:center;gap:8px;margin-bottom:8px;min-height:24px}
  .side{font:700 12px/1 var(--mono);width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:var(--ink);color:#fff;flex:none}
  .pill{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;flex:none}
  .ok .pill{color:var(--ok);background:var(--ok-bg)} .bad .pill{color:var(--bad);background:var(--bad-bg)}
  .say{flex:1;min-width:0;color:var(--soft);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .open{border:0;background:none;color:#2f6bff;padding:0 2px}
  .stage{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:#eef0f3}
  .stage iframe{position:absolute;top:0;left:0;width:1280px;height:800px;border:0;transform-origin:0 0;background:#fff}
  @media (max-width:720px){.grid{grid-template-columns:1fr}.say,.query{white-space:normal}.rule{display:none}}
  /* 放大态：父页把本 iframe 铺满视口，这里画成居中的大卡片，点卡片外收起 */
  body.full{height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}
  body.full .card{width:min(100%,2400px);box-shadow:0 24px 80px rgba(0,0,0,.35)}
  /* 放大态只放一张、尽量大，A / B 原地切换（空格或方向键），差别最容易看出来 */
  .flip{display:none;gap:2px;background:#e9ecf1;border-radius:999px;padding:3px}
  .flip button{border:0;background:none;padding:4px 12px}
  .flip button.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.12)}
  body.full .flip{display:inline-flex}
  body.full .grid{grid-template-columns:1fr}
  body.full .grid > div{display:none}
  body.full .grid > div.sel{display:block}
</style>
</head>
<body>
<div class="card">
  <div class="top"><span class="tag">Query</span><span class="query">为独立咖啡烘焙店 Ember &amp; Oak 做一个品牌首页</span><span class="rule">A1 · 视觉层级</span><span class="flip" title="空格或方向键切换"><button class="on">A 符合</button><button>B 违反</button></span><button id="zoom">放大对比</button></div>
  <div class="grid">
    <div class="ok sel"><div class="head"><span class="side">A</span><span class="pill">符合</span><span class="say">标题最大最亮，导语降灰，只有一个实心按钮</span><button class="open" data-v="good">新标签打开</button></div><div class="stage"><iframe title="A" data-v="good"></iframe></div></div>
    <div class="bad"><div class="head"><span class="side">B</span><span class="pill">违反</span><span class="say">眉标、标题、导语和三个按钮一样响，视线无处落脚</span><button class="open" data-v="bad">新标签打开</button></div><div class="stage"><iframe title="B" data-v="bad"></iframe></div></div>
  </div>
</div>
<script>
(function(){
  var PAGE = "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Ember &amp; Oak Coffee Roasters<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600&family=Manrope:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n<style>\n  *{box-sizing:border-box;margin:0;padding:0}\n  body{font-family:Manrope,system-ui,sans-serif;background:#15110e;color:#efe6da;-webkit-font-smoothing:antialiased}\n  a{color:inherit;text-decoration:none}\n  .wrap{max-width:1184px;margin:0 auto;padding:0 52px}\n  nav{display:flex;align-items:center;height:88px;gap:40px}\n  .logo{font-family:Fraunces,serif;font-size:23px;font-weight:400;letter-spacing:.01em;margin-right:auto}\n  .logo i{font-style:normal;color:#d6a25a}\n  .links{display:flex;gap:34px;font-size:14px;color:#9d9184}\n  .order{font-size:14px;padding:9px 18px;border:1px solid #4a4037;border-radius:999px}\n  .hero{display:grid;grid-template-columns:1.08fr .92fr;gap:64px;align-items:center;padding:56px 0 76px}\n  .eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#d6a25a;margin-bottom:24px}\n  h1{font-family:Fraunces,serif;font-weight:300;font-size:80px;line-height:1;letter-spacing:-.025em;margin-bottom:28px}\n  h1 em{font-style:italic;color:#d6a25a}\n  .lead{font-size:18px;line-height:1.65;color:#9d9184;max-width:29em;margin-bottom:40px}\n  .ctas{display:flex;align-items:center;gap:30px}\n  .btn{background:#d6a25a;color:#15110e;font-weight:700;font-size:15px;padding:16px 28px;border-radius:999px}\n  .ghost{font-size:15px;font-weight:500;border-bottom:1px solid #5c5146;padding-bottom:3px}\n  .btn,.ghost,.only-bad{white-space:nowrap}\n  .only-bad{display:none}\n  .art{position:relative;height:470px}\n  .sun{position:absolute;right:10px;top:20px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#e3b06a,#a8692c 70%)}\n  .bag{position:absolute;left:40px;bottom:0;width:250px;height:380px;border-radius:26px 26px 18px 18px;background:#e9dfd0;\n       box-shadow:0 40px 80px rgba(0,0,0,.45);padding:52px 30px 0}\n  .bag:before{content:\"\";position:absolute;left:0;right:0;top:22px;height:2px;background:#cdbfa9}\n  .bag .b1{font-family:Fraunces,serif;font-size:30px;color:#15110e;line-height:1.05}\n  .bag .b2{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#7a6b58;margin-top:14px}\n  .bag .b3{position:absolute;left:30px;right:30px;bottom:30px;border-top:1px solid #cdbfa9;padding-top:14px;font-size:12px;color:#5e5244;line-height:1.7}\n  .cup{position:absolute;right:52px;bottom:12px;width:150px;height:118px;border-radius:0 0 70px 70px;background:#f3ece2;box-shadow:0 30px 60px rgba(0,0,0,.4)}\n  .cup:after{content:\"\";position:absolute;right:-34px;top:22px;width:44px;height:50px;border:10px solid #f3ece2;border-left:0;border-radius:0 30px 30px 0}\n  .feats{display:grid;grid-template-columns:repeat(3,1fr);gap:48px;border-top:1px solid #2c241e;padding:40px 0 56px}\n  .feats h3{font-size:15px;font-weight:600;margin-bottom:8px}\n  .feats p{font-size:14px;line-height:1.65;color:#8b8075}\n\n  /* B：同样的内容，所有元素同样响 —— 没有第一眼 */\n  .bad .links{font-size:18px;font-weight:700;color:#efe6da}\n  .bad .order{background:#e0532f;border-color:#e0532f;font-weight:700;font-size:17px}\n  .bad .eyebrow{font-size:30px;letter-spacing:0;text-transform:none;color:#efe6da;font-weight:700}\n  .bad h1{font-family:Manrope,sans-serif;font-weight:700;font-size:34px;line-height:1.25;letter-spacing:0;margin-bottom:22px}\n  .bad h1 em{font-style:normal;color:inherit}\n  .bad .lead{font-size:28px;font-weight:700;line-height:1.3;color:#efe6da;max-width:none}\n  .bad .ghost{background:#3b7ddd;color:#fff;font-weight:700;border:0;padding:16px 28px;border-radius:999px}\n  .bad .only-bad{display:inline-block;background:#3f9b5c;color:#fff;font-weight:700;font-size:15px;padding:16px 28px;border-radius:999px}\n  .bad .ctas{gap:14px}\n  .bad .feats h3{font-size:28px;font-weight:700}\n  .bad .feats p{font-size:18px;color:#efe6da}\n<\/style>\n<\/head>\n<body class=\"{{V}}\">\n<div class=\"wrap\">\n  <nav>\n    <a class=\"logo\" href=\"#\">Ember <i>&amp;<\/i> Oak<\/a>\n    <div class=\"links\"><a href=\"#\">Coffee<\/a><a href=\"#\">Subscriptions<\/a><a href=\"#\">Wholesale<\/a><a href=\"#\">Journal<\/a><\/div>\n    <a class=\"order\" href=\"#\">Order<\/a>\n  <\/nav>\n  <section class=\"hero\">\n    <div>\n      <p class=\"eyebrow\">Small-batch roastery &middot; Portland, since 2014<\/p>\n      <h1>Coffee roasted <em>the slow way.<\/em><\/h1>\n      <p class=\"lead\">We buy from eleven farms we have visited ourselves, roast twice a week in a 1962 Probat, and ship within 48 hours of the roast.<\/p>\n      <div class=\"ctas\"><a class=\"btn\" href=\"#\">Shop this week&rsquo;s roast<\/a><a class=\"ghost\" href=\"#\">Visit the roastery<\/a><a class=\"only-bad\" href=\"#\">Subscribe &amp; save<\/a><\/div>\n    <\/div>\n    <div class=\"art\">\n      <div class=\"sun\"><\/div>\n      <div class=\"bag\"><div class=\"b1\">Huila<br>No. 7<\/div><div class=\"b2\">Colombia &middot; Washed<\/div>\n        <div class=\"b3\">Notes of red apple, panela and cocoa.<br>Roasted 03 Nov &middot; 250 g<\/div><\/div>\n      <div class=\"cup\"><\/div>\n    <\/div>\n  <\/section>\n  <section class=\"feats\">\n    <div><h3>Direct trade<\/h3><p>Every bag names the farm and what we paid for it, usually 2.5 times the commodity price.<\/p><\/div>\n    <div><h3>Roasted to order<\/h3><p>Nothing sits on a shelf. Your coffee is roasted after you order it, not before.<\/p><\/div>\n    <div><h3>Free refills, forever<\/h3><p>Bring the tin back to either caf&eacute; and we refill it at cost, as many times as you like.<\/p><\/div>\n  <\/section>\n<\/div>\n<\/body>\n<\/html>\n";
  var W = 1280, H = 800;
  var full = false, embedded = window.parent !== window;
  function doc(v){ return PAGE.replace('{{V}}', v); }
  var frames = [].slice.call(document.querySelectorAll('.stage iframe'));
  // 一页正文里有十来个对比组件：滚到附近才把两张网页放进去，免得一开页就渲染二十张
  function load(){ frames.forEach(function(f){ if (!f.srcdoc) f.srcdoc = doc(f.dataset.v); }); }
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function(es){
      if (es.some(function(e){ return e.isIntersecting; })) { load(); io.disconnect(); }
    }, {rootMargin: '800px 0px'});
    io.observe(document.querySelector('.card'));
  } else load();

  function layout(){
    var room = full ? window.innerHeight - 56 - 120 : Infinity;   // 放大态按视口高度封顶
    frames.forEach(function(f){
      var st = f.parentNode, w = st.clientWidth;
      var s = Math.min(w / W, room / H);
      st.style.height = Math.round(H * s) + 'px';
      f.style.transform = 'translate(' + Math.max(0, (w - W * s) / 2) + 'px,0) scale(' + s + ')';
    });
    if (embedded && !full) window.parent.postMessage({type: 'kc-height', h: document.querySelector('.card').offsetHeight + 2}, '*');
  }
  window.addEventListener('resize', layout);
  layout();

  [].slice.call(document.querySelectorAll('.open')).forEach(function(b){
    b.onclick = function(){
      var url = URL.createObjectURL(new Blob([doc(b.dataset.v)], {type: 'text/html'}));
      window.open(url, '_blank');
      setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
    };
  });

  var panels = [].slice.call(document.querySelectorAll('.grid > div'));
  var flips = [].slice.call(document.querySelectorAll('.flip button'));
  var sel = 0;
  function pick(i){
    sel = i;
    panels.forEach(function(p, k){ p.classList.toggle('sel', k === i); });
    flips.forEach(function(b, k){ b.classList.toggle('on', k === i); });
    layout();
  }
  flips.forEach(function(b, k){ b.onclick = function(){ pick(k); }; });

  var zoom = document.getElementById('zoom');
  function setFull(on){
    full = on;
    document.body.classList.toggle('full', on);
    zoom.textContent = on ? '收起' : '放大对比';
    layout();
  }
  zoom.onclick = function(){
    if (!embedded) { setFull(!full); return; }
    window.parent.postMessage({type: full ? 'kc-collapse' : 'kc-expand'}, '*');
  };
  document.body.addEventListener('click', function(e){
    if (full && e.target === document.body) window.parent.postMessage({type: 'kc-collapse'}, '*');
  });
  window.addEventListener('keydown', function(e){
    if (!full) return;
    if (e.key === 'Escape') window.parent.postMessage({type: 'kc-collapse'}, '*');
    if (e.key === ' ' || e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); pick(1 - sel); }
  });
  // 父页放大 / 还原好 iframe 后回 ack，这边排好版再回话，父页才显影
  window.addEventListener('message', function(e){
    if (e.source !== window.parent || !e.data || typeof e.data !== 'object') return;
    if (e.data.type === 'kc-expand-ack')   { setFull(true);  window.parent.postMessage({type: 'kc-modal-ready'}, '*'); }
    if (e.data.type === 'kc-collapse-ack') { setFull(false); window.parent.postMessage({type: 'kc-revealed'}, '*'); }
  });
})();
</script>
</body>
</html>
