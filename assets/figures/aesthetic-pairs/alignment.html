<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A2 对齐</title>
<style>
  :root{--ink:#111418;--soft:#5b636e;--line:#e4e7ec;--band:#f6f7f9;--ok:#0b7a4b;--ok-bg:#e6f5ed;--bad:#b42318;--bad-bg:#fdecea;
        --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace}
  *{box-sizing:border-box}
  html,body{margin:0;background:transparent;color:var(--ink);
            font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .top{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--band);border-bottom:1px solid var(--line)}
  .tag{font:600 10.5px/1 var(--mono);letter-spacing:.08em;color:var(--soft);text-transform:uppercase}
  .query{flex:1;min-width:0;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rule{font-size:12px;color:var(--soft);white-space:nowrap}
  button{font:inherit;font-size:12px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 11px;cursor:pointer}
  button:hover{border-color:#c5cad3}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:14px}
  .head{display:flex;align-items:center;gap:8px;margin-bottom:8px;min-height:24px}
  .side{font:700 12px/1 var(--mono);width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:var(--ink);color:#fff;flex:none}
  .pill{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;flex:none}
  .ok .pill{color:var(--ok);background:var(--ok-bg)} .bad .pill{color:var(--bad);background:var(--bad-bg)}
  .say{flex:1;min-width:0;color:var(--soft);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .open{border:0;background:none;color:#2f6bff;padding:0 2px}
  .stage{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:#eef0f3}
  .stage iframe{position:absolute;top:0;left:0;width:1280px;height:800px;border:0;transform-origin:0 0;background:#fff}
  @media (max-width:720px){.grid{grid-template-columns:1fr}.say,.query{white-space:normal}.rule{display:none}}
  /* 放大态：父页把本 iframe 铺满视口，这里画成居中的大卡片，点卡片外收起 */
  body.full{height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}
  body.full .card{width:min(100%,2400px);box-shadow:0 24px 80px rgba(0,0,0,.35)}
  /* 放大态只放一张、尽量大，A / B 原地切换（空格或方向键），差别最容易看出来 */
  .flip{display:none;gap:2px;background:#e9ecf1;border-radius:999px;padding:3px}
  .flip button{border:0;background:none;padding:4px 12px}
  .flip button.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.12)}
  body.full .flip{display:inline-flex}
  body.full .grid{grid-template-columns:1fr}
  body.full .grid > div{display:none}
  body.full .grid > div.sel{display:block}
</style>
</head>
<body>
<div class="card">
  <div class="top"><span class="tag">Query</span><span class="query">为设计大会 Form/Function 2026 做活动页</span><span class="rule">A2 · 对齐</span><span class="flip" title="空格或方向键切换"><button class="on">A 符合</button><button>B 违反</button></span><button id="zoom">放大对比</button></div>
  <div class="grid">
    <div class="ok sel"><div class="head"><span class="side">A</span><span class="pill">符合</span><span class="say">所有块都落在 12 栏栅格的同一组竖线上</span><button class="open" data-v="good">新标签打开</button></div><div class="stage"><iframe title="A" data-v="good"></iframe></div></div>
    <div class="bad"><div class="head"><span class="side">B</span><span class="pill">违反</span><span class="say">居中、左齐、右齐混用，讲者卡片上下左右各错几十像素</span><button class="open" data-v="bad">新标签打开</button></div><div class="stage"><iframe title="B" data-v="bad"></iframe></div></div>
  </div>
</div>
<script>
(function(){
  var PAGE = "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Form/Function 2026<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap\" rel=\"stylesheet\">\n<style>\n  *{box-sizing:border-box;margin:0;padding:0}\n  body{font-family:\"Space Grotesk\",system-ui,sans-serif;background:#f7f6f2;color:#0f0f0f;-webkit-font-smoothing:antialiased}\n  a{color:inherit;text-decoration:none}\n  .wrap{max-width:1184px;margin:0 auto;padding:0 52px}\n  .mono{font-family:\"IBM Plex Mono\",monospace;font-size:13px;letter-spacing:.02em}\n  nav{display:grid;grid-template-columns:repeat(12,1fr);column-gap:24px;align-items:center;height:76px;border-bottom:1.5px solid #0f0f0f}\n  .logo{grid-column:1/5;font-weight:700;font-size:19px}\n  .logo span{color:#ff4122}\n  .links{grid-column:7/13;display:flex;justify-content:space-between;font-size:15px}\n  .links .tix{color:#ff4122;font-weight:700}\n  .hero{display:grid;grid-template-columns:repeat(12,1fr);column-gap:24px;padding:44px 0 36px}\n  .label{grid-column:1/13;margin-bottom:18px;color:#ff4122}\n  h1{grid-column:1/11;font-size:92px;line-height:.95;letter-spacing:-.035em;font-weight:700;margin-bottom:34px}\n  .intro{grid-column:1/7;font-size:18px;line-height:1.55;color:#3c3c3c}\n  .meta{grid-column:7/13;display:grid;grid-template-columns:repeat(3,1fr);column-gap:24px;align-self:end}\n  .meta b{display:block;font-size:34px;font-weight:500;letter-spacing:-.02em}\n  .meta span{display:block;font-size:13px;color:#6b6b6b;margin-top:4px}\n  .sec{display:grid;grid-template-columns:repeat(12,1fr);column-gap:24px;border-top:1.5px solid #0f0f0f;padding-top:18px}\n  .sec h2{grid-column:1/4;font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}\n  .sec .all{grid-column:10/13;text-align:right}\n  .speakers{display:grid;grid-template-columns:repeat(4,1fr);column-gap:24px;padding:22px 0 40px}\n  .ph{height:178px;position:relative;overflow:hidden;margin-bottom:14px}\n  .ph i{position:absolute;border-radius:50%;width:74px;height:74px;left:50%;margin-left:-37px;top:40px}\n  .ph b{position:absolute;width:150px;height:110px;border-radius:75px 75px 0 0;left:50%;margin-left:-75px;bottom:-30px}\n  .p1{background:#e4ded1}.p1 i,.p1 b{background:#2b2b2b}\n  .p2{background:#ff4122}.p2 i,.p2 b{background:#f7f6f2}\n  .p3{background:#2b2b2b}.p3 i,.p3 b{background:#d9d3c5}\n  .p4{background:#d2dbe0}.p4 i,.p4 b{background:#ff4122}\n  .sp h3{font-size:19px;font-weight:500}\n  .sp p{font-size:14px;color:#6b6b6b;margin-top:3px}\n  .sched .row{display:grid;grid-template-columns:repeat(12,1fr);column-gap:24px;padding:14px 0;border-top:1px solid #cfccc4;font-size:16px}\n  .sched .t{grid-column:1/3}.sched .n{grid-column:3/10}.sched .s{grid-column:10/13;color:#6b6b6b}\n\n  /* B：同样的内容，每块各找各的位置 —— 没有共同的边 */\n  .bad .links{grid-column:5/11;justify-content:center;gap:30px}\n  .bad .label{margin-left:93px}\n  .bad h1{grid-column:1/13;text-align:center;font-size:84px}\n  .bad .intro{grid-column:1/8;margin-left:41px;text-align:center;font-size:17px}\n  .bad .meta{grid-column:8/13;text-align:right;margin-right:-28px;align-self:start;margin-top:22px}\n  .bad .sec h2{grid-column:4/10;text-align:center}\n  .bad .sec .all{grid-column:10/12;text-align:left;margin-left:17px}\n  .bad .sp:nth-child(2){margin-top:30px;margin-left:16px}\n  .bad .sp:nth-child(3){margin-top:9px;width:84%;margin-left:auto;text-align:right}\n  .bad .sp:nth-child(4){margin-top:48px;margin-left:14px;text-align:center}\n  .bad .sched .row:nth-child(2) .n{margin-left:34px}\n  .bad .sched .row:nth-child(3) .t{text-align:center}\n  .bad .sched .row:nth-child(3) .s{text-align:right}\n<\/style>\n<\/head>\n<body class=\"{{V}}\">\n<div class=\"wrap\">\n  <nav>\n    <a class=\"logo\" href=\"#\">Form<span>/<\/span>Function 2026<\/a>\n    <div class=\"links\"><a href=\"#\">Programme<\/a><a href=\"#\">Speakers<\/a><a href=\"#\">Venue<\/a><a href=\"#\">Workshops<\/a><a class=\"tix\" href=\"#\">Tickets<\/a><\/div>\n  <\/nav>\n  <section class=\"hero\">\n    <p class=\"label mono\">Lisbon &middot; 14&ndash;16 May 2026 &middot; Cinema S&atilde;o Jorge<\/p>\n    <h1>Design that works for people.<\/h1>\n    <p class=\"intro\">Three days of talks and workshops on interfaces that hold up in the real world: on slow phones, in bright sun, for tired people in a hurry.<\/p>\n    <div class=\"meta\"><div><b>1,200<\/b><span>attendees<\/span><\/div><div><b>48<\/b><span>talks<\/span><\/div><div><b>16<\/b><span>workshops<\/span><\/div><\/div>\n  <\/section>\n  <div class=\"sec\"><h2>Speakers<\/h2><a class=\"all mono\" href=\"#\">All 48 speakers<\/a><\/div>\n  <section class=\"speakers\">\n    <div class=\"sp\"><div class=\"ph p1\"><i><\/i><b><\/b><\/div><h3>Ines Carvalho<\/h3><p>Design Director, Feedzai<\/p><\/div>\n    <div class=\"sp\"><div class=\"ph p2\"><i><\/i><b><\/b><\/div><h3>Tomasz Wr&oacute;bel<\/h3><p>Type Designer, Kontrapunkt<\/p><\/div>\n    <div class=\"sp\"><div class=\"ph p3\"><i><\/i><b><\/b><\/div><h3>Amara Okafor<\/h3><p>Accessibility Lead, GOV.UK<\/p><\/div>\n    <div class=\"sp\"><div class=\"ph p4\"><i><\/i><b><\/b><\/div><h3>Kenji Morita<\/h3><p>Principal Designer, Figma<\/p><\/div>\n  <\/section>\n  <div class=\"sec\"><h2>Day one<\/h2><a class=\"all mono\" href=\"#\">Full programme<\/a><\/div>\n  <section class=\"sched\">\n    <div class=\"row mono\"><span class=\"t\">09:30<\/span><span class=\"n\">Opening: the cost of a bad default<\/span><span class=\"s\">Ines Carvalho<\/span><\/div>\n    <div class=\"row mono\"><span class=\"t\">10:15<\/span><span class=\"n\">Type that survives a 4-inch screen<\/span><span class=\"s\">Tomasz Wr&oacute;bel<\/span><\/div>\n    <div class=\"row mono\"><span class=\"t\">11:30<\/span><span class=\"n\">Forms nobody has to fill twice<\/span><span class=\"s\">Amara Okafor<\/span><\/div>\n  <\/section>\n<\/div>\n<\/body>\n<\/html>\n";
  var W = 1280, H = 800;
  var full = false, embedded = window.parent !== window;
  function doc(v){ return PAGE.replace('{{V}}', v); }
  var frames = [].slice.call(document.querySelectorAll('.stage iframe'));
  // 一页正文里有十来个对比组件：滚到附近才把两张网页放进去，免得一开页就渲染二十张
  function load(){ frames.forEach(function(f){ if (!f.srcdoc) f.srcdoc = doc(f.dataset.v); }); }
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function(es){
      if (es.some(function(e){ return e.isIntersecting; })) { load(); io.disconnect(); }
    }, {rootMargin: '800px 0px'});
    io.observe(document.querySelector('.card'));
  } else load();

  function layout(){
    var room = full ? window.innerHeight - 56 - 120 : Infinity;   // 放大态按视口高度封顶
    frames.forEach(function(f){
      var st = f.parentNode, w = st.clientWidth;
      var s = Math.min(w / W, room / H);
      st.style.height = Math.round(H * s) + 'px';
      f.style.transform = 'translate(' + Math.max(0, (w - W * s) / 2) + 'px,0) scale(' + s + ')';
    });
    if (embedded && !full) window.parent.postMessage({type: 'kc-height', h: document.querySelector('.card').offsetHeight + 2}, '*');
  }
  window.addEventListener('resize', layout);
  layout();

  [].slice.call(document.querySelectorAll('.open')).forEach(function(b){
    b.onclick = function(){
      var url = URL.createObjectURL(new Blob([doc(b.dataset.v)], {type: 'text/html'}));
      window.open(url, '_blank');
      setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
    };
  });

  var panels = [].slice.call(document.querySelectorAll('.grid > div'));
  var flips = [].slice.call(document.querySelectorAll('.flip button'));
  var sel = 0;
  function pick(i){
    sel = i;
    panels.forEach(function(p, k){ p.classList.toggle('sel', k === i); });
    flips.forEach(function(b, k){ b.classList.toggle('on', k === i); });
    layout();
  }
  flips.forEach(function(b, k){ b.onclick = function(){ pick(k); }; });

  var zoom = document.getElementById('zoom');
  function setFull(on){
    full = on;
    document.body.classList.toggle('full', on);
    zoom.textContent = on ? '收起' : '放大对比';
    layout();
  }
  zoom.onclick = function(){
    if (!embedded) { setFull(!full); return; }
    window.parent.postMessage({type: full ? 'kc-collapse' : 'kc-expand'}, '*');
  };
  document.body.addEventListener('click', function(e){
    if (full && e.target === document.body) window.parent.postMessage({type: 'kc-collapse'}, '*');
  });
  window.addEventListener('keydown', function(e){
    if (!full) return;
    if (e.key === 'Escape') window.parent.postMessage({type: 'kc-collapse'}, '*');
    if (e.key === ' ' || e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); pick(1 - sel); }
  });
  // 父页放大 / 还原好 iframe 后回 ack，这边排好版再回话，父页才显影
  window.addEventListener('message', function(e){
    if (e.source !== window.parent || !e.data || typeof e.data !== 'object') return;
    if (e.data.type === 'kc-expand-ack')   { setFull(true);  window.parent.postMessage({type: 'kc-modal-ready'}, '*'); }
    if (e.data.type === 'kc-collapse-ack') { setFull(false); window.parent.postMessage({type: 'kc-revealed'}, '*'); }
  });
})();
</script>
</body>
</html>
