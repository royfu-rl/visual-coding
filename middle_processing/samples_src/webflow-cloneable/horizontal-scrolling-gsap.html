<script>

const $body = document.querySelector(".body");
const $wrapper = document.querySelector(".projects-collection-list");
const $items = document.querySelectorAll(".project-item");
let menuWidth = $body.clientWidth;
let itemWidth = $items[0].clientWidth;
let wrapWidth = $items.length * itemWidth;

let scrollY = 0;
let actualSroll = 0;
let dragStart = 0;

const lerp = (v0, v1, t) => {
  return v0 * (1 - t) + v1 * t;
};

window.addEventListener("resize", () => {
  menuWidth = $body.clientWidth;
  itemWidth = $items[0].clientWidth;
  wrapWidth = $items.length * itemWidth;
});

// Scroll Horizantal
function scrollHorizantal(scrollY) {
  let actualSroll = lerp(0, scrollY, 0.1);

  gsap.set($items, {
    x: (i, target) => {
      target.style.position = "absolute";
      return i * itemWidth + actualSroll;
    },
    modifiers: {
      x: (x, target) => {
        const s = gsap.utils.wrap(
          -itemWidth,
          wrapWidth - itemWidth,
          parseInt(x)
        );
        return `${s}px`;
      }
    }
  });

  // Calucalte progress
  let progress = -actualSroll / wrapWidth;
  let fraction = progress - Math.floor(progress);
  $(".progress-text").text(`${Math.round(fraction * 100)}%`);
}

//Rotate based on speed
function rotationByVelocity(v) {
  let velocity = -(v * 0.0009);
  let speed = gsap.utils.clamp(-6, 6, velocity);
  gsap.to($wrapper, {
    rotation: speed
  });
}

scrollHorizantal(scrollY);
Observer.create({
  target: window,
  type: "wheel, pointer",
  lockAxis: true,
  onChangeY: (self) => {
    if (!self.isDragging) {
      scrollY -= self.deltaY * 10;
      scrollHorizantal(scrollY);
      rotationByVelocity(self.velocityY);
    }
  },
  onDragStart: (self) => {
    dragStart = Math.round(self.x);
  },
  onDrag: (self) => {
    scrollY += (self.x - dragStart) * 25;
    dragStart = self.x;
    scrollHorizantal(scrollY);
  }
});

</script>



<script>
// Preload images
const preloadImages = (selector = 'img') => {
    return new Promise((resolve) => {
        imagesLoaded(document.querySelectorAll(selector), {background: true}, resolve);
    });
};

/**
 * Class representing an image that has the repetitive hover effect 
 */
class ImageHover {
    // DOM elements
    DOM = {
        // main element (.image)
        el: null,
        // .image__element
        innerElems: null,
    }
    // Background image path
    bgImage;
    // Total inner image elments
    totalInnerElems;
    // Hover timeline
    hoverTimeline;

    /**
     * Constructor.
     * @param {Element} DOM_el - the .image element
     */
    constructor(DOM_el) {
        this.DOM = {el: DOM_el};
        
        // Get bg image url
        
        const style = window.getComputedStyle(this.DOM.el, false)  
				this.bgImage = style.backgroundImage.slice(4, -1).replace(/"/g, "");
        
        // Remove bg image
        gsap.set(this.DOM.el, {backgroundImage: 'none'});

        // Add the .image__element inner elements (data-repetition-elems times)
        // First inner element will have a wrapper with overflow hidden so it's image child can scale up or down
        this.totalInnerElems = +this.DOM.el.dataset.repetitionElems || 4;
        // Minimum of two inner elments
        this.totalInnerElems = this.totalInnerElems <= 1 ? 2 : this.totalInnerElems;
        
        let innerHTML = '';
        for (let i = 0, len = this.totalInnerElems || 1; i <= len - 1; ++i) {
            innerHTML += i === 0 ? 
                `<div class="image-element__wrap"><div class="image__element" style="background-image:url(${this.bgImage})"></div></div>` :
                `<div class="image__element" style="background-image:url(${this.bgImage})"></div>`    
        }

        // Append
        this.DOM.el.innerHTML = innerHTML;

        // Get inner .image__element
        this.DOM.innerElems = this.DOM.el.querySelectorAll('.image__element');

        // transform origin
        gsap.set([this.DOM.el, this.DOM.innerElems[0]], {transformOrigin: this.DOM.el.dataset.repetitionOrigin || '50% 50%'});
        
        // Hover timeline
        this.createHoverTimeline();

        this.initEvents();
    }

    /**
     * Create the gsap timeline for the hover in/out animation
     */
    createHoverTimeline() {
        const property = this.DOM.el.dataset.repetitionAnimate || 'scale';
        let animationProperties = {
            duration: this.DOM.el.dataset.repetitionDuration || 0.8,
            ease: this.DOM.el.dataset.repetitionEase || 'power2.inOut',
            stagger: this.DOM.el.dataset.repetitionStagger || -0.1
        }, 
        firstInnerElementProperties = {};

        animationProperties[property] = i => +!i;
        // initial scale of first inner element
        firstInnerElementProperties[property] = this.DOM.el.dataset.repetitionInitialScale || 2;
        
        this.hoverTimeline = gsap.timeline({paused: true})
        .set(this.DOM.innerElems[0], firstInnerElementProperties)
        .to([this.DOM.innerElems], animationProperties, 0)
    }

    /**
     * Initializes the events on the image elemment
     */
    initEvents() {
        this.onMouseEnterFn = () => this.mouseEnter();
        this.onMouseLeaveFn = () => this.mouseLeave();
        this.DOM.el.addEventListener('mouseenter', this.onMouseEnterFn);
        this.DOM.el.addEventListener('mouseleave', this.onMouseLeaveFn);
    }

    /**
     * mouse enter
     */
    mouseEnter() {
        this.hoverTimeline.play();
    }

    /**
     * mouse leave
     */
     mouseLeave() {
        this.hoverTimeline.reverse();
    }
}

preloadImages('[data-repetition]').then(() => {
    // Initialize the hover effect on the images
    [...document.querySelectorAll('.project-img-wrapper')].forEach(el => new ImageHover(el));
});

</script>
