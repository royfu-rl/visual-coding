 class="t"><div class="clip t-clip"><div class="clip-inner_text letter-t">t</div><div class="clip-counter_wrap"><div class="clip-counter_text">1</div><div class="clip-counter_text">0</div><div class="clip-counter_text">0</div></div></div></div><div class="e clip"><div class="clip-inner_text">e</div></div></div><div class="hero_text-anything"><div class="a clip"><div class="clip-inner_text a2">a</div><div class="clip-inner_text is-absolute">a</div></div><div class="n clip"><div class="clip-inner_text">n</div><div class="clip-inner_text is-absolute">n</div></div><div class="y"><div class="clip-inner_text">y</div></div><div class="t"><div class="clip-inner_text">t</div><div class="hero_flair-thunderbolt"><div class="hero_flair-embed w-embed"><svg class="flair-svg" viewBox="0 0 134 229" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

  function initHomeHero(block) {
    const DOM = {
      heading1: block.querySelector(".hero_text-animate"),
      heading2: block.querySelector(".hero_text-anything"),
      button: block.querySelector(".hero_cta"),
      squiggle: block.querySelector("#home-hero-squiggle"),
    };

    const selector = {
      animate: gsap.utils.selector(DOM.heading1),
      anything: gsap.utils.selector(DOM.heading2),
    };

    const defaults = {
      ease: "power2.out",
      duration: 0.6,
    };

    function initSquiggleMouseMovement() {
      let windowWidth = window.innerWidth;
      let windowHeight = window.innerHeight;

      const xTo = gsap.quickTo(DOM.squiggle, "xPercent", {
        duration: 1,
        ease: "power3",
      });
      const yTo = gsap.quickTo(DOM.squiggle, "yPercent", {
        duration: 1,
        ease: "power3",
      });
      const rotateTo = gsap.quickTo(DOM.squiggle, "rotation", {
        duration: 1,
        ease: "power3",
      });

      window.addEventListener("resize", () => {
        windowWidth = window.innerWidth;
        windowHeight = window.innerHeight;
      });

      window.addEventListener("mousemove", (e) => {
        const xPercent = gsap.utils.mapRange(0, windowWidth, -20, 20, e.x);
        const yPercent = gsap.utils.mapRange(0, windowHeight, -20, 20, e.y);
        const rotateRange = gsap.utils.clamp(
          -1,
          1,
          gsap.utils.mapRange(windowWidth * 0.25, windowWidth * 0.75, 1, -1, e.x)
        );

        rotateTo(yPercent * rotateRange);
        xTo(xPercent);
        yTo(yPercent);
      });
    }

    function char1() {
      const tl = gsap.timeline({ defaults });
      const wrap = selector.animate(".a > div");
      const char = selector.animate(".a > div > div");

      tl.set(wrap, { transformOrigin: "bottom" });
      tl.from(char, { yPercent: 100 });
      tl.from(
        wrap,
        { rotationX: -180, ease: "back.out(1.7)", duration: 1 },
        "-=.4"
      );

      return tl;
    }

    function char2() {
      const tl = gsap.timeline({ defaults });
      const circles = selector.animate(".home_flair-circles");
      const circlesSvg = selector.animate(".home_flair-circles img");
      const windmill = selector.animate(".hero_flair");
      const wrap = selector.animate(".n > div > div");
      const chars = selector.animate(".n > div > div > div");

      tl.set(chars[1], { autoAlpha: 1 });
      tl.set(circles, { autoAlpha: 1, yPercent: 0 });
      tl.from(circlesSvg, { scale: 0, ease: "back.out(1.7)" });
      tl.to(circles, {
        yPercent: -200,
        autoAlpha: 0,
        duration: 1.5,
        ease: "power4.out",
      });
      tl.from(wrap, { yPercent: 100, duration: 0.4 }, "<");
      tl.from(
        windmill,
        {
          x: () => window.innerWidth / -2,
          rotationZ: -360,
          duration: 1,
        },
        "<"
      );

      tl.from(chars[0], { rotationY: -180, duration: 0.3 }, "+=.4");
      tl.to(chars[1], { rotationY: 180, duration: 0.3 }, "<");
      tl.to(
        windmill,
        {
          rotationZ: 90,
          duration: 0.3,
          repeat: -1,
          repeatDelay: 1,
        },
        "<"
      );

      return tl;
    }

    const char3 = () =>
    gsap.from(selector.animate(".i > div"), {
      yPercent: -105,
      ease: "back.out(1.4)",
      duration: 1,
    });

    const char4 = () =>
    gsap.from(selector.animate(".m > div"), {
      xPercent: -100,
      ...defaults,
    });

    function char5() {
      const tl = gsap.timeline({ defaults });
      const wrap = selector.animate(".a2");
      const star = selector.animate(".hero_flair-star");
      const starSvg = selector.animate(".hero_flair-star img");
      const char = selector.animate(".a2 > div > div");

      tl.set(star, { xPercent: -150, autoAlpha: 1 });
      tl.from(starSvg, { scale: 0, duration: 0.4 });
      tl.add(char4(), "+=.6");
      tl.to(star, { xPercent: 0 }, "<");
      tl.set(wrap, { overflow: "hidden" });
      tl.to(star, { yPercent: 130, ease: "power2.in" }, "+=.5");
      tl.from(char, { yPercent: 100 }, "-=.3");
      tl.to(starSvg, { rotationZ: 360, ease: "none", repeat: 2, duration: 2 }, 0);

      return tl;
    }

    function char6() {
      const tl = gsap.timeline({ defaults });
      const char = selector.animate(".t > div > div")[0];
      const numbersWrap = selector.animate(".t > div > div");
      const numbers = selector.animate(".t > div > div > div");

      tl.set(numbersWrap, { autoAlpha: 1 });
      tl.from(numbers[0], { yPercent: 110, duration: 0.4 }, "<");
      tl.fromTo(
        [numbers[1], numbers[2]],
        { yPercent: 110 },
        { yPercent: -110, duration: 0.9, stagger: 0.1, ease: "power2.inOut" },
        "+=.2"
      );
      tl.to(numbers[0], { yPercent: -110 }, "-=.6");
      tl.from(char, { yPercent: 110, duration: 0.9 }, "<");
      tl.add(char7(), "<");

      return tl;
    }

    const char7 = () =>
    gsap.from(selector.animate(".e > div"), {
      yPercent: 100,
      duration: 0.9,
    });

    function char8to9() {
      const tl = gsap.timeline({ defaults });
      const topChars = selector.anything(
        ".a div:first-of-type, .n div:first-of-type"
      );
      const bottomChars = selector.anything(
        ".a div:last-of-type, .n div:last-of-type"
      );

      tl.fromTo(
        bottomChars,
        {
          yPercent: 105,
        },
        {
          keyframes: {
            yPercent: [105, 0, 105, 0],
            ease: "power1.out",
          },
          duration: 3,
          stagger: 0.4,
        }
      );

      tl.fromTo(
        topChars,
        {
          yPercent: -105,
        },
        {
          keyframes: {
            yPercent: [-105, -105, 20, -105],
            ease: "power1.out",
          },
          duration: 3,
          stagger: 0.4,
        },
        "<"
      );

      return tl;
    }

    const char10 = () =>
    gsap.from(selector.anything(".y > div"), {
      rotationY: -180,
      duration: 1,
      scale: 0,
    });

    function char11() {
      const tl = gsap.timeline({ defaults });
      const bolt = selector.anything(".hero_flair-thunderbolt");
      const path = selector.anything(".flair-svg #bolt-path");
      const rect = selector.anything(".flair-svg #bolt-rect");
      const char = selector.anything(".t .clip-inner_text");

      tl.set(bolt, { autoAlpha: 1 });
      tl.from(path, { drawSVG: "0", duration: 1, ease: "power3.inOut" });
      tl.from(
        rect,
        {
          yPercent: 100,
          transformOrigin: "50% 100%",
          duration: 3.5,
          ease: "power4.out",
        },
        "<.5"
      );
      tl.from(
        bolt,
        {
          keyframes: {
            scale: [1, 1.1, 0.6, 0.7, 0.2, 0.3, 0],
            duration: 2,
          },
        },
        "-=2"
      );
      tl.from(char, { scale: 0, ease: "back.out(1.4)" }, "<.5");

      return tl;
    }

    function char12() {
      const tl = gsap.timeline({ defaults });
      const worm = selector.anything(".hero_squiggle-wrap img");
      const char = selector.anything(".h div div");

      tl.from(worm, {
        autoAlpha: 0,
        duration: 1.5,
        yPercent: 100,
        rotationZ: 180,
        ease: "back.out(1.6)",
      });
      tl.from(char, { yPercent: -105 }, "<.2");

      return tl;
    }

    function char13() {
      const tl = gsap.timeline({ defaults });
      const char = selector.anything(".i > div");

      tl.from(char, { autoAlpha: 0, duration: 0.1 }, "<");
      tl.from(char, { rotationX: -450, duration: 1.3 }, "<.14");
      tl.add(char14(), "<+=.5");
      tl.to(
        char,
        {
          rotationX: 540,
          duration: 1.5,
          repeat: -1,
          repeatDelay: 3,
          yoyo: true,
          yoyoEase: "power2.out",
        },
        "+=2"
      );

      return tl;
    }

    const char14 = () =>
    gsap.timeline({ defaults }).from(selector.anything(".n2 div"), {
      xPercent: -100,
    });

    const char15 = () =>
    gsap.timeline({ defaults }).from(selector.anything(".g div"), {
      autoAlpha: 0,
      rotationZ: -120,
      duration: 2,
      ease: "elastic.out(1, 0.4)",
    });

    const buttonIn = () =>
    gsap.from([DOM.button, ".hero_subtext"], {
      autoAlpha: 0,
      yPercent: 30,
      ...defaults,
    });

    function createTimeline() {
      const tl = gsap.timeline({
        id: "home-hero",
        defaults,
      });

      tl.set([DOM.heading1, DOM.heading2], { autoAlpha: 1 });

      tl.add(char1());
      tl.add(char2(), 0.4);
      tl.add(char3(), 1);
      tl.add(char5(), 0.8); // includes char4
      tl.add(char6(), 1.1); // includes char7
      tl.add(char8to9(), 1.5);
      tl.add(char10(), 1.7);
      tl.add(char11(), 2);
      tl.add(char12(), 1.9);
      tl.add(char13(), 2.4); // includes char14
      tl.add(char15(), 2.2);
      tl.add(buttonIn(), 3);
    }

    initSquiggleMouseMovement();
    createTimeline();
  }

  document.addEventListener("DOMContentLoaded", () => {
    const heroBlock = document.querySelector(".section_hero");
    if (heroBlock) {
      initHomeHero(heroBlock);
    }
  });
</script>
