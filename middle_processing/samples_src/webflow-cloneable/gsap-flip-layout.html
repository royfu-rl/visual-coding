<script>
document.addEventListener("DOMContentLoaded", () => {
  const allImages = document.querySelectorAll(".loader-img");
  const mainImages = document.querySelectorAll(".loader-img.main");
  const targets = [
    document.querySelector(".style-feature-img-1"),
    document.querySelector(".style-feature-img-2"),
    document.querySelector(".style-feature-img-3")
  ];

  // Delay before action
  setTimeout(() => {
    // 1️⃣ Remove only images without .main
    allImages.forEach(img => {
      if (!img.classList.contains("main")) {
        img.remove();
      }
    });

    // 2️⃣ Move the main ones into target containers with FLIP
    mainImages.forEach((img, index) => {
      if (targets[index]) {
        const state = Flip.getState(img);

        targets[index].appendChild(img);

        Flip.from(state, {
          duration: 1.5,
          absolute: true,
          ease: "power2.inOut"
        });
      }
    });
  }, 4500); 
});
</script>




<!---flip layout--->


<script>
const layout1Btn = document.querySelector(".layout-1-btn");
const layout2Btn = document.querySelector(".layout-2-btn");
const items = document.querySelectorAll(".style-feature-item-1, .style-feature-item-2, .style-feature-item-3,.svg-logo, .text-content,.style-feature-label_1,.style-feature-label-2,.style-feature-label-3,.text-label-address,.text-label-year,.hero-main-img, .text-feature-label,.style-header-link-1,.style-header-link-2,.style-header-link-3,.style-header-link-4,.social-media-wrap");

function changeLayout(layoutClass) {
  // Save state of all feature items
  const state = Flip.getState(items);

  // Remove old classes
  items.forEach(el => {
    el.classList.remove("layout-1", "layout-2");
    el.classList.add(layoutClass);
  });

  // Animate to new state
  Flip.from(state, {
    duration: 0.8,
    ease: "cubic-bezier(0.76,0,0.24,1)",
    absolute: true,
  });
}

layout1Btn.addEventListener("click", () => changeLayout("layout-1"));
layout2Btn.addEventListener("click", () => changeLayout("layout-2"));


</script>


<!---layout button active--->
<script>
const btn1 = document.querySelector(".layout-1-btn");
const btn2 = document.querySelector(".layout-2-btn");

btn1.addEventListener("click", () => {
  btn1.classList.add("active");
  btn2.classList.remove("active");
});

btn2.addEventListener("click", () => {
  btn2.classList.add("active");
  btn1.classList.remove("active");
});
</script></body></html>
