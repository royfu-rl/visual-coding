<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">

  <style>
    .label {
      font-family: sans-serif;
      font-size: 14px;
      fill: #333;
    }
    .hex-label {
      font-family: monospace;
      font-size: 10px;
      fill: #555;
      text-anchor: middle;
    }
  </style>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Palette 1: Warm Earth & Terracotta -->
  <text x="10" y="25" class="label">Palette 1: Warm Earth & Terracotta</text>
  <rect x="10" y="40" width="50" height="50" fill="#FBF8F3" filter="url(#shadow)" />
  <text x="35" y="100" class="hex-label">#FBF8F3</text>

  <rect x="70" y="40" width="50" height="50" fill="#EAE0D5" filter="url(#shadow)" />
  <text x="95" y="100" class="hex-label">#EAE0D5</text>

  <rect x="130" y="40" width="50" height="50" fill="#C6AC8F" filter="url(#shadow)" />
  <text x="155" y="100" class="hex-label">#C6AC8F</text>

  <rect x="190" y="40" width="50" height="50" fill="#B06D5F" filter="url(#shadow)" />
  <text x="215" y="100" class="hex-label">#B06D5F</text>

  <rect x="250" y="40" width="50" height="50" fill="#5E503F" filter="url(#shadow)" />
  <text x="275" y="100" class="hex-label">#5E503F</text>

  <rect x="310" y="40" width="50" height="50" fill="#7C8363" filter="url(#shadow)" />
  <text x="335" y="100" class="hex-label">#7C8363</text>


  <!-- Palette 2: Soft Forest & Blush -->
  <text x="10" y="135" class="label">Palette 2: Soft Forest & Blush</text>
  <rect x="10" y="150" width="50" height="50" fill="#F8F9FA" filter="url(#shadow)" />
  <text x="35" y="210" class="hex-label">#F8F9FA</text>

  <rect x="70" y="150" width="50" height="50" fill="#E9ECEF" filter="url(#shadow)" />
  <text x="95" y="210" class="hex-label">#E9ECEF</text>

  <rect x="130" y="150" width="50" height="50" fill="#DDBEA9" filter="url(#shadow)" />
  <text x="155" y="210" class="hex-label">#DDBEA9</text>

  <rect x="190" y="150" width="50" height="50" fill="#CB997E" filter="url(#shadow)" />
  <text x="215" y="210" class="hex-label">#CB997E</text>

  <rect x="250" y="150" width="50" height="50" fill="#6B705C" filter="url(#shadow)" />
  <text x="275" y="210" class="hex-label">#6B705C</text>

  <rect x="310" y="150" width="50" height="50" fill="#495057" filter="url(#shadow)" />
  <text x="335" y="210" class="hex-label">#495057</text>


  <!-- Palette 3: Natural Linen & Deep Red -->
  <text x="10" y="245" class="label">Palette 3: Natural Linen & Deep Red</text>
  <rect x="10" y="260" width="50" height="50" fill="#FAF6F0" filter="url(#shadow)" />
  <text x="35" y="320" class="hex-label">#FAF6F0</text>

  <rect x="70" y="260" width="50" height="50" fill="#EFEAE4" filter="url(#shadow)" />
  <text x="95" y="320" class="hex-label">#EFEAE4</text>

  <rect x="130" y="260" width="50" height="50" fill="#D3C1AE" filter="url(#shadow)" />
  <text x="155" y="320" class="hex-label">#D3C1AE</text>

  <rect x="190" y="260" width="50" height="50" fill="#A44A3F" filter="url(#shadow)" />
  <text x="215" y="320" class="hex-label">#A44A3F</text>

  <rect x="250" y="260" width="50" height="50" fill="#585149" filter="url(#shadow)" />
  <text x="275" y="320" class="hex-label">#585149</text>

  <rect x="310" y="260" width="50" height="50" fill="#8A817C" filter="url(#shadow)" />
  <text x="335" y="320" class="hex-label">#8A817C</text>

</svg>
